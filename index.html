<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JamBoo — Quiz Generator 9000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════
   BASE
═══════════════════════════════ */
:root{
  --bg:#07071A;
  --panel:#0D0D22;
  --module:#080818;
  --b1:#6600FF;
  --b2:#AA00FF;
  --cyan:#00FFFF;
  --green:#00FF41;
  --pink:#FF00FF;
  --yellow:#FFD700;
  --red:#FF2244;
  --text:#FFFFFF;
  --dim:rgba(255,255,255,.35);
  --fp:'Press Start 2P',monospace;
  --fd:'Fredoka One',cursive;
  --fb:'Nunito',sans-serif;
  --row-border: rgba(102,0,255,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--fp);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:0 0 80px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(102,0,255,.09) 1px,transparent 1px);
  background-size:24px 24px;
}

/* ═══════════════════════════════
   HEADER
═══════════════════════════════ */
.hdr{
  background:linear-gradient(135deg,
    rgba(18,5,28,.93) 0%,
    rgba(90,0,65,.82) 30%,
    rgba(12,5,32,.93) 60%,
    rgba(100,0,80,.78) 100%
  );
  background-size:320% 320%;
  animation:hdrMorph 9s ease-in-out infinite;
  backdrop-filter:blur(16px) saturate(1.6);
  border-bottom:3px solid rgba(255,0,255,.6);
  box-shadow:0 0 42px rgba(255,0,255,.2), 0 5px 14px rgba(255,0,255,.32), inset 0 1px 0 rgba(255,255,255,.07);
  height:110px;
  display:flex;align-items:center;
  position:sticky;top:0;overflow:visible;z-index:100;
  transition:height .35s ease;
}
@keyframes hdrMorph{
  0%  {background-position:0%   50%;}
  33% {background-position:100% 20%;}
  66% {background-position:70%  100%;}
  100%{background-position:0%   50%;}
}
.hdr.hdr-scrolled{
  height:77px;
}
.hdr::before{
  content:'';position:absolute;inset:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(ellipse 55% 200% at 22% 50%, rgba(255,0,180,.22) 0%, transparent 65%),
    radial-gradient(ellipse 45% 180% at 80% 50%, rgba(200,0,255,.18) 0%, transparent 65%),
    radial-gradient(rgba(255,255,255,.55) 1px,transparent 1px),
    radial-gradient(rgba(255,0,255,.38) 1px,transparent 1px);
  background-size:auto,auto,58px 46px,105px 82px;
  background-position:0 0,0 0,12px 10px,44px 26px;
  animation:hdrBlobs 8s ease-in-out infinite alternate;
}
@keyframes hdrBlobs{
  0%  {opacity:.75;transform:scaleX(1);}
  100%{opacity:1;  transform:scaleX(1.09);}
}
.hdr-inner{
  position:relative;z-index:2;width:100%;
  display:flex;align-items:flex-end;justify-content:center;
  padding:0 24px 8px;
}
.hdr-logo{
  height:210px;width:auto;
  position:fixed;left:50%;top:0;z-index:200;
  filter:drop-shadow(0 10px 28px rgba(0,0,0,.9)) drop-shadow(0 0 18px rgba(102,0,255,.4));
  cursor:pointer;image-rendering:pixelated;
  animation:moonBalance 6s ease-in-out infinite;
  transform-origin:center bottom;
}
@keyframes moonBalance{
  0%   { transform:translateX(-50%) translateY(0)    rotate(0deg);    }
  15%  { transform:translateX(-50%) translateY(-7px) rotate(1.4deg);  }
  30%  { transform:translateX(-50%) translateY(-3px) rotate(-0.6deg); }
  45%  { transform:translateX(-50%) translateY(-9px) rotate(1.8deg);  }
  60%  { transform:translateX(-50%) translateY(-4px) rotate(-0.4deg); }
  75%  { transform:translateX(-50%) translateY(-7px) rotate(1.2deg);  }
  90%  { transform:translateX(-50%) translateY(-2px) rotate(-0.3deg); }
  100% { transform:translateX(-50%) translateY(0)    rotate(0deg);    }
}
.hdr-logo:hover{
  animation:none;
  transform:translateX(-50%) scale(1.05) translateY(-8px);
  filter:drop-shadow(0 14px 32px rgba(0,0,0,.9)) drop-shadow(0 0 28px var(--cyan));
  transition:transform .3s ease, filter .3s ease;
}

/* ═══════════════════════════════
   BURGER MENU
═══════════════════════════════ */
.burger-wrap{position:absolute;right:20px;top:50%;transform:translateY(-50%);z-index:30;}
.burger-btn{
  width:36px;height:36px;
  background:#14143A;border:3px solid #2A2A55;box-shadow:3px 3px 0 #000;
  color:var(--dim);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .08s;position:relative;z-index:31;
}
.burger-btn:hover,.burger-btn.open{border-color:var(--cyan);color:var(--cyan);}
.lang-menu{
  display:none;position:absolute;right:0;top:calc(100% + 4px);
  background:#14143A;border:3px solid var(--b1);box-shadow:4px 4px 0 #000;
  z-index:32;min-width:110px;
}
.lang-menu.open{display:block;}
.lang-option{
  display:block;width:100%;padding:9px 14px;
  background:transparent;border:none;border-bottom:2px solid #2A1166;
  color:rgba(255,255,255,.55);font-family:var(--fp);font-size:7px;
  cursor:pointer;text-align:left;transition:all .08s;white-space:nowrap;
}
.lang-option:last-child{border-bottom:none;}
.lang-option:hover,.lang-option.active{
  background:var(--b1);color:#fff;text-shadow:0 0 10px var(--cyan);
}

/* ═══════════════════════════════
   PAGE BODY
═══════════════════════════════ */
.synth-body{
  position:relative;z-index:1;
  padding:54px 0 0; /* top only — let content be truly full-width */
}
.synth-title{text-align:center;padding:18px 0 24px;}
.synth-title span{
  display:block;font-size:clamp(9px,2vw,14px);
  color:var(--cyan);text-shadow:0 0 18px var(--cyan),3px 3px 0 var(--b1);
  letter-spacing:2px;
}
.synth-title small{
  display:block;font-size:6px;color:var(--dim);letter-spacing:4px;margin-top:10px;
}

/* ═══════════════════════════════
   CONFIG ROWS  (full-width, no box)
═══════════════════════════════ */
.config-grid{
  width:100%;
  border-top:1px solid var(--row-border);
  margin-bottom:32px;
}
.config-row{
  display:flex;flex-direction:column;align-items:center;
  gap:16px;
  padding:28px 80px;
  border-bottom:1px solid var(--row-border);
  transition:background .12s;
  text-align:center;
}
.config-row:nth-child(odd){background:rgba(13,13,34,.55);}
.config-row:nth-child(even){background:rgba(8,8,24,.55);}
.config-row:hover{background:rgba(20,10,50,.7);}

.config-row-lbl{
  font-size:12px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(0,255,255,.92);
  text-shadow:0 0 16px var(--cyan),2px 2px 0 rgba(102,0,255,.55);
  width:100%;text-align:center;line-height:1.6;
}

.config-btn-group{
  width:100%;display:flex;gap:8px;justify-content:center;
}

/* ─── pixel selection button ─── */
.cfg-btn{
  flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;
  padding:20px 8px;
  background:rgba(8,8,28,.9);
  border:2px solid rgba(102,0,255,.3);
  color:rgba(255,255,255,.5);
  font-family:var(--fp);
  text-transform:uppercase;text-align:center;
  cursor:pointer;
  transition:border-color .12s, color .12s, background .12s,
             transform .12s, box-shadow .12s;
  position:relative;overflow:hidden;
}
.btn-main{
  font-size:21px;letter-spacing:1px;
  color:inherit;line-height:1.2;
}
.btn-sub{
  font-size:7px;letter-spacing:1px;
  color:rgba(255,255,255,.35);
  text-transform:lowercase;line-height:1.4;
}
.cfg-btn.active .btn-sub{color:rgba(0,255,255,.6);}
.cfg-btn:hover:not(.active) .btn-sub{color:rgba(255,255,255,.5);}
/* subtle scanline texture on buttons */
.cfg-btn::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,rgba(0,0,0,.1) 0px,rgba(0,0,0,.1) 1px,transparent 1px,transparent 4px
  );
}
.cfg-btn:hover:not(.active){
  border-color:rgba(0,255,255,.7);
  color:#fff;
  background:rgba(0,255,255,.07);
  transform:translateY(-3px);
  box-shadow:0 6px 18px rgba(0,255,255,.18), 0 0 0 1px rgba(0,255,255,.12);
}
.cfg-btn.active{
  background:linear-gradient(160deg,rgba(102,0,255,.55) 0%,rgba(0,200,255,.18) 100%);
  border-color:var(--cyan);
  color:#fff;
  text-shadow:0 0 14px var(--cyan),0 0 4px #fff;
  box-shadow:0 0 22px rgba(0,255,255,.28), inset 0 0 14px rgba(0,255,255,.08);
  transform:none;
}
.cfg-btn.active::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--cyan);box-shadow:0 0 8px var(--cyan);
}

/* ═══════════════════════════════
   LED MATRIX GRID PICKER
═══════════════════════════════ */
.config-row-grid{padding-top:28px;padding-bottom:28px;}
.grid-area{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;}
.led-matrix{display:grid;gap:4px;cursor:crosshair;user-select:none;}
.led-cell{
  width:26px;height:26px;
  background:#07071E;border:2px solid rgba(102,0,255,.2);
  transition:background .05s,border-color .05s;
}
.led-cell.hover{background:rgba(0,255,255,.18);border-color:rgba(0,255,255,.55);}
.led-cell.sel{
  background:rgba(0,255,255,.22);border-color:var(--cyan);
  box-shadow:inset 0 0 5px rgba(0,255,255,.3);
}
.matrix-readout{text-align:center;}
.matrix-main{font-size:13px;color:var(--cyan);text-shadow:2px 2px 0 var(--b1),0 0 14px var(--cyan);margin-bottom:6px;}
.matrix-sub{font-size:6px;color:var(--dim);letter-spacing:2px;}

/* ═══════════════════════════════
   CONTENT AREA (team names + prompt)
═══════════════════════════════ */
.content-area{
  max-width:900px;margin:0 auto;padding:0 64px;
}

/* team inputs */
.lcd-strips{
  display:flex;flex-wrap:wrap;justify-content:center;gap:10px;
}
.lcd-strip{
  display:flex;align-items:center;gap:6px;
  padding:16px 24px;min-width:240px;
  background:#160616;
  border:2px solid rgba(255,0,255,.28);
  border-left:4px solid var(--tc,var(--pink));
  animation:inputPulse 2.4s ease-in-out infinite;
}
@keyframes inputPulse{
  0%,100%{box-shadow:none;}
  50%{box-shadow:0 0 18px rgba(255,0,255,.14);}
}
.lcd-strip input{
  flex:1;background:transparent;border:none;outline:none;
  color:#FF77CC;font-family:var(--fp);font-size:16px;
  caret-color:#FF77CC;min-width:0;
}
.lcd-strip input::placeholder{color:rgba(255,0,255,.3);}

/* ═══════════════════════════════
   LAUNCH BUTTON
═══════════════════════════════ */
.launch-wrap{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:4px 0 8px;
}
.btn-launch{
  position:relative;overflow:hidden;
  width:100%;padding:22px 24px;
  background:linear-gradient(135deg,
    rgba(20,5,30,.92) 0%, rgba(95,0,68,.82) 35%,
    rgba(14,5,34,.92) 65%, rgba(105,0,82,.76) 100%
  );
  background-size:320% 320%;
  animation:hdrMorph 9s ease-in-out infinite;
  backdrop-filter:blur(14px) saturate(1.5);
  border:2px solid rgba(255,0,255,.55);
  border-bottom:3px solid rgba(255,0,255,.85);
  box-shadow:0 0 32px rgba(255,0,255,.22), 0 6px 20px rgba(255,0,255,.28), inset 0 1px 0 rgba(255,255,255,.08);
  color:#fff;font-family:var(--fp);font-size:12px;letter-spacing:4px;
  text-shadow:0 0 18px rgba(255,120,255,.9), 0 0 4px #fff;
  text-transform:uppercase;cursor:pointer;
  transition:box-shadow .15s ease, transform .08s ease;
}
.btn-launch::before{
  content:'';
  position:absolute;top:0;bottom:0;
  left:50%;width:6px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at center, rgba(255,180,255,.95) 0%, rgba(255,0,255,.5) 45%, transparent 100%);
  filter:blur(10px);
  animation:btnPulse 2.4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes btnPulse{
  0%,100%{ width:6px;   opacity:0; }
  15%    { width:6px;   opacity:1; }
  55%    { width:130%;  opacity:.55; }
  88%    { width:140%;  opacity:0; }
}
.btn-launch:hover{
  transform:translateY(-3px);
  box-shadow:0 0 55px rgba(255,0,255,.5), 0 10px 26px rgba(255,0,255,.4), inset 0 1px 0 rgba(255,255,255,.12);
  text-shadow:0 0 24px rgba(255,180,255,1), 0 0 8px #fff;
}
.btn-launch:active{transform:translateY(1px);box-shadow:0 0 20px rgba(255,0,255,.3), inset 0 2px 8px rgba(0,0,0,.3);}
.btn-launch:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* ═══════════════════════════════
   SPLASH
═══════════════════════════════ */
#splash{
  position:fixed;inset:0;z-index:99999;background:var(--bg);
  display:flex;align-items:center;justify-content:center;pointer-events:none;
}
#splash.hide{animation:splashOut .4s steps(6) forwards;}
@keyframes splashOut{0%{opacity:1;}100%{opacity:0;}}
.splash-logo{
  height:160px;width:auto;animation:splashFloat 1.8s ease-in-out forwards;
  image-rendering:pixelated;
  filter:drop-shadow(0 0 18px var(--cyan)) drop-shadow(4px 4px 0 var(--b1));
}
@keyframes splashFloat{
  0%  {transform:translateY(0)    scale(1)    rotate(-1deg);}
  20% {transform:translateY(-10px)scale(1.04) rotate(1deg);}
  40% {transform:translateY(4px)  scale(.98)  rotate(-.5deg);}
  60% {transform:translateY(-6px) scale(1.02) rotate(.8deg);}
  80% {transform:translateY(2px)  scale(1)    rotate(0deg);}
  100%{transform:translateY(0)    scale(1)    rotate(0deg);}
}

/* ═══════════════════════════════
   LOADING OVERLAY
═══════════════════════════════ */
.loading-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(7,7,26,.97);z-index:9999;
  flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
.loading-overlay.active{display:flex;}
.load-logo{height:100px;animation:logoPulse 1s step-end infinite;}
@keyframes logoPulse{
  0%,100%{filter:drop-shadow(0 0 8px var(--cyan));}
  50%{filter:drop-shadow(0 0 22px var(--cyan)) drop-shadow(4px 4px 0 var(--b1));}
}
.load-bar-wrap{width:200px;height:6px;background:#111;border:2px solid var(--cyan);}
.load-bar{height:100%;background:var(--cyan);animation:sweep 1s linear infinite;}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.load-text{font-size:7px;color:var(--dim);letter-spacing:3px;text-transform:uppercase;}

/* ═══════════════════════════════
   FLOOR GRID
═══════════════════════════════ */
.grid-floor{
  position:fixed;bottom:0;left:0;right:0;height:64px;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(102,0,255,.1) 1px,transparent 1px),
    linear-gradient(90deg,rgba(102,0,255,.1) 1px,transparent 1px);
  background-size:20px 20px;
  transform:perspective(200px) rotateX(62deg);transform-origin:bottom;opacity:.5;
}

/* ═══════════════════════════════
   COMETS
═══════════════════════════════ */
#comet-canvas{
  position:fixed;inset:0;
  pointer-events:none;z-index:1;
  width:100%;height:100%;
}

/* ═══════════════════════════════
   RESPONSIVE
═══════════════════════════════ */
@media(max-width:700px){
  .hdr-logo{height:150px;}
  .synth-body{padding-top:44px;}
  .config-row{padding:20px 24px;gap:12px;}
  .content-area{padding:0 24px;}
  .config-row-lbl{font-size:9px;}
  .content-area{padding:0 16px;}
}
@media(max-width:400px){
  .hdr-logo{height:120px;margin-bottom:-22px;}
  .cfg-btn{font-size:6px;padding:10px 4px;}
}

/* ================================================================
   RESPONSIVE INTERFACE REFINEMENT
   ================================================================ */
html{scroll-behavior:smooth;color-scheme:dark;overflow-x:hidden;}
body{
  min-height:100dvh;padding-bottom:max(64px,env(safe-area-inset-bottom));
  overflow-x:hidden;
  background:
    radial-gradient(circle at 10% 12%,rgba(0,255,255,.08),transparent 26rem),
    radial-gradient(circle at 88% 24%,rgba(255,0,255,.09),transparent 32rem),
    linear-gradient(180deg,#09081d 0%,#050513 48%,#090519 100%);
}
body::after{
  content:'';position:fixed;inset:-25%;z-index:0;pointer-events:none;
  background:conic-gradient(from 90deg at 50% 50%,transparent,rgba(102,0,255,.055),transparent 32%,rgba(0,255,255,.04),transparent 64%);
  animation:ambientDrift 24s linear infinite;
}
@keyframes ambientDrift{to{transform:rotate(1turn) scale(1.06);}}
#comet-canvas{opacity:.7;mix-blend-mode:screen;}
.hdr{height:clamp(78px,8vw,98px);box-shadow:0 1px 0 rgba(0,255,255,.18),0 10px 36px rgba(0,0,0,.5);}
.hdr.hdr-scrolled{height:70px;background-position:70% 50%;}
.hdr-inner{max-width:1440px;margin:auto;padding-inline:clamp(14px,3vw,38px);}
.hdr-logo{
  position:absolute;top:50%;height:clamp(126px,13vw,178px);
  transform:translate(-50%,-36%);will-change:transform;
  animation:logoHover 5.5s ease-in-out infinite;
}
@keyframes logoHover{
  0%,100%{transform:translate(-50%,-36%) rotate(-.4deg);}
  50%{transform:translate(-50%,-40%) rotate(.5deg);}
}
.hdr-logo:hover{transform:translate(-50%,-41%) scale(1.035);}
.burger-wrap{right:clamp(14px,3vw,38px);}
.burger-btn{width:44px;height:44px;border-color:rgba(0,255,255,.18);}
.lang-menu{top:calc(100% + 10px);border-color:rgba(0,255,255,.55);box-shadow:6px 6px 0 #000,0 0 24px rgba(0,255,255,.12);}
.lang-option{min-height:42px;}
.synth-body{max-width:1480px;margin-inline:auto;padding:clamp(54px,7vw,86px) clamp(12px,2.5vw,40px) 0;}
.synth-title{padding:18px 12px clamp(24px,4vw,42px);}
.synth-title span{font-size:clamp(11px,1.5vw,17px);line-height:1.7;}
.synth-title small{font-size:clamp(5px,.62vw,7px);line-height:1.8;}
.config-grid{
  max-width:1320px;margin:0 auto clamp(26px,4vw,48px);padding:0;
  border:0;display:grid;grid-template-columns:1fr;gap:clamp(12px,1.5vw,20px);
}
.config-row{
  position:relative;isolation:isolate;align-items:stretch;text-align:left;
  padding:clamp(20px,2.8vw,34px);gap:18px;
  border:1px solid rgba(125,64,255,.28);
  background:linear-gradient(145deg,rgba(15,15,42,.92),rgba(7,7,25,.82));
  box-shadow:0 12px 34px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.025);
  overflow:hidden;transition:border-color .22s ease,transform .22s ease,box-shadow .22s ease;
  animation:moduleEnter .5s cubic-bezier(.2,.8,.2,1) both;
}
.config-row:nth-child(odd),.config-row:nth-child(even){background:linear-gradient(145deg,rgba(15,15,42,.92),rgba(7,7,25,.82));}
.config-row:nth-child(2){animation-delay:.04s}.config-row:nth-child(3){animation-delay:.08s}
.config-row:nth-child(4){animation-delay:.12s}.config-row:nth-child(5){animation-delay:.16s}.config-row:nth-child(6){animation-delay:.2s}
@keyframes moduleEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.config-row::before{
  content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(0,255,255,.035) 50%,transparent 70%);
  transform:translateX(-100%);transition:transform .75s ease;
}
.config-row:hover{background:linear-gradient(145deg,rgba(18,14,52,.96),rgba(8,9,30,.9));border-color:rgba(0,255,255,.38);box-shadow:0 16px 42px rgba(0,0,0,.32),0 0 30px rgba(0,255,255,.05);}
.config-row:hover::before{transform:translateX(100%);}
.config-row-lbl{text-align:left;font-size:clamp(8px,.85vw,11px);letter-spacing:2.5px;display:flex;align-items:center;gap:10px;}
.config-row-lbl::before{content:'';width:16px;height:3px;flex:none;background:var(--pink);box-shadow:0 0 9px var(--pink);}
.config-btn-group{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;}
.cfg-btn{min-height:86px;padding:16px 10px;flex:none;border-color:rgba(102,0,255,.44);}
.cfg-btn::after{transition:box-shadow .2s ease;}
.cfg-btn:hover:not(.active){transform:translateY(-2px);}
.cfg-btn:active{transform:translateY(1px) scale(.99);}

<script>
/* ══════════════════════════════════════════════════════════════════════
   JAMBOO QUIZ ENGINE
   Pure selection logic: repository index, search, column allocation,
   difficulty balancing, unique question picking and session building.
   No DOM access in here so the engine can be unit tested on its own.
══════════════════════════════════════════════════════════════════════ */
/* ═══ ENGINE START ═══ */
const JamBooEngine=(function(){
  const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X'];

  function clean(value){ return String(value ?? '').trim(); }

  function normalizeText(value){
    return clean(value)
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase().replace(/[^a-z0-9]+/g,' ')
      .trim();
  }

  function shuffle(list,rng){
    const out=Array.isArray(list)?list.slice():[];
    for(let i=out.length-1;i>0;i--){
      const j=Math.floor(rng()*(i+1));
      const swap=out[i];out[i]=out[j];out[j]=swap;
    }
    return out;
  }

  function createRng(seed){
    if(seed===undefined||seed===null||seed==='') return Math.random;
    let state=0;
    const text=String(seed);
    for(let i=0;i<text.length;i++) state=(state*31+text.charCodeAt(i))>>>0;
    if(state===0) state=0x9E3779B9;
    return function(){
      state|=0;state=(state+0x6D2B79F5)|0;
      let t=Math.imul(state^(state>>>15),1|state);
      t=(t+Math.imul(t^(t>>>7),61|t))^t;
      return ((t^(t>>>14))>>>0)/4294967296;
    };
  }

  function localizeName(name,lang){
    if(name===undefined||name===null) return '';
    if(typeof name==='string') return clean(name);
    return clean(name[lang])||clean(name.en)||clean(Object.values(name)[0]);
  }

  function isEligibleQuestion(question){
    if(!question||typeof question!=='object') return false;
    if(question.active===false) return false;
    if(question.reviewStatus && question.reviewStatus!=='approved') return false;
    if(!clean(question.question)) return false;
    if(!Array.isArray(question.choices)||question.choices.length!==4) return false;
    if(!question.choices.every(choice=>clean(choice))) return false;
    if(new Set(question.choices.map(normalizeText)).size!==4) return false;
    const correct=Number(question.correctAnswer);
    if(!Number.isInteger(correct)||correct<0||correct>3) return false;
    return true;
  }

  function buildRepository(rawRepository,lang='en'){
    const repo={categories:[],topics:[],byId:{}};
    const categories=Array.isArray(rawRepository?.categories)?rawRepository.categories:[];
    const defaultLanguage=clean(rawRepository?.defaultLanguage)||'en';
    categories.forEach(rawCategory=>{
      const category={id:clean(rawCategory.id),name:rawCategory.name,subjects:[]};
      (Array.isArray(rawCategory.subjects)?rawCategory.subjects:[]).forEach(rawSubject=>{
        const subject={id:clean(rawSubject.id),name:rawSubject.name,topics:[]};
        (Array.isArray(rawSubject.topics)?rawSubject.topics:[]).forEach(rawTopic=>{
          const subtopics=(Array.isArray(rawTopic.subtopics)?rawTopic.subtopics:[])
            .map(subtopic=>({id:clean(subtopic.id),name:subtopic.name}));
          const questions=(Array.isArray(rawTopic.questions)?rawTopic.questions:[])
            .filter(isEligibleQuestion)
            .map(question=>({
              id:clean(question.id),
              question:clean(question.question),
              choices:question.choices.map(clean),
              correctAnswer:Number(question.correctAnswer),
              subtopic:clean(question.subtopic),
              difficulty:Math.min(3,Math.max(1,Number(question.difficulty)||2)),
              language:clean(question.language)||defaultLanguage,
              tags:(Array.isArray(question.tags)?question.tags:[]).map(clean).filter(Boolean),
              variantGroup:clean(question.variantGroup),
            }));
          const entry={
            id:clean(rawTopic.id),
            name:rawTopic.name,
            aliases:(Array.isArray(rawTopic.aliases)?rawTopic.aliases:[]).map(clean).filter(Boolean),
            tags:(Array.isArray(rawTopic.tags)?rawTopic.tags:[]).map(clean).filter(Boolean),
            subtopics,
            questions,
            categoryId:category.id,
            categoryName:category.name,
            subjectId:subject.id,
            subjectName:subject.name,
          };
          entry.searchText=normalizeText([
            ...Object.values(entry.name||{}),
            ...Object.values(category.name||{}),
            ...Object.values(subject.name||{}),
            ...entry.aliases,
            ...entry.tags,
            ...subtopics.flatMap(subtopic=>Object.values(subtopic.name||{})),
          ].join(' '));
          subject.topics.push(entry);
          repo.topics.push(entry);
          repo.byId[entry.id]=entry;
        });
        category.subjects.push(subject);
      });
      repo.categories.push(category);
    });
    return repo;
  }

  function searchTopics(repository,query){
    const repo=repository?.byId?repository:buildRepository(repository);
    const terms=normalizeText(query).split(' ').filter(Boolean);
    if(!terms.length) return [];
    return repo.topics.filter(topic=>terms.every(term=>topic.searchText.includes(term)));
  }

  function maxColumnsForTopic(topic,rows){
    const questionCount=topic?.questions?.length||0;
    const rowCount=Math.max(1,Math.floor(Number(rows)||1));
    return Math.floor(questionCount/rowCount);
  }

  function distributeColumns(topicCount,totalColumns){
    if(topicCount<=0) return [];
    const base=Math.floor(totalColumns/topicCount);
    const remainder=totalColumns%topicCount;
    return Array.from({length:topicCount},(_,index)=>base+(index<remainder?1:0));
  }

  function difficultyTargets(rows,difficulty){
    const rowCount=Math.max(0,Math.floor(Number(rows)||0));
    const fixed={easy:1,medium:2,hard:3}[difficulty];
    if(fixed) return Array(rowCount).fill(fixed);
    return Array.from({length:rowCount},(_,index)=>1+Math.floor((index*3)/Math.max(1,rowCount)));
  }

  function selectQuestions({candidates,rowTargets,excludeIds,recentIds,avoidVariantGroups=true,rng=Math.random}){
    const excluded=excludeIds instanceof Set?excludeIds:new Set(excludeIds||[]);
    const recent=recentIds instanceof Set?recentIds:new Set(recentIds||[]);
    const pool=shuffle((candidates||[]).filter(question=>!excluded.has(question.id)),rng);
    const picked=[];
    const usedIds=new Set();
    const subtopicUse={};
    const variantUse=new Set();
    (rowTargets||[]).forEach(target=>{
      let best=null;
      let bestScore=Infinity;
      pool.forEach((question,index)=>{
        if(usedIds.has(question.id)) return;
        const difficultyDistance=Math.abs(question.difficulty-target);
        const subtopicPenalty=(subtopicUse[question.subtopic]||0)*10;
        const variantPenalty=(avoidVariantGroups&&question.variantGroup&&variantUse.has(question.variantGroup))?25:0;
        const recentPenalty=recent.has(question.id)?40:0;
        const score=difficultyDistance*100+subtopicPenalty+variantPenalty+recentPenalty+index*0.01;
        if(score<bestScore){bestScore=score;best=question;}
      });
      if(!best) return;
      picked.push(best);
      usedIds.add(best.id);
      subtopicUse[best.subtopic]=(subtopicUse[best.subtopic]||0)+1;
      if(best.variantGroup) variantUse.add(best.variantGroup);
    });
    return picked;
  }

  function planColumns(topics,repository,lang='en'){
    const repo=repository?.byId?repository:buildRepository(repository,lang);
    const plan=(topics||[]).filter(entry=>entry&&repo.byId[entry.topicId]&&Number(entry.columns)>0);
    const totals={};
    plan.forEach(entry=>{totals[entry.topicId]=(totals[entry.topicId]||0)+Number(entry.columns);});
    const seen={};
    const columns=[];
    plan.forEach(entry=>{
      const topic=repo.byId[entry.topicId];
      const base=localizeName(topic.name,lang)||topic.id;
      for(let index=0;index<Number(entry.columns);index++){
        seen[entry.topicId]=(seen[entry.topicId]||0)+1;
        columns.push({
          topicId:entry.topicId,
          label:totals[entry.topicId]>1?`${base} ${ROMAN[seen[entry.topicId]-1]||seen[entry.topicId]}`:base,
        });
      }
    });
    return {repo,columns};
  }

  function validateConfiguration({repository,topics,board}){
    const repo=repository?.byId?repository:buildRepository(repository);
    const columns=Math.max(0,Math.floor(Number(board?.columns)||0));
    const rows=Math.max(0,Math.floor(Number(board?.rows)||0));
    const plan=(topics||[]).filter(entry=>entry&&repo.byId[entry.topicId]);
    const assigned=plan.reduce((sum,entry)=>sum+Math.max(0,Math.floor(Number(entry.columns)||0)),0);
    const issues=[];
    if(!repo.topics.length) issues.push({type:'library-empty'});
    if(!plan.length) issues.push({type:'no-topics'});
    plan.forEach(entry=>{
      const topic=repo.byId[entry.topicId];
      const required=Math.max(0,Math.floor(Number(entry.columns)||0))*rows;
      if(required>topic.questions.length){
        issues.push({
          type:'insufficient',
          topicId:entry.topicId,
          label:topic.name,
          available:topic.questions.length,
          required,
          columns:Number(entry.columns)||0,
        });
      }
    });
    if(assigned<columns) issues.push({type:'unassigned',remaining:columns-assigned});
    if(assigned>columns) issues.push({type:'overassigned'});
    return {ok:issues.length===0,assigned,columns,remaining:Math.max(0,columns-assigned),issues,repo};
  }

  function buildSession({repository,topics,board,difficulty='mixed',lang='en',recentIds=[],excludeIds=[],seed}={}){
    const columns=Math.max(0,Math.floor(Number(board?.columns)||0));
    const rows=Math.max(0,Math.floor(Number(board?.rows)||0));
    if(!columns||!rows) throw new Error('Invalid board size');
    const {repo,columns:plannedColumns}=planColumns(topics,repository,lang);
    if(plannedColumns.length!==columns) throw new Error('Column allocation does not match the board');
    const rng=createRng(seed);
    const targets=difficultyTargets(rows,difficulty);
    const usedIds=new Set(excludeIds||[]);
    const recent=new Set(recentIds||[]);
    const categories=[];
    const columnTopics=[];
    const questions=[];
    const questionIds=[];
    plannedColumns.forEach(column=>{
      const topic=repo.byId[column.topicId];
      const picked=selectQuestions({
        candidates:topic.questions,
        rowTargets:targets,
        excludeIds:usedIds,
        recentIds:recent,
        rng,
      });
      if(picked.length<rows) throw new Error(`Not enough questions for ${column.label}`);
      categories.push(column.label);
      columnTopics.push(column.topicId);
      questions.push(picked.map(question=>{
        usedIds.add(question.id);
        questionIds.push(question.id);
        const options=shuffle(question.choices,rng);
        let correctIndex=options.indexOf(question.choices[question.correctAnswer]);
        if(correctIndex<0) correctIndex=0;
        return {
          id:question.id,
          question:question.question,
          options,
          correctIndex,
          answer:options[correctIndex],
          difficulty:question.difficulty,
          subtopic:question.subtopic,
          type:'multiple',
          isDrawing:false,
        };
      }));
    });
    return {
      version:1,
      createdAt:new Date().toISOString(),
      board:{columns,rows},
      difficulty,
      lang,
      categories,
      columnTopics,
      questions,
      questionIds,
    };
  }

  return {
    clean,
    normalizeText,
    shuffle,
    createRng,
    localizeName,
    isEligibleQuestion,
    buildRepository,
    searchTopics,
    maxColumnsForTopic,
    distributeColumns,
    difficultyTargets,
    selectQuestions,
    planColumns,
    validateConfiguration,
    buildSession,
  };
})();

/* ══════════ HELPERS ══════════ */
function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,character=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;',
  }[character]));
}
function formatText(template,values){
  return Object.entries(values).reduce((text,[key,value])=>text.replaceAll(`{${key}}`,String(value)),template);
}
function topicName(topic){ return JamBooEngine.localizeName(topic.name,lang)||topic.id; }
function topicPath(topic){
  return [
    JamBooEngine.localizeName(topic.categoryName,lang),
    JamBooEngine.localizeName(topic.subjectName,lang),
  ].filter(Boolean).join(' / ');
}
function accentForTopic(topicId){
  const index=selectedTopics.findIndex(entry=>entry.topicId===topicId);
  return TOPIC_ACCENTS[(index<0?0:index)%TOPIC_ACCENTS.length];
}
function readRecent(){
  try{
    const value=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');
    return Array.isArray(value)?value:[];
  }catch(_){ return []; }
}
function saveRecent(ids){
  try{
    const unique=[...new Set([...(ids||[]),...readRecent()])].slice(0,200);
    localStorage.setItem(RECENT_KEY,JSON.stringify(unique));
  }catch(_){ /* Storage unavailable. */ }
}

/* ══════════ INIT ══════════ */
function init(){
  try{
    repository=JamBooEngine.buildRepository(globalThis.JAMBOO_QUESTION_REPOSITORY,lang);
  }catch(error){
    console.error('Question library failed to load',error);
    repository=JamBooEngine.buildRepository({categories:[]},lang);
  }
  teams=T[lang].teamDefaults.map((name,index)=>({name,color:TEAM_COLORS[index]}));
  initGridPicker();
  applyI18n();
  restoreConfig();
}

function restoreConfig(){
  const raw=localStorage.getItem('jamboo_config');
  if(!raw) return;
  let config;
  try{ config=JSON.parse(raw); }catch(_){ return; }
  if(!config||!config._keepTeams) return;
  if(config.lang&&T[config.lang]) lang=config.lang;
  ['en','pt','es'].forEach(code=>document.getElementById('lang-'+code).classList.toggle('active',code===lang));
  if(Number.isInteger(config.numTeams)) numTeams=Math.min(MAX_TEAMS,Math.max(1,config.numTeams));
  if(Number.isInteger(config.numRows)) numRows=Math.min(GP_ROWS,Math.max(1,config.numRows));
  if(Number.isInteger(config.numCols)) numCols=Math.min(GP_COLS,Math.max(1,config.numCols));
  if(['easy','medium','hard','mixed'].includes(config.difficulty)) difficulty=config.difficulty;
  if(Array.isArray(config.teams)){
    teams=config.teams.map((team,index)=>({name:team.name||T[lang].teamDefaults[index],color:TEAM_COLORS[index]}));
  }
  if(Array.isArray(config.topics)){
    selectedTopics=config.topics
      .filter(entry=>entry&&repository.byId[entry.topicId])
      .slice(0,TOPIC_ACCENTS.length)
      .map(entry=>({topicId:entry.topicId,columns:Math.max(1,Math.floor(Number(entry.columns)||1))}));
  }
  config._keepTeams=false;
  localStorage.setItem('jamboo_config',JSON.stringify(config));
  applyI18n();
}

/* ══════════ TEAMS ══════════ */
function changeTeams(delta){
  const next=Math.min(MAX_TEAMS,Math.max(1,numTeams+delta));
  if(next===numTeams) return;
  numTeams=next;
  if(!teams[0]) teams[0]={name:T[lang].teamDefaults[0],color:TEAM_COLORS[0]};
  renderTeams();
}
function renderTeams(){
  const dictionary=T[lang];
  document.getElementById('teams-count').textContent=String(numTeams);
  document.getElementById('teams-word').textContent=numTeams===1?dictionary.soloWord:dictionary.teamsWord;
  document.getElementById('teams-minus').disabled=numTeams<=1;
  document.getElementById('teams-plus').disabled=numTeams>=MAX_TEAMS;
  renderTeamInputs();
}
function renderTeamInputs(){
  const host=document.getElementById('team-inputs');
  const dictionary=T[lang];
  host.innerHTML='';
  for(let index=0;index<numTeams;index++){
    const fallback=numTeams===1?dictionary.soloDefault:dictionary.teamDefaults[index];
    if(!teams[index]) teams[index]={name:fallback,color:TEAM_COLORS[index]};
    const strip=document.createElement('div');
    strip.className='lcd-strip';
    strip.style.setProperty('--tc',TEAM_COLORS[index]);
    const input=document.createElement('input');
    input.type='text';
    input.value=teams[index].name;
    input.placeholder=fallback;
    input.setAttribute('aria-label',`${dictionary.teamNamesLabel} ${index+1}`);
    input.oninput=event=>{teams[index].name=event.target.value;};
    strip.appendChild(input);
    host.appendChild(strip);
  }
}

/* ══════════ DIFFICULTY ══════════ */
function renderDiffPills(){
  const dictionary=T[lang];
  const host=document.getElementById('diff-pills');
  host.innerHTML='';
  ['easy','medium','hard','mixed'].forEach((value,index)=>{
    const button=document.createElement('button');
    button.type='button';
    button.className='diff-pill'+(difficulty===value?' active':'');
    button.setAttribute('aria-pressed',String(difficulty===value));
    button.textContent=dictionary['diff'+index];
    button.title=dictionary['diff'+index+'desc'];
    button.onclick=()=>{difficulty=value;renderDiffPills();};
    host.appendChild(button);
  });
}

/* ══════════ BOARD SIZE ══════════ */
const GP_COLS=8, GP_ROWS=6;
function initGridPicker(){
  const grid=document.getElementById('gp-grid');
  grid.style.gridTemplateColumns=`repeat(${GP_COLS},1fr)`;
  grid.innerHTML='';
  for(let row=0;row<GP_ROWS;row++){
    for(let column=0;column<GP_COLS;column++){
      const cell=document.createElement('div');
      cell.className='led-cell';
      cell.dataset.c=column;cell.dataset.r=row;
      cell.tabIndex=0;
      cell.setAttribute('role','button');
      cell.setAttribute('aria-label',`${column+1} × ${row+1}`);
      cell.addEventListener('mouseenter',()=>highlightGrid(column,row,false));
      cell.addEventListener('click',()=>setBoard(column+1,row+1));
      cell.addEventListener('keydown',event=>{
        if(event.key==='Enter'||event.key===' '){
          event.preventDefault();
          setBoard(column+1,row+1);
        }
      });
      grid.appendChild(cell);
    }
  }
  grid.addEventListener('mouseleave',()=>highlightGrid(numCols-1,numRows-1,true));
  highlightGrid(numCols-1,numRows-1,true);
  updateGridLabel();
}
function highlightGrid(maxColumn,maxRow,permanent){
  document.querySelectorAll('.led-cell').forEach(cell=>{
    const column=+cell.dataset.c;
    const row=+cell.dataset.r;
    const inside=column<=maxColumn&&row<=maxRow;
    cell.classList.toggle('hover',inside&&!permanent);
    cell.classList.toggle('sel',inside&&permanent);
    if(permanent) cell.setAttribute('aria-pressed',String(column===maxColumn&&row===maxRow));
  });
  if(!permanent){
    document.getElementById('gp-label').textContent=`${maxColumn+1} × ${maxRow+1}`;
    document.getElementById('gp-sublabel').textContent=`${(maxColumn+1)*(maxRow+1)} ${T[lang].questions}`;
  }
}
function updateGridLabel(){
  document.getElementById('gp-label').textContent=`${numCols} × ${numRows}`;
  document.getElementById('gp-sublabel').textContent=`${numCols*numRows} ${T[lang].questions}`;
  highlightGrid(numCols-1,numRows-1,true);
}
function setBoard(columns,rows){
  const columnsChanged=columns!==numCols;
  numCols=columns;
  numRows=rows;
  updateGridLabel();
  if(columnsChanged&&selectedTopics.length){
    const values=JamBooEngine.distributeColumns(selectedTopics.length,numCols);
    selectedTopics.forEach((entry,index)=>{entry.columns=values[index];});
  }
  enforceMaxColumns();
}

/* ══════════ TOPIC CARDS ══════════ */
function miniButton(label,title,disabled,handler,extraClass){
  const button=document.createElement('button');
  button.type='button';
  button.className='mini-btn'+(extraClass?` ${extraClass}`:'');
  button.textContent=label;
  if(title) button.title=title;
  button.disabled=disabled;
  button.onclick=handler;
  return button;
}
function renderTopics(){
  const host=document.getElementById('topic-cards');
  const dictionary=T[lang];
  host.innerHTML='';
  document.getElementById('topics-empty').hidden=selectedTopics.length>0;
  const assigned=selectedTopics.reduce((sum,entry)=>sum+entry.columns,0);

  selectedTopics.forEach((entry,index)=>{
    const topic=repository.byId[entry.topicId];
    if(!topic) return;
    const maxColumns=JamBooEngine.maxColumnsForTopic(topic,numRows);
    const card=document.createElement('div');
    card.className='topic-card';
    card.style.setProperty('--tc',accentForTopic(entry.topicId));

    const path=document.createElement('div');
    path.className='topic-path';
    path.textContent=topicPath(topic);
    path.title=path.textContent;

    const name=document.createElement('div');
    name.className='topic-name';
    name.textContent=topicName(topic);

    const controls=document.createElement('div');
    controls.className='topic-controls';

    const stepper=document.createElement('div');
    stepper.className='col-stepper';
    const label=document.createElement('span');
    label.className='col-lbl';
    label.textContent=dictionary.columnsWord;

    const minus=document.createElement('button');
    minus.type='button';
    minus.className='step-btn sm';
    minus.textContent='−';
    minus.disabled=entry.columns<=1;
    minus.setAttribute('aria-label',`${dictionary.columnsWord} ${topicName(topic)} −1`);
    minus.onclick=()=>changeTopicColumns(index,-1);

    const count=document.createElement('span');
    count.className='col-count';
    count.textContent=String(entry.columns);
    count.setAttribute('aria-live','polite');

    const plus=document.createElement('button');
    plus.type='button';
    plus.className='step-btn sm';
    plus.textContent='+';
    plus.disabled=entry.columns>=maxColumns||assigned>=numCols;
    plus.title=entry.columns>=maxColumns?formatText(dictionary.maxColumns,{max:maxColumns}):'';
    plus.setAttribute('aria-label',`${dictionary.columnsWord} ${topicName(topic)} +1`);
    plus.onclick=()=>changeTopicColumns(index,1);

    stepper.append(label,minus,count,plus);

    const actions=document.createElement('div');
    actions.className='topic-actions';
    actions.append(
      miniButton('◀',dictionary.moveLeft,index===0,()=>moveTopic(index,-1)),
      miniButton('▶',dictionary.moveRight,index===selectedTopics.length-1,()=>moveTopic(index,1)),
      miniButton(dictionary.changeTopic,'',false,()=>openPicker(index)),
      miniButton('×',dictionary.removeTopic,false,()=>removeTopic(index),'danger'),
    );

    controls.append(stepper,actions);
    card.append(path,name,controls);

    if(entry.columns*numRows>topic.questions.length){
      const warning=document.createElement('div');
      warning.className='topic-warn';
      warning.textContent=formatText(dictionary.notEnough,{topic:topicName(topic),count:topic.questions.length});
      card.appendChild(warning);
    }
    host.appendChild(card);
  });

  renderBoardPreview();
  updateMeter();
}
function changeTopicColumns(index,delta){
  const entry=selectedTopics[index];
  if(!entry) return;
  const topic=repository.byId[entry.topicId];
  if(!topic) return;
  const maxColumns=JamBooEngine.maxColumnsForTopic(topic,numRows);
  const assigned=selectedTopics.reduce((sum,item)=>sum+item.columns,0);
  const next=entry.columns+delta;
  if(delta>0&&(next>maxColumns||assigned>=numCols)) return;
  entry.columns=Math.max(1,next);
  renderTopics();
  updateValidation();
}
function moveTopic(index,direction){
  const target=index+direction;
  if(target<0||target>=selectedTopics.length) return;
  const current=selectedTopics[index];
  selectedTopics[index]=selectedTopics[target];
  selectedTopics[target]=current;
  renderTopics();
  updateValidation();
}
function removeTopic(index){
  selectedTopics.splice(index,1);
  renderTopics();
  updateValidation();
}
function enforceMaxColumns(){
  selectedTopics.forEach(entry=>{
    const topic=repository.byId[entry.topicId];
    if(!topic) return;
    const maxColumns=JamBooEngine.maxColumnsForTopic(topic,numRows);
    if(entry.columns>maxColumns) entry.columns=Math.max(0,maxColumns);
  });
  renderTopics();
  updateValidation();
}
function updateMeter(){
  const dictionary=T[lang];
  const meter=document.getElementById('columns-meter');
  const assigned=selectedTopics.reduce((sum,entry)=>sum+entry.columns,0);
  meter.classList.toggle('warn',selectedTopics.length>0&&assigned!==numCols);
  if(!selectedTopics.length){ meter.textContent=''; return; }
  meter.innerHTML=`<span class="cm-main">${assigned} / ${numCols} ${escapeHtml(dictionary.columnsAssignedWord)}</span>`+
    (assigned<numCols?`<span class="cm-left">${numCols-assigned} ${escapeHtml(dictionary.remainingWord)}</span>`:'');
}

/* ══════════ BOARD PREVIEW ══════════ */
function renderBoardPreview(){
  const host=document.getElementById('board-preview');
  const dictionary=T[lang];
  const planned=JamBooEngine.planColumns(selectedTopics,repository,lang).columns;
  if(!planned.length){
    host.innerHTML=`<div class="bp-empty">${escapeHtml(dictionary.previewEmpty)}</div>`;
    return;
  }
  host.innerHTML='';
  planned.forEach(column=>{
    const element=document.createElement('div');
    element.className='bp-col';
    element.style.setProperty('--tc',accentForTopic(column.topicId));
    const head=document.createElement('div');
    head.className='bp-head';
    head.textContent=column.label;
    element.appendChild(head);
    for(let row=0;row<numRows;row++){
      const dot=document.createElement('span');
      dot.className='bp-dot';
      element.appendChild(dot);
    }
    host.appendChild(element);
  });
}

/* ══════════ VALIDATION + CREATE ══════════ */
function updateValidation(){
  const dictionary=T[lang];
  const result=JamBooEngine.validateConfiguration({
    repository,
    topics:selectedTopics,
    board:{columns:numCols,rows:numRows},
  });
  let message='';
  if(result.issues.some(issue=>issue.type==='library-empty')) message=dictionary.libraryError;
  else if(result.issues.some(issue=>issue.type==='no-topics')) message=dictionary.needTopic;
  else{
    const insufficient=result.issues.find(issue=>issue.type==='insufficient');
    if(insufficient){
      message=formatText(dictionary.notEnough,{
        topic:JamBooEngine.localizeName(insufficient.label,lang),
        count:insufficient.available,
      });
    }else if(result.issues.some(issue=>issue.type==='unassigned')){
      message=formatText(dictionary.assignAll,{total:numCols});
    }
  }
  const status=document.getElementById('build-status');
  status.textContent=message;
  const button=document.getElementById('gen-btn');
  button.disabled=!result.ok;
  button.setAttribute('aria-disabled',String(!result.ok));

  // Adding a topic while the board is full redistributes the columns evenly,
  // so the button stays available until the topic limit is reached.
  const addButton=document.getElementById('add-topic-btn');
  addButton.hidden=!repository.topics.length||selectedTopics.length>=TOPIC_ACCENTS.length;
}

function createGame(){
  const result=JamBooEngine.validateConfiguration({
    repository,
    topics:selectedTopics,
    board:{columns:numCols,rows:numRows},
  });
  if(!result.ok) return;
  let session;
  try{
    session=JamBooEngine.buildSession({
      repository,
      topics:selectedTopics,
      board:{columns:numCols,rows:numRows},
      difficulty,
      lang,
      recentIds:readRecent(),
      seed:Date.now(),
    });
  }catch(error){
    console.error('Could not build the game session',error);
    document.getElementById('build-status').textContent=error.message;
    return;
  }
  const dictionary=T[lang];
  const count=numTeams;
  const config={
    numTeams:count,
    numRows,
    numCols,
    difficulty,
    lang,
    qLang:{en:'English',pt:'Portuguese',es:'Spanish'}[lang],
    teams:teams.slice(0,count).map((team,index)=>({
      name:(team.name||'').trim()||(count===1?dictionary.soloDefault:dictionary.teamDefaults[index]),
      color:TEAM_COLORS[index],
    })),
    timerOn:true,
    speedOn:false,
    soloMode:count===1,
    topics:selectedTopics.map(entry=>({topicId:entry.topicId,columns:entry.columns})),
    session,
  };
  localStorage.setItem('jamboo_config',JSON.stringify(config));
  saveRecent(session.questionIds);
  document.getElementById('load-text').textContent=dictionary.building;
  document.getElementById('loading').classList.add('active');
  document.getElementById('gen-btn').disabled=true;
  setTimeout(()=>{window.location.href='game.html';},420);
}

/* ══════════ TOPIC PICKER ══════════ */
function pickerItem({name,path,arrow,onSelect}){
  const button=document.createElement('button');
  button.type='button';
  button.className='picker-item';
  const text=document.createElement('span');
  text.className='pi-text';
  const nameNode=document.createElement('span');
  nameNode.className='pi-name';
  nameNode.textContent=name;
  text.appendChild(nameNode);
  if(path){
    const pathNode=document.createElement('span');
    pathNode.className='pi-path';
    pathNode.textContent=path;
    text.appendChild(pathNode);
  }
  button.appendChild(text);
  if(arrow){
    const arrowNode=document.createElement('span');
    arrowNode.className='pi-arrow';
    arrowNode.textContent=arrow;
    button.appendChild(arrowNode);
  }
  button.onclick=onSelect;
  return button;
}
function openPicker(targetIndex){
  if(!repository.topics.length) return;
  pickerState.target=targetIndex;
  pickerState.path=[];
  pickerState.query='';
  document.getElementById('picker-search').value='';
  document.getElementById('picker-overlay').hidden=false;
  document.body.classList.add('picker-open');
  renderPicker();
  setTimeout(()=>document.getElementById('picker-search').focus(),40);
}
function closePicker(){
  document.getElementById('picker-overlay').hidden=true;
  document.body.classList.remove('picker-open');
}
function pickerBack(){
  if(pickerState.query){
    pickerState.query='';
    document.getElementById('picker-search').value='';
    renderPicker();
    return;
  }
  if(pickerState.path.length){
    pickerState.path.pop();
    renderPicker();
    return;
  }
  closePicker();
}
function selectTopic(topicId){
  if(pickerState.target===null){
    selectedTopics.push({topicId,columns:1});
    const values=JamBooEngine.distributeColumns(selectedTopics.length,numCols);
    selectedTopics.forEach((entry,index)=>{entry.columns=values[index];});
    enforceMaxColumns();
  }else{
    selectedTopics[pickerState.target].topicId=topicId;
    enforceMaxColumns();
  }
  closePicker();
}
function renderPicker(){
  const dictionary=T[lang];
  const body=document.getElementById('picker-body');
  const title=document.getElementById('picker-title');
  const back=document.getElementById('picker-back');
  body.innerHTML='';
  back.disabled=pickerState.path.length===0&&!pickerState.query;

  if(pickerState.query){
    title.textContent=dictionary.searchPH.replace('...','');
    const results=JamBooEngine.searchTopics(repository,pickerState.query);
    if(!results.length){
      const empty=document.createElement('div');
      empty.className='picker-empty';
      empty.textContent=dictionary.noResults;
      body.appendChild(empty);
      return;
    }
    const section=document.createElement('div');
    section.className='picker-section';
    section.textContent=`${results.length} ${dictionary.resultsWord}`;
    body.appendChild(section);
    results.forEach(topic=>{
      body.appendChild(pickerItem({
        name:topicName(topic),
        path:topicPath(topic),
        onSelect:()=>selectTopic(topic.id),
      }));
    });
    return;
  }

  if(!pickerState.path.length){
    title.textContent=dictionary.pickerTitle;
    repository.categories.forEach(category=>{
      if(!category.subjects.length) return;
      const section=document.createElement('div');
      section.className='picker-section';
      section.textContent=JamBooEngine.localizeName(category.name,lang);
      body.appendChild(section);
      category.subjects.forEach(subject=>{
        if(!subject.topics.length) return;
        body.appendChild(pickerItem({
          name:JamBooEngine.localizeName(subject.name,lang)||subject.id,
          path:subject.topics.length===1?topicName(subject.topics[0]):'',
          arrow:'›',
          onSelect:()=>{pickerState.path=[category.id,subject.id];renderPicker();},
        }));
      });
    });
    return;
  }

  const [categoryId,subjectId]=pickerState.path;
  const category=repository.categories.find(entry=>entry.id===categoryId);
  const subject=category?.subjects.find(entry=>entry.id===subjectId);
  title.textContent=JamBooEngine.localizeName(subject?.name,lang)||dictionary.pickerTitle;
  (subject?.topics||[]).forEach(topic=>{
    body.appendChild(pickerItem({
      name:topicName(topic),
      path:`${topic.questions.length} ${dictionary.questions}`,
      onSelect:()=>selectTopic(topic.id),
    }));
  });
}

document.getElementById('picker-search').addEventListener('input',event=>{
  pickerState.query=event.target.value.trim();
  renderPicker();
});
document.getElementById('picker-overlay').addEventListener('click',event=>{
  if(event.target===document.getElementById('picker-overlay')) closePicker();
});
document.getElementById('picker-overlay').addEventListener('keydown',event=>{
  if(event.key==='Escape'){closePicker();return;}
  if(event.key!=='ArrowDown'&&event.key!=='ArrowUp') return;
  const items=[...document.querySelectorAll('.picker-item')];
  if(!items.length) return;
  event.preventDefault();
  const active=document.activeElement;
  const index=items.indexOf(active);
  if(index<0){items[0].focus();return;}
  const next=Math.min(items.length-1,Math.max(0,index+(event.key==='ArrowDown'?1:-1)));
  items[next].focus();
});

init();

// Comet particles
(function(){
  const canvas=document.getElementById('comet-canvas');
  const context=canvas.getContext('2d');
  const COLORS=['#00FFFF','#FF00FF','#AA00FF','#6600FF','#FFD700'];
  const COUNT=20;
  let width,height;
  function resize(){width=canvas.width=window.innerWidth;height=canvas.height=window.innerHeight;}
  resize();
  window.addEventListener('resize',resize,{passive:true});
  function random(min,max){return min+Math.random()*(max-min);}
  function spawn(){
    const angle=random(0,Math.PI*2);
    const speed=random(1.2,3.5);
    let x,y;
    if(Math.random()<0.5){x=Math.random()<0.5?-10:width+10;y=random(0,height);}
    else{x=random(0,width);y=Math.random()<0.5?-10:height+10;}
    return{x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      size:random(1.2,2.8),color:COLORS[0|random(0,COLORS.length)],
      trail:[],trailLength:0|random(24,55),alpha:random(0.45,0.85)};
  }
  const comets=Array.from({length:COUNT},spawn);
  comets.forEach(comet=>{comet.x=random(0,width);comet.y=random(0,height);});
  function tick(){
    context.clearRect(0,0,width,height);
    comets.forEach(comet=>{
      comet.trail.push({x:comet.x,y:comet.y});
      if(comet.trail.length>comet.trailLength) comet.trail.shift();
      const trailLength=comet.trail.length;
      for(let index=0;index<trailLength;index++){
        const point=comet.trail[index];
        const factor=index/trailLength;
        context.beginPath();context.arc(point.x,point.y,comet.size*factor*0.8,0,Math.PI*2);
        context.fillStyle=comet.color;context.globalAlpha=factor*comet.alpha*0.45;context.fill();
      }
      context.beginPath();context.arc(comet.x,comet.y,comet.size,0,Math.PI*2);
      context.fillStyle=comet.color;context.globalAlpha=comet.alpha;context.fill();
      context.globalAlpha=1;
      comet.x+=comet.vx;comet.y+=comet.vy;
      if(comet.x<-70||comet.x>width+70||comet.y<-70||comet.y>height+70)Object.assign(comet,spawn());
    });
    requestAnimationFrame(tick);
  }
  tick();
})();

// Sticky header scroll-shrink
(function(){
  const header=document.querySelector('.hdr');
  let ticking=false;
  window.addEventListener('scroll',function(){
    if(!ticking){
      requestAnimationFrame(function(){
        if(window.scrollY>10) header.classList.add('hdr-scrolled');
        else header.classList.remove('hdr-scrolled');
        ticking=false;
      });
      ticking=true;
    }
  },{passive:true});
})();

// Splash
(function(){
  const splash=document.getElementById('splash');
  setTimeout(function(){
    splash.classList.add('hide');
    splash.addEventListener('animationend',function(){splash.style.display='none';},{once:true});
    setTimeout(function(){splash.style.display='none';},500);
  },800);
})();
