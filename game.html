<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JamBoo — Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   RETRO / SYNTHWAVE THEME
═══════════════════════════════════════════ */
:root {
  --bz:       1;
  --bg:       #0A0A1F;
  --panel:    #12122A;
  --panel2:   #0D0D22;
  --border:   #BF00FF;
  --primary:  #00FFCC;
  --accent:   #FF00BB;
  --danger:   #FF4444;
  --text:     #FFFFFF;
  --text2:    rgba(255,255,255,.45);
  --gray:     rgba(255,255,255,.05);
  --shadow:   0 0 24px rgba(0,255,204,.18);
  --radius:   4px;
  --fh:       'Fredoka One', cursive;
  --fp:       'Press Start 2P', monospace;
  --fb:       'Nunito', sans-serif;
  --cat-bg:   #0D0D22;
  --cat-color:#00FFCC;
  --cell-bg:  #12122A;
  --cell-hover:#1A1A3A;
  --cell-used:#080818;
  --cell-used-text:rgba(255,255,255,.15);
}

/* ═══════════════════════════════════════════
   RESET + BASE
═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--fb);background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}

/* ═══════════════════════════════════════════
   LOADING
═══════════════════════════════════════════ */
#loading{
  position:fixed;inset:0;z-index:9999;
  display:grid;place-items:center;overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,0,187,.2), transparent 34%),
    radial-gradient(circle at 50% 100%, rgba(0,255,204,.14), transparent 38%),
    linear-gradient(180deg,#040410 0%, #090A1D 50%, #040410 100%);
}
#loading.hidden{display:none;}
#loading::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at center, rgba(0,255,204,.08), transparent 48%),
    repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px);
  opacity:.42;
}
#loading::after{
  content:'';position:absolute;inset:auto 0 0 0;height:34vh;pointer-events:none;
  background:
    linear-gradient(180deg, transparent 0%, rgba(0,0,0,.12) 12%, rgba(0,0,0,.45) 100%),
    linear-gradient(90deg, rgba(0,255,204,.14) 0 2px, transparent 2px 38px),
    linear-gradient(0deg, rgba(0,255,204,.08) 0 2px, transparent 2px 34px);
  mask-image:linear-gradient(180deg, transparent, #000 25%);
  opacity:.35;
}
.loading-shell{
  position:relative;z-index:1;
  width:min(92vw,560px);
  display:flex;flex-direction:column;align-items:stretch;gap:clamp(14px,2vw,20px);
}
.load-logo{
  width:min(70vw,228px);height:auto;
  image-rendering:pixelated;
  filter:drop-shadow(0 0 22px rgba(191,0,255,.75)) drop-shadow(0 0 10px rgba(255,0,187,.38));
  animation:
    logoArrive 1s cubic-bezier(.14,.84,.28,1.08) both,
    logoDrift 7s ease-in-out 1s infinite;
}
@keyframes logoArrive{
  0%{transform:translateY(40px) scale(.72);opacity:0;}
  68%{transform:translateY(-10px) scale(1.04);opacity:1;}
  100%{transform:translateY(0) scale(1);opacity:1;}
}
@keyframes logoDrift{
  0%,100%{transform:translateY(0) rotate(0deg);}
  25%{transform:translateY(-4px) rotate(-.7deg);}
  55%{transform:translateY(2px) rotate(.6deg);}
  80%{transform:translateY(-3px) rotate(-.4deg);}
}
.load-bar-wrap{
  width:min(100%,340px);height:8px;
  padding:0;background:rgba(255,255,255,.08);
  border:1px solid rgba(0,255,204,.24);
  box-shadow:inset 0 0 8px rgba(0,0,0,.7),0 0 12px rgba(0,255,204,.12);
  overflow:hidden;
}
.load-bar{
  position:relative;width:var(--load-progress,0%);height:100%;
  background:linear-gradient(90deg, rgba(0,255,204,.15), rgba(0,255,204,.95), rgba(255,0,187,.85));
  box-shadow:0 0 18px rgba(0,255,204,.42);
  transition:width .3s linear;
}
.load-bar::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 0 38%,rgba(255,255,255,.7) 50%,transparent 62% 100%);
  animation:loadSignal 1.8s linear infinite;
}
@keyframes loadSignal{
  from{transform:translateX(-130%);}
  to{transform:translateX(130%);}
}
.load-text{
  font-family:var(--fp);font-size:7px;
  color:rgba(255,255,255,.72);
  letter-spacing:3px;text-transform:uppercase;text-align:center;
  text-shadow:0 0 10px rgba(0,255,204,.25);
  animation:loadTextPulse 2.8s ease-in-out infinite;
}
@keyframes loadTextPulse{
  0%,100%{opacity:.7;letter-spacing:3px;}
  50%{opacity:1;letter-spacing:4px;}
}
.loading-error-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.loading-error-actions[hidden]{display:none;}
.loading-error-back{
  padding:10px 16px;
  border:3px solid var(--accent);
  background:#111126;color:#fff;
  font-family:var(--fp);font-size:7px;text-decoration:none;text-transform:uppercase;
  box-shadow:4px 4px 0 #000,0 0 14px rgba(255,0,187,.28);
}
.loading-error-back:hover{filter:brightness(1.2);}
#loading.has-error .load-bar-wrap{display:none;}
#loading.has-error .load-text{color:#ff8fcf;animation:none;line-height:1.8;}

/* ═══════════════════════════════════════════
   GAME WRAPPER
═══════════════════════════════════════════ */
#game-wrap{display:none;}
#game-wrap.ready{display:block;}

/* ═══════════════════════════════════════════
   HEADER  (centered logo popping out, teams on both sides)
═══════════════════════════════════════════ */
.ghdr{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;
  padding:7px clamp(10px,2vw,22px);
  min-height:88px;
  background:linear-gradient(100deg,rgba(35,5,52,.97),rgba(180,0,115,.92) 48%,rgba(45,4,65,.97));
  border-bottom:2px solid rgba(0,255,204,.45);
  box-shadow:0 2px 0 #000,0 10px 32px rgba(0,0,0,.48),0 0 28px rgba(255,0,187,.2);
  backdrop-filter:blur(16px) saturate(1.4);
  overflow:visible;
}

/* pixel scanline on header */
.ghdr::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,rgba(0,0,0,.07) 0px,rgba(0,0,0,.07) 1px,
    transparent 1px,transparent 3px
  );
}

/* big neon logo centered over the header, floating above and below it */
.ghdr-brand{
  position:absolute;left:50%;top:calc(50% + 42px);
  transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;
  z-index:103;text-decoration:none;pointer-events:auto;
}
.ghdr-brand::after{
  content:'';position:absolute;inset:8% 14%;z-index:-1;
  background:radial-gradient(circle,rgba(255,0,187,.4),transparent 68%);
  filter:blur(20px);opacity:.75;
  transition:opacity .2s ease,transform .2s ease;
}
.ghdr-brand:hover::after{opacity:1;transform:scale(1.08);}
.ghdr-logo{
  height:clamp(104px,12vw,156px);width:auto;display:block;cursor:pointer;
  image-rendering:pixelated;
  animation:logoHeaderFloat 5s ease-in-out infinite,logoNeon 2.8s ease-in-out infinite;
}
@keyframes logoHeaderFloat{
  0%,100%{transform:translateY(0) rotate(-.6deg);}
  50%    {transform:translateY(-7px) rotate(.6deg);}
}
@keyframes logoNeon{
  0%,100%{filter:drop-shadow(0 8px 18px rgba(0,0,0,.85)) drop-shadow(0 0 12px rgba(191,0,255,.6)) drop-shadow(0 0 26px rgba(0,255,204,.22));}
  50%    {filter:drop-shadow(0 8px 18px rgba(0,0,0,.85)) drop-shadow(0 0 20px rgba(255,0,187,.85)) drop-shadow(0 0 42px rgba(0,255,204,.4));}
}
.ghdr-brand:focus-visible{outline:3px solid #FFD700;outline-offset:3px;}

/* ── RETRO PIXEL NAV BUTTONS ── */
.ghdr-btn{
  display:flex;align-items:center;gap:5px;
  padding:6px 10px;
  background:#0A0A1E;
  border:3px solid #2A1166;
  box-shadow:3px 3px 0 #000;
  color:rgba(255,255,255,.6);
  font-family:var(--fp);font-size:7px;
  cursor:pointer;text-decoration:none;
  text-transform:uppercase;letter-spacing:1px;
  transition:all .07s;
  white-space:nowrap;
  position:relative;z-index:102;
}
.ghdr-btn:hover{
  border-color:var(--primary);color:var(--primary);
  box-shadow:3px 3px 0 #000,0 0 8px rgba(0,255,204,.25);
  transform:translate(-1px,-1px);
}
.ghdr-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000;}
.ghdr-btn:disabled{
  opacity:.32;cursor:not-allowed;transform:none;
  border-color:#2A1166;color:rgba(255,255,255,.45);
  box-shadow:2px 2px 0 #000;
}
.ghdr-btn-redo{border-color:#075B59;}
.ghdr-btn-end{border-color:#550022;}
.ghdr-btn-end:hover{border-color:var(--danger);color:var(--danger);box-shadow:3px 3px 0 #000,0 0 8px rgba(255,68,68,.25);}

/* ═══════════════════════════════════════════
   SCOREBOARD  (teams split on both sides of the centered logo)
═══════════════════════════════════════════ */
.scorebar{
  display:flex;align-items:center;gap:clamp(6px,1vw,12px);flex:1;min-width:0;
  position:relative;z-index:102;
}
.scorebar-left,.scorebar-right{
  display:flex;align-items:center;gap:7px;flex:1;min-width:0;
  overflow-x:auto;overflow-y:visible;padding:4px 2px;
  scrollbar-width:none;
}
.scorebar-left{justify-content:flex-end;}
.scorebar-right{justify-content:flex-start;}
.scorebar-left::-webkit-scrollbar,.scorebar-right::-webkit-scrollbar{display:none;}
.logo-spacer{width:clamp(128px,16vw,196px);flex:none;}

/* ── SCORE CHIP: horizontal "NAME (SCORE)" pill ── */
.score-chip{
  display:flex;align-items:center;gap:0;
  background:#070718;
  border:2px solid rgba(255,255,255,.08);
  border-left:4px solid var(--tc,#00FFCC);
  box-shadow:3px 3px 0 #000;
  position:relative;overflow:visible;flex-shrink:0;
  transition:border-color .2s,box-shadow .2s;
}
/* top glow line */
.score-chip::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:var(--tc,#00FFCC);opacity:.55;
  box-shadow:0 0 6px var(--tc,#00FFCC);
}
.score-chip.active-team{animation:scoreFlash .4s steps(4);}
@keyframes scoreFlash{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.07);box-shadow:3px 3px 0 #000,0 0 14px var(--tc,#00FFCC);}
}
/* team name — Nunito for legibility */
.chip-name{
  font-family:var(--fb);font-weight:900;font-size:12px;
  text-transform:uppercase;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88px;
  color:var(--tc,#00FFCC);text-shadow:0 0 6px var(--tc,#00FFCC);
  padding:6px 4px 6px 9px;
}
/* (score) section */
.chip-score-wrap{
  display:flex;align-items:center;gap:1px;
  padding:6px 9px 6px 4px;
}
.chip-paren{
  font-family:var(--fp);font-size:8px;
  color:rgba(255,255,255,.3);line-height:1;
}
.chip-score{
  font-family:var(--fp);font-size:14px;line-height:1;
  color:#fff;text-shadow:2px 2px 0 #000;
  cursor:pointer;transition:color .12s,text-shadow .12s;
}
.chip-score:hover{color:var(--primary);text-shadow:0 0 10px var(--primary);}
.score-popup{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  font-family:var(--fp);font-size:9px;font-weight:900;
  animation:popUp 1.4s ease forwards;pointer-events:none;white-space:nowrap;
}
@keyframes popUp{0%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-28px)}}

/* ── SCORE IMPACT ANIMATIONS ── */
.score-burst{
  position:fixed;font-family:var(--fp);
  font-size:clamp(20px,4vw,36px);line-height:1.2;
  pointer-events:none;z-index:9100;white-space:nowrap;text-align:center;
}
.score-burst-gain{
  color:#00FFCC;text-shadow:0 0 16px #00FFCC,3px 3px 0 #000;
  animation:burstGain .85s cubic-bezier(.15,.9,.3,1) forwards;
}
.score-burst-lose{
  color:#FF4444;text-shadow:0 0 16px #FF4444,3px 3px 0 #000;
  animation:burstLose .85s cubic-bezier(.15,.9,.3,1) forwards;
}
@keyframes burstGain{
  0%  {opacity:1;transform:translate(-50%,-50%) scale(.15) rotate(-12deg);}
  45% {opacity:1;transform:translate(-50%,-70%) scale(1.2) rotate(6deg);}
  70% {opacity:.9;transform:translate(-50%,-80%) scale(1.1) rotate(-2deg);}
  100%{opacity:0;transform:translate(-50%,-110%) scale(1.3) rotate(0deg);}
}
@keyframes burstLose{
  0%  {opacity:0;transform:translate(-50%,-130%) scale(1.5);}
  28% {opacity:1;transform:translate(-50%,-50%) scale(.8);}
  55% {opacity:1;transform:translate(-50%,-50%) scale(1.05);}
  80% {opacity:.7;transform:translate(-50%,-50%) scale(.95);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.9);}
}
.score-chip.bounce-anim{animation:chipBounce .7s ease-out forwards !important;}
.score-chip.shake-anim {animation:chipShake  .6s ease-out forwards !important;}
@keyframes chipBounce{
  0%  {transform:translateY(0) scale(1);}
  18% {transform:translateY(-14px) scale(1.12);}
  38% {transform:translateY(3px) scale(.95);}
  55% {transform:translateY(-6px) scale(1.05);}
  72% {transform:translateY(1px) scale(.99);}
  100%{transform:translateY(0) scale(1);}
}
@keyframes chipShake{
  0%,100%{transform:translateX(0) scale(1);}
  8%  {transform:translateX(-9px) scale(.96);}
  18% {transform:translateX(9px)  scale(.96);}
  28% {transform:translateX(-7px);}
  38% {transform:translateX(7px);}
  48% {transform:translateX(-5px);}
  58% {transform:translateX(5px);}
  68% {transform:translateX(-3px);}
  80% {transform:translateX(3px);}
}

/* ═══════════════════════════════════════════
   BOTTOM BANNER  (nav + zoom controls)
═══════════════════════════════════════════ */
.gbottom{
  position:fixed;left:0;right:0;bottom:0;z-index:140;
  display:flex;align-items:center;justify-content:center;
  gap:clamp(6px,1.4vw,14px);flex-wrap:nowrap;
  padding:6px clamp(10px,2vw,22px) calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(58,14,102,.96),rgba(20,7,54,.99));
  border-top:2px solid #00FFCC;
  box-shadow:0 -2px 0 #000,0 -10px 34px rgba(0,0,0,.45),0 0 24px rgba(0,255,204,.4),0 0 54px rgba(255,0,187,.22);
  backdrop-filter:blur(14px) saturate(1.5);
  overflow-x:auto;scrollbar-width:none;
}
.gbottom::-webkit-scrollbar{display:none;}
.gbottom>*{flex:0 0 auto;}
.gbottom .ghdr-btn{
  min-height:37px;padding:5px 10px;
  background:linear-gradient(180deg,rgba(48,18,86,.96),rgba(22,9,52,.96));
  border-color:rgba(0,255,204,.55);
  color:rgba(255,255,255,.92);
  box-shadow:3px 3px 0 #000,0 0 10px rgba(0,255,204,.16);
}
.gbottom .ghdr-btn:hover{
  border-color:#00FFCC;color:#00FFCC;
  box-shadow:3px 3px 0 #000,0 0 14px rgba(0,255,204,.45);
}
.gbottom .ghdr-btn-end{border-color:rgba(255,0,187,.65);}
.gbottom .ghdr-btn-end:hover{border-color:#FF2D95;color:#FF2D95;box-shadow:3px 3px 0 #000,0 0 14px rgba(255,0,187,.5);}
.zoom-group{
  display:flex;align-items:center;gap:3px;
  padding:2px 5px;background:linear-gradient(180deg,rgba(20,34,64,.96),rgba(10,16,40,.96));
  border:2px solid rgba(0,255,204,.45);box-shadow:3px 3px 0 #000,0 0 10px rgba(0,255,204,.16);
}
.zoom-btn{
  width:30px;height:30px;
  background:rgba(16,26,54,.95);border:2px solid rgba(0,255,204,.35);
  border-radius:var(--radius);
  color:#dff;font-size:16px;font-weight:bold;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .12s,background .12s,transform .12s,color .12s;line-height:1;
}
.zoom-btn:hover{border-color:var(--primary);background:rgba(0,255,204,.14);color:#00FFCC;transform:translateY(-1px);}
.zoom-btn:active{transform:translateY(1px);}
.zoom-lbl{font-family:var(--fp);font-size:8px;color:rgba(255,255,255,.9);min-width:42px;text-align:center;letter-spacing:.5px;text-shadow:0 0 8px rgba(0,255,204,.4);}

/* ═══════════════════════════════════════════
   BOARD
═══════════════════════════════════════════ */
.board-wrap{padding:16px;overflow-x:auto;}
.board{display:grid;gap:8px;min-width:400px;}
.board-cell{
  border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:10px 8px;
  font-family:var(--fh);
  transition:all .15s;position:relative;overflow:hidden;
}
.cat-cell{
  background:var(--cat-bg);border:2px solid var(--border);
  color:var(--cat-color);
  font-size:calc(clamp(15px,2.1vw,21px) * var(--bz));
  min-height:calc(64px * var(--bz));
  letter-spacing:.2px;line-height:1.15;text-transform:uppercase;
}
.q-cell{
  background:var(--cell-bg);border:2px solid var(--border);
  cursor:pointer;min-height:calc(72px * var(--bz));flex-direction:column;gap:4px;
}
.q-cell:hover:not(.used){
  background:var(--cell-hover);border-color:var(--primary);
  transform:translateY(-2px);box-shadow:0 0 14px rgba(0,255,204,.25);
}
.q-cell.used{
  background:var(--cell-used);border-color:rgba(255,255,255,.06);
  cursor:default;transform:none;box-shadow:none;
}
.q-cell.missing{
  background:var(--cell-used);border-color:rgba(255,255,255,.04);
  cursor:not-allowed;opacity:.45;transform:none;box-shadow:none;
}
.q-cell.missing:hover{background:var(--cell-used);border-color:rgba(255,255,255,.04);transform:none;box-shadow:none;}
.cell-pts{font-size:calc(clamp(18px,3vw,28px) * var(--bz));color:var(--accent);line-height:1;}
.q-cell.used .cell-pts{color:var(--cell-used-text);}
.cell-check{font-size:calc(18px * var(--bz));opacity:.4;}

/* ═══════════════════════════════════════════
   MODAL
═══════════════════════════════════════════ */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.8);z-index:500;
  align-items:center;justify-content:center;padding:16px;
}
.modal-overlay.active{display:flex;}
.modal{
  background:var(--panel2);
  border:3px solid var(--border);
  border-radius:var(--radius);
  width:100%;max-width:640px;max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow);position:relative;
  animation:modalIn .2s ease;
}
@keyframes modalIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{
  background:var(--panel);border-bottom:2px solid var(--border);
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.modal-cat{font-family:var(--fh);font-size:13px;color:var(--primary);letter-spacing:1px;text-transform:uppercase;}
.modal-pts{font-family:var(--fh);font-size:24px;color:var(--accent);line-height:1;}
.modal-close{
  width:32px;height:32px;border-radius:50%;
  background:var(--gray);border:2px solid rgba(255,255,255,.15);
  color:var(--text2);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .12s;flex-shrink:0;
}
.modal-close:hover{border-color:var(--danger);color:var(--danger);}
.modal-body{padding:18px;}
.q-text{font-size:clamp(16px,2.5vw,22px);font-weight:800;line-height:1.45;margin-bottom:16px;text-align:center;white-space:pre-wrap;}

/* Timer */
.modal-timer-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-bottom:14px;overflow:hidden;}
.modal-timer-fill{height:100%;background:var(--primary);transition:width 1s linear;width:100%;}
.modal-timer-fill.warning{background:var(--danger);}

/* MC */
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.mc-opt{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:var(--gray);border:2px solid rgba(255,255,255,.12);border-radius:var(--radius);
  color:var(--text);font-family:var(--fb);font-weight:800;font-size:13px;
  cursor:pointer;text-align:left;transition:all .12s;
}
.mc-opt:hover:not(:disabled){border-color:var(--primary);background:rgba(0,255,204,.06);}
.mc-letter{
  width:26px;height:26px;border-radius:50%;
  background:var(--border);color:var(--bg);
  font-family:var(--fh);font-size:14px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.mc-opt.correct{background:rgba(0,255,204,.15);border-color:var(--primary) !important;}
.mc-opt.correct .mc-letter{background:var(--primary);color:#000;}
.mc-opt.wrong{background:rgba(255,68,68,.15);border-color:var(--danger) !important;}
.mc-opt.wrong .mc-letter{background:var(--danger);color:#fff;}
.mc-opt:disabled{cursor:default;}

/* Drawing */
.drawing-section{margin-bottom:14px;}
.canvas-wrap{background:rgba(255,255,255,.97);border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:crosshair;}
.drawing-canvas{display:block;width:100%;touch-action:none;}
.draw-tools{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;align-items:center;}
.draw-btn{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:border-color .12s;flex-shrink:0;}
.draw-btn.active{border-color:var(--text);}
.draw-clear{
  padding:5px 12px;background:var(--gray);
  border:2px solid rgba(255,255,255,.15);border-radius:var(--radius);
  color:var(--text);font-family:var(--fb);font-weight:800;font-size:12px;
  cursor:pointer;margin-left:auto;
}

/* Answer box */
.answer-box{
  background:rgba(0,255,204,.07);border:2px solid var(--primary);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:12px;display:none;
}
.answer-box.shown{display:block;}
.answer-label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--primary);margin-bottom:4px;}
.answer-text{font-size:16px;font-weight:800;line-height:1.4;}

/* Award */
.award-section{display:none;}
.award-section.shown{display:block;}
.award-title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:6px;}
.award-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-bottom:8px;}
.award-btn{
  padding:8px 10px;border-radius:var(--radius);
  background:var(--gray);border:2px solid;
  font-family:var(--fb);font-weight:800;font-size:12px;
  cursor:pointer;transition:all .12s;text-align:center;
}
.award-btn:hover{filter:brightness(1.2);}

/* Action buttons */
.action-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn-reveal{
  flex:1;padding:12px;
  background:var(--primary);border:3px solid rgba(0,0,0,.2);border-radius:var(--radius);
  color:var(--bg);font-family:var(--fh);font-size:16px;
  cursor:pointer;transition:all .12s;box-shadow:0 0 14px rgba(0,255,204,.25);
}
.btn-reveal:hover{filter:brightness(1.1);}
.btn-done{
  padding:12px 20px;
  background:var(--gray);border:2px solid rgba(255,255,255,.15);border-radius:var(--radius);
  color:var(--text);font-family:var(--fh);font-size:15px;
  cursor:pointer;transition:all .12s;display:none;
}
.btn-done:hover{border-color:var(--text);}

/* ═══════════════════════════════════════════
   WINNER SCREEN
═══════════════════════════════════════════ */
#winner-screen{display:none;min-height:100vh;}
#winner-screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;}
.winner-title{font-family:var(--fp);font-size:clamp(14px,4vw,28px);color:var(--primary);text-align:center;margin-bottom:6px;text-shadow:0 0 20px rgba(0,255,204,.5),3px 3px 0 #000;}
.winner-subtitle{font-family:var(--fp);font-size:clamp(10px,2.5vw,18px);text-align:center;margin-bottom:8px;}
.winner-pts{font-size:18px;font-weight:800;color:var(--text2);text-align:center;margin-bottom:28px;}
.final-cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:32px;}
.final-card{
  background:var(--panel);
  border:3px solid;
  box-shadow:4px 4px 0 #000;
  padding:18px 22px;text-align:center;min-width:120px;
}
.final-rank{font-size:28px;margin-bottom:4px;}
.final-name{font-family:var(--fp);font-size:9px;margin-bottom:6px;}
.final-score{font-family:var(--fp);font-size:14px;}

/* 3 winner buttons */
.winner-actions{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  width:100%;max-width:360px;
}
.btn-winner{
  width:100%;padding:14px 24px;
  font-family:var(--fp);font-size:9px;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;
  transition:all .08s;text-align:center;
}
.btn-winner-primary{
  background:var(--primary);
  border:4px solid #00CCAA;border-bottom:4px solid #007755;
  box-shadow:4px 4px 0 #000,0 0 18px rgba(0,255,204,.3);
  color:#000;
}
.btn-winner-primary:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000,0 0 24px rgba(0,255,204,.5);}
.btn-winner-secondary{
  background:#1A0A3A;
  border:4px solid #5500BB;border-bottom:4px solid #220055;
  box-shadow:4px 4px 0 #000;
  color:var(--primary);
}
.btn-winner-secondary:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000,0 0 14px rgba(0,255,204,.2);}
.btn-winner-ghost{
  background:transparent;
  border:3px solid rgba(255,255,255,.2);
  box-shadow:3px 3px 0 #000;
  color:var(--text2);
}
.btn-winner-ghost:hover{border-color:rgba(255,255,255,.5);color:#fff;transform:translate(-1px,-1px);}
.btn-winner:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000 !important;}

/* ═══════════════════════════════════════════
   MYSTERY SCREEN
═══════════════════════════════════════════ */
#mystery-screen{
  display:none;position:fixed;inset:0;background:var(--bg);
  z-index:950;flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
#mystery-screen.active{display:flex;}
.myst-q{
  font-family:var(--fp);font-size:clamp(80px,20vw,140px);line-height:1;
  color:var(--accent);text-shadow:0 0 40px rgba(255,0,187,.7),4px 4px 0 #000;
  animation:mystQ .5s steps(2) infinite;
}
@keyframes mystQ{
  0%,100%{color:var(--accent);transform:scale(1);}
  50%{color:var(--primary);transform:scale(1.1);}
}
.myst-label{
  font-family:var(--fp);font-size:9px;letter-spacing:4px;color:var(--text2);
  animation:mystBlink .7s steps(1) infinite;
}
@keyframes mystBlink{0%,100%{opacity:1;}50%{opacity:0;}}
.myst-count{
  font-family:var(--fp);font-size:clamp(50px,12vw,90px);line-height:1;
  color:var(--primary);text-shadow:0 0 30px rgba(0,255,204,.6),3px 3px 0 #000;
}

/* Confetti */
.confetti-piece{
  position:fixed;border-radius:2px;pointer-events:none;z-index:9998;
  animation:fall linear forwards;
}
@keyframes fall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0;}
}

/* Verdict flash */
#verdict-flash{
  position:fixed;inset:0;z-index:8000;pointer-events:none;
  display:flex;align-items:center;justify-content:center;opacity:0;
}
#verdict-flash.show-correct{animation:vFlashC .9s ease forwards;}
#verdict-flash.show-wrong{animation:vFlashW .9s ease forwards;}
@keyframes vFlashC{0%{opacity:0;background:rgba(0,255,100,.0)}20%{opacity:1;background:rgba(0,255,100,.3)}100%{opacity:0;background:rgba(0,255,100,.0)}}
@keyframes vFlashW{0%{opacity:0;background:rgba(255,40,40,.0)}20%{opacity:1;background:rgba(255,40,40,.3)}100%{opacity:0;background:rgba(255,40,40,.0)}}
.verdict-icon{
  font-size:clamp(80px,18vw,160px);
  animation:vIconPop .9s cubic-bezier(.34,1.56,.64,1) forwards;
  filter:drop-shadow(0 0 30px currentColor);
}
.verdict-icon.v-correct{color:#00FF88;}
.verdict-icon.v-wrong{color:#FF3333;}
@keyframes vIconPop{0%{transform:scale(0) rotate(-20deg);opacity:0}50%{transform:scale(1.3) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}

/* Countdown overlay (inside modal) */
.countdown-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.88);
  z-index:50;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius);
}
.countdown-num{
  font-family:var(--fh);font-size:100px;color:var(--primary);
  text-shadow:0 0 40px var(--primary);
  animation:countPop .82s ease forwards;
}
@keyframes countPop{0%{transform:scale(1.8);opacity:0}25%{transform:scale(1);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(.5);opacity:0}}

/* MC option shake on wrong */
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.mc-opt.shake{animation:shake .4s ease;}

/* Award / team picker */
.outcome-toggle{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
.outcome-btn{
  flex:1;max-width:160px;padding:10px 0;
  border-radius:var(--radius);border:2px solid;background:transparent;
  font-family:var(--fb);font-weight:900;font-size:14px;cursor:pointer;
  transition:all .12s;
}
.outcome-btn.oc-correct{border-color:var(--primary);color:var(--primary);}
.outcome-btn.oc-correct:hover,.outcome-btn.oc-correct.sel{background:var(--primary);color:#000;}
.outcome-btn.oc-wrong{border-color:var(--danger);color:var(--danger);}
.outcome-btn.oc-wrong:hover,.outcome-btn.oc-wrong.sel{background:var(--danger);color:#fff;}
.team-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px;}
.team-pick-btn{
  padding:10px 18px;border-radius:var(--radius);
  border:3px solid;background:rgba(0,0,0,.3);
  font-family:var(--fb);font-weight:900;font-size:14px;
  cursor:pointer;transition:all .15s;color:#fff;
}
.team-pick-btn:hover:not(:disabled){transform:scale(1.07);filter:brightness(1.25);}
.team-pick-btn:disabled{opacity:.35;cursor:default;}
.team-pick-btn.applied{transform:scale(1.1);}

@media(max-width:480px){
  .loading-shell{width:calc(100vw - 20px);padding:16px 13px 14px;gap:12px;}
  #loading .load-logo{width:54px;}
  .loading-topic{font-size:6px;}
  .mc-grid{grid-template-columns:1fr;}
  .award-grid{grid-template-columns:1fr 1fr;}
  .chip-name{font-size:10px;max-width:60px;padding:5px 3px 5px 7px;}
  .chip-score{font-size:11px;}
  .chip-score-wrap{padding:5px 7px 5px 3px;}
}

@media(max-height:760px){
  #loading{overflow-y:auto;padding:14px;}
  .loading-shell{gap:11px;}
  #loading .load-logo{width:64px;}
}

/* ═══════════════════════════════════════════
   SCORE EDIT
═══════════════════════════════════════════ */
.score-edit-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.78);z-index:700;
  align-items:center;justify-content:center;
}
.score-edit-overlay.active{display:flex;}
.score-edit-box{
  background:var(--panel2);
  border:3px solid var(--border);
  box-shadow:6px 6px 0 #000,0 0 28px rgba(191,0,255,.25);
  padding:22px 28px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  min-width:210px;
  animation:modalIn .18s ease;
}
.score-edit-lbl{
  font-family:var(--fp);font-size:7px;color:var(--text2);
  letter-spacing:2px;text-transform:uppercase;
}
.score-edit-name{
  font-family:var(--fp);font-size:9px;text-transform:uppercase;letter-spacing:1px;
}
.score-edit-input{
  background:#0A0A1F;border:3px solid var(--border);
  color:#fff;font-family:var(--fp);font-size:26px;
  width:130px;text-align:center;padding:8px 4px;outline:none;
}
.score-edit-input::-webkit-inner-spin-button,.score-edit-input::-webkit-outer-spin-button{display:none;}
.score-edit-input[type=number]{-moz-appearance:textfield;}
.score-edit-btns{display:flex;gap:10px;}
.score-edit-btn{
  padding:9px 18px;font-family:var(--fp);font-size:8px;
  cursor:pointer;border:3px solid;letter-spacing:1px;
  box-shadow:3px 3px 0 #000;transition:transform .07s,box-shadow .07s;
}
.score-edit-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000;}
.score-edit-btn-ok{background:var(--primary);border-color:#00CCAA;color:#000;}
.score-edit-btn-ok:hover{filter:brightness(1.1);}
.score-edit-btn-cancel{background:transparent;border-color:rgba(255,255,255,.25);color:var(--text2);}
.score-edit-btn-cancel:hover{border-color:rgba(255,255,255,.5);color:#fff;}

/* ================================================================
   RESPONSIVE INTERFACE REFINEMENT
   ================================================================ */
html{scroll-behavior:smooth;color-scheme:dark;overflow-x:hidden;}
body{
  min-height:100dvh;
  background:
    radial-gradient(circle at 12% 8%,rgba(0,255,204,.08),transparent 28rem),
    radial-gradient(circle at 88% 12%,rgba(255,0,187,.1),transparent 34rem),
    linear-gradient(180deg,#09091f,#050513 65%,#0b051d);
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,255,204,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(191,0,255,.025) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 85%);
}
body::after{
  content:'';position:fixed;inset:-40%;z-index:-1;pointer-events:none;
  background:conic-gradient(from 0deg,transparent,rgba(0,255,204,.035),transparent 30%,rgba(191,0,255,.045),transparent 65%);
  animation:gameAmbient 30s linear infinite;
}
@keyframes gameAmbient{to{transform:rotate(1turn);}}
#game-wrap{min-height:100dvh;padding-bottom:calc(72px + env(safe-area-inset-bottom));}
.ghdr{min-height:88px;padding:8px clamp(10px,2vw,24px);}
.ghdr::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.06),transparent 54%);animation:headerSignal 8s ease-in-out infinite;}
@keyframes headerSignal{0%,55%{transform:translateX(-100%)}85%,100%{transform:translateX(100%)}}
.ghdr-logo{height:clamp(104px,12vw,156px);}
.ghdr-btn{min-height:40px;padding:8px 11px;transition:transform .14s ease,border-color .16s,box-shadow .16s,color .16s;}
.ghdr-btn:focus-visible,.zoom-btn:focus-visible,.modal button:focus-visible,.score-chip [role="button"]:focus-visible{outline:3px solid #FFD700;outline-offset:3px;}
.score-chip{min-height:38px;background:linear-gradient(180deg,rgba(8,8,27,.97),rgba(4,4,16,.95));transition:transform .16s ease,border-color .16s,box-shadow .16s;}
.score-chip:hover{transform:translateY(-1px);border-color:var(--tc,#00FFCC);box-shadow:3px 4px 0 #000,0 0 14px rgba(0,255,204,.16);}
.chip-score{padding:3px;border-radius:2px;}
.gbottom{max-width:1600px;margin:0 auto;left:0;right:0;}
.gbottom .ghdr-btn{min-width:44px;justify-content:center;}
.board-wrap{
  max-width:1600px;margin:0 auto;padding:clamp(52px,6vw,84px) clamp(10px,2vw,22px) clamp(10px,2vw,22px);
  overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:thin;
  scrollbar-color:rgba(0,255,204,.55) rgba(255,255,255,.06);
}
.board{
  min-width:max(100%,calc(var(--board-cols,4) * 112px));
  gap:clamp(6px,1vw,11px);padding:clamp(7px,1vw,12px);
  border:1px solid rgba(191,0,255,.18);
  background:linear-gradient(145deg,rgba(13,13,34,.72),rgba(5,5,18,.48));
  box-shadow:0 18px 50px rgba(0,0,0,.28),inset 0 0 32px rgba(0,0,0,.2);
}
.board-cell{
  border-radius:5px;transform:translateY(8px);opacity:0;
  animation:cellReveal .36s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay:calc(var(--cell-i,0) * 22ms);
}
@keyframes cellReveal{to{transform:translateY(0);opacity:1}}
.cat-cell{
  min-height:calc(66px * var(--bz));padding:12px 9px;
  background:linear-gradient(145deg,rgba(22,10,48,.96),rgba(7,16,34,.96));
  border-color:rgba(191,0,255,.72);box-shadow:inset 0 1px rgba(255,255,255,.04),0 5px 16px rgba(0,0,0,.22);
}
.q-cell{
  min-height:calc(82px * var(--bz));isolation:isolate;
  background:linear-gradient(145deg,rgba(20,20,48,.98),rgba(11,11,31,.98));
  box-shadow:inset 0 1px rgba(255,255,255,.035),0 7px 18px rgba(0,0,0,.2);
}
.q-cell::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 25%,rgba(0,255,204,.07),transparent 70%);transform:translateX(-110%);transition:transform .5s ease;}
.q-cell:hover:not(.used){transform:translateY(-3px) scale(1.012);box-shadow:0 9px 24px rgba(0,0,0,.26),0 0 18px rgba(0,255,204,.18);}
.q-cell:hover:not(.used)::before{transform:translateX(110%);}
.q-cell:focus-visible{outline:3px solid #FFD700;outline-offset:3px;border-color:var(--primary);}
.cell-pts{text-shadow:0 0 16px rgba(255,0,187,.46),2px 2px 0 #000;}
.modal-overlay{padding:clamp(10px,2vw,22px);background:rgba(2,2,12,.82);backdrop-filter:blur(10px) saturate(.8);}
.modal{
  width:min(100%,760px);max-height:min(92dvh,900px);
  border-color:rgba(191,0,255,.9);
  background:linear-gradient(150deg,rgba(17,17,43,.99),rgba(8,8,28,.99));
  box-shadow:0 24px 80px rgba(0,0,0,.58),0 0 34px rgba(191,0,255,.18);
  animation:modalRefined .24s cubic-bezier(.2,.85,.25,1);
}
@keyframes modalRefined{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:16px clamp(16px,3vw,24px);background:rgba(8,8,28,.74);}
.modal-body{padding:clamp(16px,3vw,26px);}
.modal-close{width:42px;height:42px;}
.q-text{font-size:clamp(18px,2.3vw,25px);line-height:1.42;margin:4px auto 22px;max-width:680px;white-space:pre-wrap;}
.mc-grid{gap:11px;margin-bottom:18px;}
.mc-opt{min-height:62px;padding:13px 15px;font-size:clamp(13px,1.6vw,16px);line-height:1.35;box-shadow:inset 0 1px rgba(255,255,255,.025);transition:transform .14s,border-color .14s,background .14s;}
.mc-opt:hover:not(:disabled){transform:translateY(-2px);}
.mc-letter{width:30px;height:30px;}
.answer-box{padding:15px 17px;margin-bottom:15px;background:linear-gradient(90deg,rgba(0,255,204,.1),rgba(0,255,204,.035));}
.answer-text{font-size:clamp(15px,2vw,19px);}
.btn-reveal,.btn-done{min-height:52px;transition:transform .14s,filter .14s,box-shadow .14s;}
.btn-reveal:hover,.btn-done:hover{transform:translateY(-2px);}
.outcome-btn,.team-pick-btn{min-height:46px;}
.drawing-canvas{min-height:220px;}
.loading-shell{
  width:min(94vw,560px);padding:clamp(18px,3vw,28px);gap:clamp(14px,2vw,20px);
  align-items:stretch;
  border:1px solid rgba(0,255,204,.22);
  background:
    linear-gradient(145deg,rgba(13,13,40,.9),rgba(4,4,18,.95)),
    radial-gradient(circle at 50% 0,rgba(255,0,187,.12),transparent 55%);
  box-shadow:8px 10px 0 rgba(0,0,0,.42),0 28px 90px rgba(0,0,0,.42),0 0 48px rgba(0,255,204,.055);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.loading-shell::before{
  content:'';display:block;position:absolute;left:24px;top:-1px;width:88px;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--primary));box-shadow:0 0 14px rgba(0,255,204,.5);
}
.loading-shell::after{
  content:'';display:block;position:absolute;right:24px;bottom:-1px;width:88px;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--accent));box-shadow:0 0 14px rgba(255,0,187,.45);
}
.loading-top{display:flex;align-items:center;gap:clamp(12px,2.4vw,20px);min-width:0;}
.load-logo{width:clamp(62px,15vw,94px);max-width:none;height:auto;flex:none;}
.loading-intro{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
.loading-topic{
  min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:#fff;font-family:var(--fp);font-size:clamp(7px,.9vw,9px);letter-spacing:1.1px;text-transform:uppercase;
  text-shadow:0 0 9px rgba(255,0,187,.3);
}
.loading-spec{
  align-self:flex-start;padding:5px 8px;border:1px solid rgba(0,255,204,.25);background:rgba(0,255,204,.055);
  color:var(--primary);font-family:var(--fp);font-size:5px;letter-spacing:.7px;white-space:nowrap;
}
.loading-progress{width:100%;display:grid;gap:8px;}
.loading-progress-meta{display:block;}
.loading-progress .load-text{margin:0;text-align:left;}
.loading-progress .load-bar-wrap{width:100%;height:10px;}
.loading-error-back{min-height:46px;display:inline-flex;align-items:center;justify-content:center;transition:transform .14s,filter .14s,border-color .14s;}
.loading-error-back:hover{transform:translateY(-2px);}

<body>

<!-- LOADING (brief — the board is assembled from the library, never generated) -->
<div id="loading" role="status" aria-live="polite" aria-label="Building your Jamboo">
  <div class="loading-shell">
    <div class="loading-top">
      <img class="load-logo" src="Jamboo-logo-png.png" alt="JamBoo">
      <div class="loading-intro" aria-live="polite">
        <strong class="loading-topic" id="loading-topic">Preparing board</strong>
        <span class="loading-spec" id="loading-spec">—</span>
      </div>
    </div>

    <div class="loading-progress">
      <div class="loading-progress-meta">
        <p class="load-text" id="load-text">Building your Jamboo...</p>
      </div>
      <div class="load-bar-wrap" id="generation-progress" role="progressbar" aria-labelledby="load-text" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="load-bar"></div>
      </div>
    </div>
    <div class="loading-error-actions" id="loading-error-actions" hidden>
      <button class="loading-error-back" type="button" id="loading-error-retry" onclick="retryGeneration()">Retry</button>
      <a class="loading-error-back" href="index.html" id="loading-error-back">Back to setup</a>
    </div>
  </div>
</div>
<!-- GAME WRAPPER -->
<div id="game-wrap">

  <header class="ghdr">
    <div class="scorebar" aria-label="Team scores">
      <div class="scorebar-left" id="scorebar-left"></div>
      <div class="logo-spacer" aria-hidden="true"></div>
      <div class="scorebar-right" id="scorebar-right"></div>
    </div>
    <a class="ghdr-brand" href="index.html" aria-label="JamBoo home">
      <img class="ghdr-logo" src="Jamboo-logo-png.png" alt="JamBoo">
    </a>
  </header>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <nav class="gbottom" aria-label="Game controls">
    <a class="ghdr-btn gctl-back" href="index.html">← <span id="lbl-back">Setup</span></a>
    <button class="ghdr-btn ghdr-btn-redo" id="redo-btn" onclick="redoLastQuestion()" disabled title="Redo last question" aria-label="Redo last question">↶ <span id="lbl-redo">Redo</span></button>
    <div class="zoom-group" role="group" aria-label="Board zoom">
      <button class="zoom-btn" onclick="zoomBoard(-1)" title="Zoom out" aria-label="Zoom board out">−</button>
      <span class="zoom-lbl" id="zoom-lbl">100%</span>
      <button class="zoom-btn" onclick="zoomBoard(1)" title="Zoom in" aria-label="Zoom board in">+</button>
    </div>
    <button class="ghdr-btn ghdr-btn-end" onclick="endGame()" id="lbl-end">🏆 End</button>
  </nav>

</div>

<!-- WINNER SCREEN (outside game-wrap so it isn't hidden by endGame) -->
<div id="winner-screen" role="status" aria-live="polite">
  <div class="winner-title" id="winner-title">🏆</div>
  <div class="winner-subtitle" id="winner-name"></div>
  <div class="winner-pts" id="winner-pts"></div>
  <div class="final-cards" id="final-cards"></div>
  <div class="winner-actions">
    <button class="btn-winner btn-winner-primary" onclick="window.location.href='index.html'" id="lbl-again">▶ Play Again</button>
    <button class="btn-winner btn-winner-secondary" onclick="sameTeams()" id="lbl-same-teams">↺ Same Teams, New Game</button>
    <button class="btn-winner btn-winner-ghost" onclick="goHome()" id="lbl-home">⌂ Home</button>
  </div>
</div>

<!-- MYSTERY SCREEN -->
<div id="mystery-screen">
  <div class="myst-q">?</div>
  <div class="myst-label" id="myst-label">CALCULATING...</div>
  <div class="myst-count" id="myst-count">3</div>
</div>

<!-- QUESTION MODAL -->
<div class="modal-overlay" id="q-modal" role="dialog" aria-modal="true" aria-labelledby="modal-question">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-cat" id="modal-cat"></div>
        <div class="modal-pts" id="modal-pts"></div>
      </div>
      <button class="modal-close" onclick="closeModal()" aria-label="Close question">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-timer-bar" id="timer-bar-wrap" style="display:none;">
        <div class="modal-timer-fill" id="timer-fill"></div>
      </div>
      <p class="q-text" id="modal-question"></p>
      <div class="mc-grid" id="mc-grid" style="display:none;"></div>
      <div class="drawing-section" id="drawing-section" style="display:none;">
        <div class="canvas-wrap">
          <canvas class="drawing-canvas" id="drawing-canvas" height="220"></canvas>
        </div>
        <div class="draw-tools">
          <button class="draw-btn active" data-color="#000000" style="background:#000;" onclick="setDrawColor(this)"></button>
          <button class="draw-btn" data-color="#EF4444" style="background:#EF4444;" onclick="setDrawColor(this)"></button>
          <button class="draw-btn" data-color="#3B82F6" style="background:#3B82F6;" onclick="setDrawColor(this)"></button>
          <button class="draw-btn" data-color="#00FFCC" style="background:#00FFCC;" onclick="setDrawColor(this)"></button>
          <button class="draw-btn" data-color="#FF00BB" style="background:#FF00BB;" onclick="setDrawColor(this)"></button>
          <button class="draw-btn" data-color="#FFFFFF" style="background:#fff;border-color:rgba(0,0,0,.3);" onclick="setDrawColor(this)"></button>
          <button class="draw-clear" onclick="clearCanvas()" id="lbl-clear">🗑 Clear</button>
        </div>
      </div>
      <div class="answer-box" id="answer-box">
        <div class="answer-label" id="lbl-answer">Answer</div>
        <div class="answer-text" id="answer-text"></div>
      </div>
      <div class="award-section" id="award-section">
        <div class="outcome-toggle" id="outcome-toggle">
          <button class="outcome-btn oc-correct" onclick="setOutcome(true)" id="btn-oc-correct">✓ Correct</button>
          <button class="outcome-btn oc-wrong" onclick="setOutcome(false)" id="btn-oc-wrong">✗ Wrong</button>
        </div>
        <div class="award-title" id="lbl-award">Who answered?</div>
        <div class="team-picker" id="team-picker"></div>
      </div>
      <div class="action-row">
        <button class="btn-reveal" id="reveal-btn" onclick="revealAnswer()"><span id="lbl-reveal">Reveal Answer</span></button>
        <button class="btn-done" id="done-btn" onclick="closeModal()"><span id="lbl-done">Done ✓</span></button>
      </div>
    </div>
  </div>
</div>

<script>
const GT = {
  en:{
    back:'Setup', redo:'Redo', redoTitle:'Redo last question', end:'🏆 End', reveal:'Reveal Answer', done:'Done ✓',
    answer:'Answer', award:'Who answered?', correct:'✓ Correct', wrong:'✗ Wrong',
    clear:'🗑 Clear', winner:'🏆 Winner!', playAgain:'▶ Play Again',
    sameTeams:'↺ Same Teams, New Game', home:'⌂ Home',
    pts:'pts', building:'Building your Jamboo...',
    errorSession:'This game session is invalid. Please create a new Jamboo.',
    backToSetup:'Back to setup',
    noConfig:'No game config found. Please go back to setup.',
    calculating:'CALCULATING...',
    retry:'Retry',
  },
  pt:{
    back:'Início', redo:'Refazer', redoTitle:'Refazer última pergunta', end:'🏆 Fim', reveal:'Revelar Resposta', done:'Feito ✓',
    answer:'Resposta', award:'Quem respondeu?', correct:'✓ Correto', wrong:'✗ Errado',
    clear:'🗑 Limpar', winner:'🏆 Vencedor!', playAgain:'▶ Jogar Novamente',
    sameTeams:'↺ Mesmos Times, Novo Jogo', home:'⌂ Início',
    pts:'pontos', building:'Montando seu Jamboo...',
    errorSession:'Esta sessão de jogo é inválida. Crie um novo Jamboo.',
    backToSetup:'Voltar ao início',
    noConfig:'Configuração não encontrada. Volte ao início.',
    calculating:'CALCULANDO...',
    retry:'Tentar novamente',
  },
  es:{
    back:'Inicio', redo:'Rehacer', redoTitle:'Rehacer última pregunta', end:'🏆 Fin', reveal:'Revelar Respuesta', done:'Listo ✓',
    answer:'Respuesta', award:'¿Quién respondió?', correct:'✓ Correcto', wrong:'✗ Incorrecto',
    clear:'🗑 Limpiar', winner:'🏆 ¡Ganador!', playAgain:'▶ Jugar de Nuevo',
    sameTeams:'↺ Mismos Equipos, Nuevo Juego', home:'⌂ Inicio',
    pts:'puntos', building:'Montando tu Jamboo...',
    errorSession:'Esta sesión de juego no es válida. Crea un nuevo Jamboo.',
    backToSetup:'Volver al inicio',
    noConfig:'Configuración no encontrada. Vuelve al inicio.',
    calculating:'CALCULANDO...',
    retry:'Reintentar',
  }
};

let cfg={}, gameData=null, teams=[], lang='en';
let currentCell=null, timerInterval=null;
let currentQuestionAward=null, lastClosedQuestion=null, boardCompletionTimer=null;
let drawCtx=null, isDrawing=false, drawColor='#000000';
let mcAnswered=null;
let openOutcome=null;
let scoreEditIdx=null;
const MIN_LOADING_MS=450;

function cleanText(value){
  return String(value ?? '').trim();
}

function normalizeSessionQuestion(rawQuestion,colIndex,rowIndex){
  if(!rawQuestion || typeof rawQuestion!=='object'){
    throw new Error(`Invalid question at ${colIndex}:${rowIndex}`);
  }
  const question=cleanText(rawQuestion.question);
  const options=Array.isArray(rawQuestion.options)?rawQuestion.options.map(cleanText).slice(0,4):[];
  const correctIndex=Number.isInteger(rawQuestion.correctIndex)?rawQuestion.correctIndex:-1;
  if(!question) throw new Error(`Missing question text at ${colIndex}:${rowIndex}`);
  if(options.length!==4 || options.some(option=>!option)) throw new Error(`Invalid choices at ${colIndex}:${rowIndex}`);
  if(new Set(options.map(option=>option.toLowerCase())).size!==4) throw new Error(`Duplicate choices at ${colIndex}:${rowIndex}`);
  if(correctIndex<0 || correctIndex>3) throw new Error(`Invalid correct answer at ${colIndex}:${rowIndex}`);
  return {
    question,
    options,
    correctIndex,
    answer:options[correctIndex],
    difficulty:Number(rawQuestion.difficulty)||2,
    subtopic:cleanText(rawQuestion.subtopic),
    type:'multiple',
    isDrawing:false,
  };
}

// The builder freezes a complete board into jamboo_config. The game never
// fetches questions, so a refresh always replays the exact same session.
function loadSession(rawSession){
  const expectedCols=cfg.numCols;
  const expectedRows=cfg.numRows;
  const categories=Array.isArray(rawSession?.categories)?rawSession.categories.map(cleanText):[];
  const rawQuestions=rawSession?.questions;
  if(!categories.length || !Array.isArray(rawQuestions) || rawQuestions.length!==expectedCols){
    throw new Error('Invalid session board');
  }
  const questions=rawQuestions.map((column,colIndex)=>{
    if(!Array.isArray(column) || column.length!==expectedRows){
      throw new Error(`Invalid session column at ${colIndex}`);
    }
    return column.map((question,rowIndex)=>normalizeSessionQuestion(question,colIndex,rowIndex));
  });
  return {categories:categories.slice(0,expectedCols),questions};
}

function retryGeneration(){
  window.location.reload();
}

function showSessionError(){
  const G=GT[lang]||GT.en;
  document.getElementById('load-text').textContent=G.errorSession;
  document.getElementById('loading-error-actions').hidden=false;
  document.getElementById('loading').classList.add('has-error');
}

async function boot() {
  const raw=localStorage.getItem('jamboo_config');
  if(!raw){
    alert(GT.en.noConfig);
    window.location.href='index.html';
    return;
  }

  let parsed=null;
  try{
    parsed=JSON.parse(raw);
  }catch(error){
    console.error('Invalid jamboo_config',error);
  }
  if(!parsed || !parsed.session){
    showSessionError();
    return;
  }

  cfg=parsed;
  lang=GT[cfg.lang]?cfg.lang:'en';
  teams=(cfg.teams||[]).map(team=>({...team,score:0}));
  applyLabels();

  const loadingTopic=document.getElementById('loading-topic');
  const loadingSpec=document.getElementById('loading-spec');
  if(loadingTopic){
    const title=cleanText((cfg.session.categories||[]).join(' · '))||'Jamboo';
    loadingTopic.textContent=title;
    loadingTopic.title=title;
  }
  if(loadingSpec){
    loadingSpec.textContent=`${cfg.numCols} × ${cfg.numRows} · ${cfg.numCols*cfg.numRows}`;
  }
  document.getElementById('load-text').textContent=(GT[lang]||GT.en).building;
  document.querySelector('.loading-shell')?.style.setProperty('--load-progress','100%');

  const startedAt=Date.now();
  try{
    gameData=loadSession(cfg.session);
  }catch(error){
    console.error('Invalid game session',error);
    showSessionError();
    return;
  }

  buildBoard();
  renderScorebar();
  const remaining=MIN_LOADING_MS-(Date.now()-startedAt);
  if(remaining>0) await new Promise(resolve=>setTimeout(resolve,remaining));
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('game-wrap').classList.add('ready');
}

function applyLabels() {
  const G=GT[lang];
  document.getElementById('lbl-back').textContent=G.back;
  document.getElementById('lbl-redo').textContent=G.redo;
  const redoButton=document.getElementById('redo-btn');
  redoButton.title=G.redoTitle;
  redoButton.setAttribute('aria-label',G.redoTitle);
  document.getElementById('lbl-end').textContent=G.end;
  document.getElementById('lbl-reveal').textContent=G.reveal;
  document.getElementById('lbl-done').textContent=G.done;
  document.getElementById('lbl-answer').textContent=G.answer;
  document.getElementById('lbl-award').textContent=G.award;
  document.getElementById('lbl-clear').textContent=G.clear;
  document.getElementById('lbl-again').textContent=G.playAgain;
  document.getElementById('lbl-same-teams').textContent=G.sameTeams;
  document.getElementById('lbl-home').textContent=G.home;
  document.getElementById('loading-error-retry').textContent=G.retry;
  document.getElementById('loading-error-back').textContent=G.backToSetup;
  document.getElementById('btn-oc-correct').textContent=G.correct;
  document.getElementById('btn-oc-wrong').textContent=G.wrong;
}

function buildBoard() {
  const board=document.getElementById('board');
  const cols=gameData.categories.length;
  const rows=gameData.questions[0].length;
  const pts=Array.from({length:rows},(_,i)=>(i+1)*100);
  board.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  board.style.setProperty('--board-cols',String(cols));
  board.innerHTML='';
  gameData.categories.forEach((cat,index)=>{
    const c=document.createElement('div');
    c.className='board-cell cat-cell';c.textContent=cat;
    c.style.setProperty('--cell-i',String(index));
    board.appendChild(c);
  });
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const q=gameData.questions[c][r];
      const cell=document.createElement('button');
      cell.type='button';
      cell.className='board-cell q-cell';
      cell.dataset.col=c;cell.dataset.row=r;cell.dataset.pts=pts[r];
      cell.style.setProperty('--cell-i',String(cols+(r*cols)+c));
      cell.innerHTML=`<div class="cell-pts">${pts[r]}</div>`;
      if(!q){
        cell.classList.add('missing');
        cell.disabled=true;
        cell.setAttribute('aria-disabled','true');
        cell.setAttribute('aria-label',`${gameData.categories[c]}, ${pts[r]} points, unavailable`);
        board.appendChild(cell);
        continue;
      }
      cell.setAttribute('aria-label',`${gameData.categories[c]}, ${pts[r]} points`);
      cell.onclick=()=>openQuestion(c,r,pts[r],cell);
      board.appendChild(cell);
    }
  }
}

function renderScorebar() {
  const left=document.getElementById('scorebar-left');
  const right=document.getElementById('scorebar-right');
  left.innerHTML='';right.innerHTML='';
  const half=Math.ceil(teams.length/2);
  teams.forEach((t,i)=>{
    const c=document.createElement('div');
    c.className='score-chip';c.id=`sc-${i}`;
    c.style.setProperty('--tc',t.color);
    c.innerHTML=`<div class="chip-name">${t.name}</div><div class="chip-score-wrap"><span class="chip-paren">(</span><span class="chip-score" id="sv-${i}" onclick="editScore(${i})" title="Tap to adjust score">0</span><span class="chip-paren">)</span></div>`;
    const score=c.querySelector('.chip-score');
    score.tabIndex=0;
    score.setAttribute('role','button');
    score.setAttribute('aria-label',`Adjust ${t.name} score`);
    score.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();editScore(i);}
    });
    (i<half?left:right).appendChild(c);
  });
}

function renderQuestionCell(cell,pts,used){
  cell.classList.toggle('used',used);
  cell.disabled=used;
  cell.setAttribute('aria-disabled',String(used));
  cell.innerHTML=used
    ? `<div class="cell-pts" style="opacity:.2">${pts}</div><div class="cell-check">✓</div>`
    : `<div class="cell-pts">${pts}</div>`;
}

function updateRedoButton(){
  const button=document.getElementById('redo-btn');
  if(button) button.disabled=!lastClosedQuestion || !!currentCell;
}

function redoLastQuestion(){
  if(!lastClosedQuestion || currentCell) return;
  if(boardCompletionTimer){
    clearTimeout(boardCompletionTimer);
    boardCompletionTimer=null;
  }

  const previous=lastClosedQuestion;
  lastClosedQuestion=null;

  // Revert only the score transaction made by this question. This keeps a
  // genuine redo from awarding the same points twice.
  if(previous.award){
    const {teamIndex,delta}=previous.award;
    applyScore(teamIndex,-delta,`${-delta>0?'+':''}${-delta}`);
  }

  renderQuestionCell(previous.cell,previous.pts,false);
  updateRedoButton();
  openQuestion(previous.col,previous.row,previous.pts,previous.cell);
}

function openQuestion(col,row,pts,cell) {
  if(cell.classList.contains('used')) return;
  const q=gameData.questions[col][row];
  if(!q) return;
  currentCell={col,row,pts,cell};
  currentQuestionAward=null;
  updateRedoButton();
  document.getElementById('modal-cat').textContent=gameData.categories[col].toUpperCase();
  document.getElementById('modal-pts').textContent=pts;
  document.getElementById('modal-question').textContent=q.question;
  document.getElementById('mc-grid').style.display='none';
  document.getElementById('drawing-section').style.display='none';
  document.getElementById('answer-box').classList.remove('shown');
  document.getElementById('award-section').classList.remove('shown');
  document.getElementById('reveal-btn').style.display='';
  document.getElementById('reveal-btn').disabled=false;
  document.getElementById('done-btn').style.display='none';
  document.getElementById('answer-text').textContent=q.answer;
  mcAnswered=null;openOutcome=null;

  if(q.options&&q.options.length) buildMC(q);
  if(q.isDrawing){document.getElementById('drawing-section').style.display='block';setTimeout(initCanvas,60);}

  clearTimerBar();
  if(cfg.timerOn) startTimerBar(cfg.speedOn?15:30);
  document.getElementById('q-modal').classList.add('active');
}

function buildMC(q) {
  const mc=document.getElementById('mc-grid');
  mc.style.display='grid';mc.innerHTML='';
  mcAnswered=null;
  q.options.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='mc-opt';
    b.innerHTML=`<div class="mc-letter">${'ABCD'[i]}</div><span>${opt}</span>`;
    b.onclick=()=>{
      if(mcAnswered) return;
      clearTimerBar();
      mc.querySelectorAll('.mc-opt').forEach(btn=>btn.disabled=true);
      const correct=i===q.correctIndex;
      mcAnswered={selected:i,correct};
      startCountdown(()=>{
        b.classList.add(correct?'correct':'wrong');
        if(!correct){
          b.classList.add('shake');
          mc.querySelectorAll('.mc-opt')[q.correctIndex].classList.add('correct');
        }
        showVerdictFlash(correct);
        revealAnswer();
      });
    };
    mc.appendChild(b);
  });
}

function startCountdown(cb){
  const modal=document.querySelector('.modal');
  const overlay=document.createElement('div');
  overlay.className='countdown-overlay';
  const num=document.createElement('div');
  num.className='countdown-num';
  overlay.appendChild(num);
  modal.appendChild(overlay);
  let count=3;
  function tick(){
    num.textContent=count;
    num.style.animation='none';
    void num.offsetWidth;
    num.style.animation='countPop .82s ease forwards';
    count--;
    if(count>0){setTimeout(tick,820);}
    else{setTimeout(()=>{overlay.remove();cb();},820);}
  }
  tick();
}

function showVerdictFlash(correct){
  const el=document.getElementById('verdict-flash');
  const ico=document.getElementById('verdict-icon');
  el.className='';
  ico.className='verdict-icon '+(correct?'v-correct':'v-wrong');
  ico.textContent=correct?'✓':'✗';
  void el.offsetWidth;
  el.className=correct?'show-correct':'show-wrong';
  setTimeout(()=>{el.className='';},950);
}


function revealAnswer() {
  clearTimerBar();
  document.getElementById('answer-box').classList.add('shown');
  document.getElementById('reveal-btn').style.display='none';
  document.getElementById('done-btn').style.display='';
  buildAwardButtons();
  document.getElementById('award-section').classList.add('shown');
}

function buildAwardButtons(){
  const pts=currentCell?.pts||0;
  const q=gameData.questions[currentCell.col][currentCell.row];
  const isMC=!!(q.options&&q.options.length&&!q.isDrawing);
  const toggle=document.getElementById('outcome-toggle');
  if(isMC){
    toggle.style.display='none';
    openOutcome=mcAnswered?mcAnswered.correct:null;
  } else {
    toggle.style.display='flex';
    openOutcome=null;
    document.getElementById('btn-oc-correct').classList.remove('sel');
    document.getElementById('btn-oc-wrong').classList.remove('sel');
  }
  buildTeamPicker(pts);
}

function setOutcome(correct){
  openOutcome=correct;
  document.getElementById('btn-oc-correct').classList.toggle('sel',correct===true);
  document.getElementById('btn-oc-wrong').classList.toggle('sel',correct===false);
  showVerdictFlash(correct);
  buildTeamPicker(currentCell?.pts||0);
}

function buildTeamPicker(pts){
  const picker=document.getElementById('team-picker');
  picker.innerHTML='';
  const isMC=!!(currentCell&&gameData.questions[currentCell.col][currentCell.row].options?.length);
  const effectiveOutcome=isMC?(mcAnswered?.correct??null):openOutcome;
  teams.forEach((t,i)=>{
    const btn=document.createElement('button');
    btn.className='team-pick-btn';
    btn.style.borderColor=t.color;
    btn.textContent=t.name;
    if(effectiveOutcome===null){btn.disabled=true;}
    btn.onclick=()=>{
      if(effectiveOutcome===null) return;
      const delta=effectiveOutcome?pts:-pts;
      currentQuestionAward={teamIndex:i,delta};
      applyScore(i,delta,(delta>0?'+':'')+delta);
      btn.classList.add('applied');
      picker.querySelectorAll('.team-pick-btn').forEach(b=>{b.disabled=true;});
      setTimeout(()=>closeModal(),500);
    };
    picker.appendChild(btn);
  });
}

function applyScore(idx,delta,label) {
  teams[idx].score+=delta;
  const val=document.getElementById(`sv-${idx}`);
  if(val) val.textContent=teams[idx].score;
  const card=document.getElementById(`sc-${idx}`);
  if(card){
    // Small floating popup
    const pop=document.createElement('div');
    pop.className='score-popup';pop.textContent=label;
    pop.style.color=delta>0?'var(--primary)':'var(--danger)';
    card.appendChild(pop);
    setTimeout(()=>pop.remove(),1600);
    // Big impact burst at chip position
    const rect=card.getBoundingClientRect();
    const burst=document.createElement('div');
    burst.className='score-burst '+(delta>0?'score-burst-gain':'score-burst-lose');
    burst.textContent=delta>0?`💥 ${label}`:`💢 ${label}`;
    burst.style.left=(rect.left+rect.width/2)+'px';
    burst.style.top=(rect.top+rect.height/2)+'px';
    document.body.appendChild(burst);
    setTimeout(()=>burst.remove(),900);
    // Chip animation
    card.classList.remove('bounce-anim','shake-anim','active-team');
    void card.offsetWidth;
    card.classList.add(delta>0?'bounce-anim':'shake-anim');
    setTimeout(()=>card.classList.remove('bounce-anim','shake-anim'),750);
  }
}

function closeModal() {
  clearTimerBar();
  document.getElementById('q-modal').classList.remove('active');
  if(currentCell){
    lastClosedQuestion={...currentCell,award:currentQuestionAward};
    renderQuestionCell(currentCell.cell,currentCell.pts,true);
    currentCell=null;
    currentQuestionAward=null;
  }
  updateRedoButton();
  const playableCells=[...document.querySelectorAll('.q-cell:not(.missing)')];
  if(playableCells.length && playableCells.every(c=>c.classList.contains('used'))){
    if(boardCompletionTimer) clearTimeout(boardCompletionTimer);
    // Leave a brief undo window after the final cell before showing results.
    boardCompletionTimer=setTimeout(()=>{
      boardCompletionTimer=null;
      const remaining=[...document.querySelectorAll('.q-cell:not(.missing)')];
      if(remaining.length && remaining.every(c=>c.classList.contains('used'))) endGame();
    },2500);
  }
}

function startTimerBar(secs) {
  const wrap=document.getElementById('timer-bar-wrap');
  const fill=document.getElementById('timer-fill');
  wrap.style.display='block';
  fill.style.transition='none';fill.style.width='100%';fill.classList.remove('warning');
  let remaining=secs;
  setTimeout(()=>{fill.style.transition=`width ${secs}s linear`;fill.style.width='0%';},50);
  timerInterval=setInterval(()=>{
    remaining--;
    if(remaining<=Math.floor(secs*.3)) fill.classList.add('warning');
    if(remaining<=0){
      clearInterval(timerInterval);timerInterval=null;
      if(!document.getElementById('answer-box').classList.contains('shown')) revealAnswer();
    }
  },1000);
}

function clearTimerBar() {
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  document.getElementById('timer-bar-wrap').style.display='none';
  document.getElementById('timer-fill').style.width='100%';
  document.getElementById('timer-fill').classList.remove('warning');
}

function initCanvas() {
  const canvas=document.getElementById('drawing-canvas');
  canvas.width=canvas.offsetWidth||560;
  drawCtx=canvas.getContext('2d');
  drawCtx.clearRect(0,0,canvas.width,canvas.height);
  drawCtx.strokeStyle=drawColor;drawCtx.lineWidth=3;
  drawCtx.lineCap='round';drawCtx.lineJoin='round';
  canvas.onpointerdown=e=>{
    isDrawing=true;const r=canvas.getBoundingClientRect();
    const sx=canvas.width/r.width,sy=canvas.height/r.height;
    drawCtx.beginPath();drawCtx.moveTo((e.clientX-r.left)*sx,(e.clientY-r.top)*sy);
    canvas.setPointerCapture(e.pointerId);
  };
  canvas.onpointermove=e=>{
    if(!isDrawing) return;const r=canvas.getBoundingClientRect();
    const sx=canvas.width/r.width,sy=canvas.height/r.height;
    drawCtx.lineTo((e.clientX-r.left)*sx,(e.clientY-r.top)*sy);drawCtx.stroke();
  };
  canvas.onpointerup=()=>isDrawing=false;
}

function setDrawColor(btn) {
  drawColor=btn.dataset.color;
  if(drawCtx) drawCtx.strokeStyle=drawColor;
  document.querySelectorAll('.draw-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function clearCanvas() {
  if(drawCtx){const cv=document.getElementById('drawing-canvas');drawCtx.clearRect(0,0,cv.width,cv.height);}
}

function endGame() {
  if(boardCompletionTimer){
    clearTimeout(boardCompletionTimer);
    boardCompletionTimer=null;
  }
  lastClosedQuestion=null;
  updateRedoButton();
  const G=GT[lang];
  const sorted=[...teams].sort((a,b)=>b.score-a.score);
  const winner=sorted[0];
  // Pre-build winner screen content
  document.getElementById('winner-title').textContent=G.winner;
  document.getElementById('winner-name').textContent=winner.name;
  document.getElementById('winner-name').style.color=winner.color;
  document.getElementById('winner-pts').textContent=`${winner.score} ${G.pts}`;
  const fc=document.getElementById('final-cards');fc.innerHTML='';
  const medals=['🥇','🥈','🥉'];
  sorted.forEach((t,i)=>{
    const c=document.createElement('div');c.className='final-card';
    c.style.borderColor=t.color;c.style.color=t.color;
    c.innerHTML=`<div class="final-rank">${medals[i]||'#'+(i+1)}</div>
      <div class="final-name">${t.name}</div><div class="final-score">${t.score}</div>`;
    fc.appendChild(c);
  });
  document.getElementById('game-wrap').style.display='none';
  // 3-second mystery countdown
  const ms=document.getElementById('mystery-screen');
  document.getElementById('myst-label').textContent=G.calculating;
  const cnt=document.getElementById('myst-count');
  cnt.textContent='3';
  ms.classList.add('active');
  setTimeout(()=>{cnt.textContent='2';},1000);
  setTimeout(()=>{cnt.textContent='1';},2000);
  setTimeout(()=>{
    ms.classList.remove('active');
    document.getElementById('winner-screen').classList.add('active');
    document.getElementById('winner-screen').style.display='flex';
    launchConfetti();
  },3000);
}

/* Same Teams → go back to setup with teams pre-filled */
function sameTeams() {
  const existing=localStorage.getItem('jamboo_config');
  if(existing){
    const c=JSON.parse(existing);
    c._keepTeams=true;
    localStorage.setItem('jamboo_config',JSON.stringify(c));
  }
  window.location.href='index.html';
}

function goHome() {
  localStorage.removeItem('jamboo_config');
  window.location.href='index.html';
}

function launchConfetti() {
  const cols=['#00FFCC','#FF00BB','#BF00FF','#F5C518','#00D1FF','#FB923C'];
  for(let i=0;i<80;i++){
    setTimeout(()=>{
      const c=document.createElement('div');c.className='confetti-piece';
      c.style.left=Math.random()*100+'vw';c.style.top='-10px';
      c.style.background=cols[Math.floor(Math.random()*cols.length)];
      c.style.width=c.style.height=(Math.random()*8+5)+'px';
      c.style.animationDuration=(Math.random()*2+1.5)+'s';
      c.style.animationDelay=(Math.random()*.8)+'s';
      document.body.appendChild(c);setTimeout(()=>c.remove(),4000);
    },i*35);
  }
}

document.getElementById('q-modal').addEventListener('click',e=>{
  if(e.target===document.getElementById('q-modal')) closeModal();
});

/* ══════════ SCORE EDIT ══════════ */

function editScore(idx){
  scoreEditIdx=idx;
  const t=teams[idx];
  const nm=document.getElementById('score-edit-name');
  const inp=document.getElementById('score-edit-input');
  nm.textContent=t.name;
  nm.style.color=t.color;
  nm.style.textShadow=`0 0 8px ${t.color}`;
  inp.style.borderColor=t.color;
  inp.value=t.score;
  document.getElementById('score-edit-overlay').classList.add('active');
  setTimeout(()=>{inp.focus();inp.select();},60);
}

function confirmScoreEdit(){
  if(scoreEditIdx===null) return;
  const inp=document.getElementById('score-edit-input');
  const val=parseInt(inp.value,10);
  if(!isNaN(val)){
    const old=teams[scoreEditIdx].score;
    teams[scoreEditIdx].score=val;
    const el=document.getElementById(`sv-${scoreEditIdx}`);
    if(el) el.textContent=val;
    const delta=val-old;
    if(delta!==0){
      // An absolute score edit makes a recorded award unsafe to roll back.
      if(lastClosedQuestion?.award){
        lastClosedQuestion=null;
        updateRedoButton();
      }
      const card=document.getElementById(`sc-${scoreEditIdx}`);
      if(card){
        const pop=document.createElement('div');
        pop.className='score-popup';
        pop.textContent=(delta>0?'+':'')+delta;
        pop.style.color=delta>0?'var(--primary)':'var(--danger)';
        card.appendChild(pop);
        setTimeout(()=>pop.remove(),1600);
      }
    }
  }
  closeScoreEdit();
}

function closeScoreEdit(){
  document.getElementById('score-edit-overlay').classList.remove('active');
  scoreEditIdx=null;
}

document.addEventListener('keydown',function(e){
  if(!document.getElementById('score-edit-overlay').classList.contains('active')) return;
  if(e.key==='Enter') confirmScoreEdit();
  if(e.key==='Escape') closeScoreEdit();
});

boot();

let bz=1;
function zoomBoard(dir){
  bz=Math.max(0.5,Math.min(2,+(bz+dir*0.15).toFixed(2)));
  document.documentElement.style.setProperty('--bz',bz);
  document.getElementById('zoom-lbl').textContent=Math.round(bz*100)+'%';
}
