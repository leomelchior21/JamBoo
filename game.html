<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JamBoo — Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   RETRO / SYNTHWAVE THEME
═══════════════════════════════════════════ */
:root {
  --bz:       1;
  --bg:       #0A0A1F;
  --panel:    #12122A;
  --panel2:   #0D0D22;
  --border:   #BF00FF;
  --primary:  #00FFCC;
  --accent:   #FF00BB;
  --danger:   #FF4444;
  --text:     #FFFFFF;
  --text2:    rgba(255,255,255,.45);
  --gray:     rgba(255,255,255,.05);
  --shadow:   0 0 24px rgba(0,255,204,.18);
  --radius:   4px;
  --fh:       'Fredoka One', cursive;
  --fp:       'Press Start 2P', monospace;
  --fb:       'Nunito', sans-serif;
  --cat-bg:   #0D0D22;
  --cat-color:#00FFCC;
  --cell-bg:  #12122A;
  --cell-hover:#1A1A3A;
  --cell-used:#080818;
  --cell-used-text:rgba(255,255,255,.15);
}

/* ═══════════════════════════════════════════
   RESET + BASE
═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--fb);background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}

/* ═══════════════════════════════════════════
   LOADING
═══════════════════════════════════════════ */
#loading{
  position:fixed;inset:0;z-index:9999;
  display:grid;place-items:center;overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,0,187,.2), transparent 34%),
    radial-gradient(circle at 50% 100%, rgba(0,255,204,.14), transparent 38%),
    linear-gradient(180deg,#040410 0%, #090A1D 50%, #040410 100%);
}
#loading.hidden{display:none;}
#loading::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at center, rgba(0,255,204,.08), transparent 48%),
    repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px);
  opacity:.42;
}
#loading::after{
  content:'';position:absolute;inset:auto 0 0 0;height:34vh;pointer-events:none;
  background:
    linear-gradient(180deg, transparent 0%, rgba(0,0,0,.12) 12%, rgba(0,0,0,.45) 100%),
    linear-gradient(90deg, rgba(0,255,204,.14) 0 2px, transparent 2px 38px),
    linear-gradient(0deg, rgba(0,255,204,.08) 0 2px, transparent 2px 34px);
  mask-image:linear-gradient(180deg, transparent, #000 25%);
  opacity:.35;
}
.loading-shell{
  position:relative;z-index:1;
  width:min(92vw,560px);
  display:flex;flex-direction:column;align-items:stretch;gap:clamp(14px,2vw,20px);
}
.load-logo{
  width:min(70vw,228px);height:auto;
  image-rendering:pixelated;
  filter:drop-shadow(0 0 22px rgba(191,0,255,.75)) drop-shadow(0 0 10px rgba(255,0,187,.38));
  animation:
    logoArrive 1s cubic-bezier(.14,.84,.28,1.08) both,
    logoDrift 7s ease-in-out 1s infinite;
}
@keyframes logoArrive{
  0%{transform:translateY(40px) scale(.72);opacity:0;}
  68%{transform:translateY(-10px) scale(1.04);opacity:1;}
  100%{transform:translateY(0) scale(1);opacity:1;}
}
@keyframes logoDrift{
  0%,100%{transform:translateY(0) rotate(0deg);}
  25%{transform:translateY(-4px) rotate(-.7deg);}
  55%{transform:translateY(2px) rotate(.6deg);}
  80%{transform:translateY(-3px) rotate(-.4deg);}
}
.loading-stage{
  position:relative;
  width:min(100%,440px);height:198px;
  background:
    radial-gradient(circle at 50% 45%, rgba(255,0,187,.16), transparent 32%),
    radial-gradient(circle at 50% 62%, rgba(0,255,204,.12), transparent 38%);
  border:none;
  box-shadow:none;
  overflow:visible;
}
.loading-stage::before{
  content:'';position:absolute;inset:10% 8%;pointer-events:none;
  background:
    radial-gradient(circle at 30% 50%, rgba(255,0,187,.12), transparent 30%),
    radial-gradient(circle at 70% 50%, rgba(0,255,204,.12), transparent 34%);
  filter:blur(24px);
  animation:stageAura 7s ease-in-out infinite alternate;
}
.loading-stage::after{
  content:'';position:absolute;left:8%;right:8%;bottom:26px;height:2px;
  background:linear-gradient(90deg, transparent, rgba(0,255,204,.32), transparent);
  filter:blur(.4px);
  opacity:.8;
}
@keyframes stageAura{
  0%{transform:translateX(-6px) scale(.96);opacity:.7;}
  100%{transform:translateX(6px) scale(1.04);opacity:1;}
}
.loading-scene{
  position:absolute;inset:0;
  display:grid;place-items:center;
  opacity:0;visibility:hidden;
  filter:blur(8px);
  transform:translateY(10px) scale(.96);
  transition:opacity .55s ease, transform .55s ease, filter .55s ease, visibility 0s linear .55s;
}
.loading-scene.is-active{
  opacity:1;visibility:visible;
  filter:blur(0);
  transform:translateY(0) scale(1);
  transition-delay:0s;
}

.relay-system{
  position:relative;width:320px;height:132px;
  animation:relayFloat 6s ease-in-out infinite;
}
.relay-system::before{
  content:'';position:absolute;left:20px;right:18px;top:82px;height:38px;
  background:radial-gradient(circle at center, rgba(0,255,204,.16), transparent 58%);
  filter:blur(18px);opacity:.45;
}
.relay-line,.relay-rise{
  position:absolute;
  background:linear-gradient(90deg, rgba(0,255,204,.2), var(--primary), rgba(0,255,204,.2));
  box-shadow:0 0 12px rgba(0,255,204,.45);
}
.relay-line{height:4px;}
.relay-rise{width:4px;background:linear-gradient(180deg, rgba(255,0,187,.22), var(--accent), rgba(255,0,187,.22));box-shadow:0 0 12px rgba(255,0,187,.4);}
.rl-a{width:92px;left:34px;top:92px;}
.rl-b{width:74px;left:126px;top:56px;}
.rl-c{width:86px;left:200px;top:92px;}
.rl-d{width:70px;left:286px;top:56px;}
.rr-a{height:36px;left:126px;top:56px;}
.rr-b{height:36px;left:200px;top:56px;}
.rr-c{height:36px;left:286px;top:56px;}
.relay-node{
  position:absolute;width:18px;height:18px;
  border:3px solid #000;
  background:var(--node,#FFD700);
  box-shadow:0 0 18px rgba(255,255,255,.2);
  animation:relayNodeGlow 2.8s ease-in-out infinite;
}
.relay-node::after{
  content:'';position:absolute;inset:-8px;
  border:2px solid var(--node,#FFD700);
  opacity:0;animation:nodePing 2.6s linear infinite;
}
.rn-1{left:24px;top:84px;--node:#FFD700;}
.rn-2{left:118px;top:48px;--node:#FF00BB;}
.rn-3{left:192px;top:84px;--node:#00FFCC;}
.rn-4{left:278px;top:48px;--node:#BF00FF;}
.rn-5{left:344px;top:84px;--node:#00D1FF;}
.rn-2::after{animation-delay:.35s;}
.rn-3::after{animation-delay:.7s;}
.rn-4::after{animation-delay:1.05s;}
.rn-5::after{animation-delay:1.4s;}
.rn-2{animation-delay:.2s;}
.rn-3{animation-delay:.4s;}
.rn-4{animation-delay:.6s;}
.rn-5{animation-delay:.8s;}
.relay-packet{
  position:absolute;left:0;top:0;
  width:14px;height:14px;
  border:2px solid #000;
  background:#fff;
  box-shadow:0 0 16px rgba(255,255,255,.9), 0 0 28px rgba(255,0,187,.22);
  animation:relayPacket 3.3s cubic-bezier(.32,0,.18,1) infinite;
}
.relay-packet::after{
  content:'';position:absolute;inset:-7px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%);
  animation:packetGlow 1.1s ease-in-out infinite;
}
@keyframes packetGlow{0%,100%{opacity:.5;transform:scale(.85);}50%{opacity:.95;transform:scale(1.1);}}
@keyframes relayPacket{
  0%{transform:translate(28px,86px) scale(.75);opacity:0;}
  8%{transform:translate(44px,86px) scale(1);opacity:1;}
  22%{transform:translate(118px,86px) scale(1);}
  28%{transform:translate(118px,50px) scale(1.08);}
  42%{transform:translate(192px,50px) scale(1);}
  50%{transform:translate(192px,86px) scale(1.08);}
  68%{transform:translate(278px,86px) scale(1);}
  76%{transform:translate(278px,50px) scale(1.08);}
  92%{transform:translate(344px,50px) scale(.96);}
  100%{transform:translate(344px,86px) scale(.72);opacity:.28;}
}
@keyframes nodePing{
  0%,18%,100%{transform:scale(.65);opacity:0;}
  8%{transform:scale(1.05);opacity:.65;}
}
@keyframes relayNodeGlow{
  0%,100%{transform:scale(1);filter:brightness(1);}
  50%{transform:scale(1.08);filter:brightness(1.2);}
}
@keyframes relayFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-5px);}
}

.cradle-wrap{
  position:relative;width:300px;height:142px;
  animation:cradleFloat 4.8s ease-in-out infinite;
}
.cradle-frame{
  position:absolute;left:44px;right:44px;top:24px;bottom:24px;
}
.cradle-frame::before,
.cradle-frame::after{
  content:'';position:absolute;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg, rgba(0,255,204,.52), rgba(255,0,187,.22));
  box-shadow:0 0 12px rgba(0,255,204,.18);
}
.cradle-frame::before{left:0;}
.cradle-frame::after{right:0;}
.cradle-wrap::before{
  content:'';position:absolute;left:118px;right:118px;top:96px;height:8px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  filter:blur(2px);
  opacity:0;
  animation:cradleCollision 1.9s linear infinite;
}
.cradle-wrap::after{
  content:'';position:absolute;left:60px;right:60px;bottom:8px;height:18px;
  background:radial-gradient(circle at center, rgba(0,255,204,.18), transparent 64%);
  filter:blur(10px);opacity:.5;
}
.cradle-base{
  position:absolute;left:44px;right:44px;bottom:18px;height:8px;
  background:linear-gradient(90deg, rgba(255,0,187,.4), rgba(0,255,204,.55), rgba(255,0,187,.4));
  box-shadow:0 0 16px rgba(0,255,204,.18);
}
.cradle-bar{
  position:absolute;top:22px;left:44px;right:44px;height:5px;
  background:linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
  box-shadow:0 0 10px rgba(0,255,204,.35);
}
.c-arm{
  position:absolute;top:27px;width:3px;height:74px;
  background:rgba(255,255,255,.22);
  transform-origin:top center;
}
.c-arm::after{
  content:'';position:absolute;bottom:-20px;left:50%;
  transform:translateX(-50%);
  width:22px;height:22px;
  border:2px solid #000;
  background:var(--bc,#FFD700);
  box-shadow:0 0 12px rgba(255,255,255,.18);
}
.ca-1{left:74px; --bc:#FF00BB; animation:pendulumLeft 1.9s linear infinite;}
.ca-2{left:112px;--bc:#BF00FF;}
.ca-3{left:150px;--bc:#00FFCC;}
.ca-4{left:188px;--bc:#FFD700;}
.ca-5{left:226px;--bc:#00D1FF;animation:pendulumRight 1.9s linear infinite;}
@keyframes pendulumLeft{
  0%{transform:rotate(-30deg);animation-timing-function:ease-in;}
  24%{transform:rotate(0deg);animation-timing-function:linear;}
  76%{transform:rotate(0deg);animation-timing-function:ease-out;}
  100%{transform:rotate(-30deg);}
}
@keyframes pendulumRight{
  0%{transform:rotate(0deg);animation-timing-function:linear;}
  24%{transform:rotate(0deg);animation-timing-function:ease-out;}
  50%{transform:rotate(30deg);animation-timing-function:ease-in;}
  76%{transform:rotate(0deg);animation-timing-function:linear;}
  100%{transform:rotate(0deg);}
}
@keyframes cradleCollision{
  0%,21%,29%,71%,79%,100%{opacity:0;transform:scaleX(.6);}
  24%,76%{opacity:.85;transform:scaleX(1);}
}
@keyframes cradleFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-4px);}
}

.orbit-system{
  position:relative;width:220px;height:220px;
  animation:orbitFloat 7s ease-in-out infinite;
}
.orbit-system::before{
  content:'';position:absolute;inset:34px;
  background:radial-gradient(circle at center, rgba(255,0,187,.18), transparent 62%);
  filter:blur(24px);opacity:.7;
}
.orbit-ring{
  position:absolute;top:50%;left:50%;
  width:var(--size);height:var(--size);
  transform:translate(-50%,-50%) rotate(var(--tilt)) scaleY(var(--squash));
  border:2px solid rgba(255,255,255,.08);
  border-top-color:var(--orbit);
  border-left-color:var(--orbit);
  border-radius:50%;
  animation:orbitSpin var(--dur) linear infinite;
}
.orbit-ring.reverse{animation-direction:reverse;}
.ring-a{--size:72px; --orbit:#FF00BB; --dur:2.1s; --tilt:-18deg; --squash:.8;}
.ring-b{--size:116px;--orbit:#BF00FF; --dur:2.9s; --tilt:16deg; --squash:.68;}
.ring-c{--size:164px;--orbit:#00FFCC; --dur:3.8s; --tilt:0deg; --squash:.9;}
.orbit-satellite{
  position:absolute;left:50%;top:-9px;
  width:16px;height:16px;
  transform:translateX(-50%);
  border:2px solid #000;
  border-radius:50%;
  background:var(--orbit);
  box-shadow:0 0 14px rgba(255,255,255,.22);
}
.orbit-core{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:28px;height:28px;
  border:3px solid #000;
  background:#FFD700;
  box-shadow:0 0 16px rgba(255,215,0,.55), 0 0 34px rgba(255,215,0,.25);
  animation:corePulse 1.15s ease-in-out infinite;
}
.orbit-core::after{
  content:'';position:absolute;inset:-12px;
  border:2px solid rgba(255,215,0,.45);
  border-radius:50%;
  animation:coreEcho 1.8s ease-out infinite;
}
@keyframes orbitSpin{
  from{transform:translate(-50%,-50%) rotate(var(--tilt)) scaleY(var(--squash)) rotate(0deg);}
  to{transform:translate(-50%,-50%) rotate(var(--tilt)) scaleY(var(--squash)) rotate(360deg);}
}
@keyframes corePulse{
  0%,100%{transform:translate(-50%,-50%) scale(.94);}
  50%{transform:translate(-50%,-50%) scale(1.14);}
}
@keyframes coreEcho{
  0%{transform:scale(.72);opacity:.6;}
  100%{transform:scale(1.3);opacity:0;}
}
@keyframes orbitFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}

.load-bar-wrap{
  width:min(100%,340px);height:8px;
  padding:0;background:rgba(255,255,255,.08);
  border:1px solid rgba(0,255,204,.24);
  box-shadow:inset 0 0 8px rgba(0,0,0,.7),0 0 12px rgba(0,255,204,.12);
  overflow:hidden;
}
.load-bar{
  position:relative;width:var(--load-progress,0%);height:100%;
  background:linear-gradient(90deg, rgba(0,255,204,.15), rgba(0,255,204,.95), rgba(255,0,187,.85));
  box-shadow:0 0 18px rgba(0,255,204,.42);
  transition:width .3s linear;
}
.load-bar::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 0 38%,rgba(255,255,255,.7) 50%,transparent 62% 100%);
  animation:loadSignal 1.8s linear infinite;
}
@keyframes loadSignal{
  from{transform:translateX(-130%);}
  to{transform:translateX(130%);}
}
.load-text{
  font-family:var(--fp);font-size:7px;
  color:rgba(255,255,255,.72);
  letter-spacing:3px;text-transform:uppercase;text-align:center;
  text-shadow:0 0 10px rgba(0,255,204,.25);
  animation:loadTextPulse 2.8s ease-in-out infinite;
}
@keyframes loadTextPulse{
  0%,100%{opacity:.7;letter-spacing:3px;}
  50%{opacity:1;letter-spacing:4px;}
}
.generation-console{
  position:relative;width:min(100%,520px);padding:14px 16px 13px;
  overflow:hidden;
  background:linear-gradient(180deg,rgba(9,10,31,.92),rgba(4,4,16,.96));
  border:1px solid rgba(0,255,204,.25);
  box-shadow:4px 4px 0 rgba(0,0,0,.7),0 0 22px rgba(0,255,204,.08);
}
.generation-console::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(0,255,204,.055),transparent);
  transform:translateY(-100%);animation:consoleScan 4s linear infinite;
}
@keyframes consoleScan{to{transform:translateY(100%);}}
.generation-console-head{
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-bottom:11px;border-bottom:1px solid rgba(255,255,255,.1);
  font-family:var(--fp);font-size:6px;letter-spacing:1.4px;text-transform:uppercase;
}
.generation-console-title{color:var(--primary);}
.generation-console-title::before{
  content:'';display:inline-block;width:6px;height:6px;margin-right:7px;
  background:var(--primary);box-shadow:0 0 8px var(--primary);
  animation:statusBlink 1.2s steps(2,end) infinite;
}
@keyframes statusBlink{50%{opacity:.25;}}
.generation-elapsed{color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;}
.generation-steps{
  position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  gap:4px;margin-top:14px;
}
.generation-step{position:relative;min-width:0;text-align:center;color:rgba(255,255,255,.28);}
.generation-step::after{
  content:'';position:absolute;z-index:0;top:9px;left:calc(50% + 11px);
  width:calc(100% - 18px);height:2px;background:rgba(255,255,255,.1);
  transition:background .4s,box-shadow .4s;
}
.generation-step:last-child::after{display:none;}
.generation-step.is-complete::after{
  background:var(--primary);box-shadow:0 0 7px rgba(0,255,204,.7);
}
.generation-node{
  position:relative;z-index:1;width:20px;height:20px;margin:0 auto 8px;
  display:grid;place-items:center;
  border:2px solid rgba(255,255,255,.18);background:#09091c;
  font-family:var(--fp);font-size:5px;transition:all .35s;
}
.generation-step.is-active{color:#fff;}
.generation-step.is-active .generation-node{
  color:#03030c;border-color:var(--accent);background:var(--accent);
  box-shadow:0 0 0 4px rgba(255,0,187,.1),0 0 16px rgba(255,0,187,.65);
  animation:activeNode 1.2s ease-in-out infinite;
}
.generation-step.is-complete{color:rgba(0,255,204,.72);}
.generation-step.is-complete .generation-node{
  color:#031510;border-color:var(--primary);background:var(--primary);
  box-shadow:0 0 9px rgba(0,255,204,.45);
}
.generation-step.is-complete .generation-node span{display:none;}
.generation-step.is-complete .generation-node::before{content:'\2713';font-family:var(--fb);font-size:12px;font-weight:900;}
@keyframes activeNode{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-2px);filter:brightness(1.25);}
}
.generation-step-label{
  display:block;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--fp);font-size:5px;line-height:1.45;letter-spacing:.25px;text-transform:uppercase;
}
.generation-detail{
  position:relative;min-height:15px;margin-top:13px;
  color:rgba(255,255,255,.62);font-family:var(--fp);font-size:5px;line-height:1.7;
  letter-spacing:.45px;text-align:left;text-transform:uppercase;
}
.generation-detail::before{content:'>';color:var(--accent);margin-right:8px;}
.generation-detail::after{content:'_';color:var(--primary);margin-left:4px;animation:statusBlink .85s steps(2,end) infinite;}
.loading-error-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.loading-error-actions[hidden]{display:none;}
.loading-error-back{
  padding:10px 16px;
  border:3px solid var(--accent);
  background:#111126;color:#fff;
  font-family:var(--fp);font-size:7px;text-decoration:none;text-transform:uppercase;
  box-shadow:4px 4px 0 #000,0 0 14px rgba(255,0,187,.28);
}
.loading-error-back:hover{filter:brightness(1.2);}
#loading.has-error .loading-stage{opacity:.32;}
#loading.has-error .load-bar-wrap{display:none;}
#loading.has-error .load-text{color:#ff8fcf;animation:none;line-height:1.8;}
#loading.has-error .generation-console{opacity:.38;filter:saturate(.5);}

/* ═══════════════════════════════════════════
   GAME WRAPPER
═══════════════════════════════════════════ */
#game-wrap{display:none;}
#game-wrap.ready{display:block;}

/* ═══════════════════════════════════════════
   HEADER  (centered logo popping out, teams on both sides)
═══════════════════════════════════════════ */
.ghdr{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;
  padding:7px clamp(10px,2vw,22px);
  min-height:88px;
  background:linear-gradient(100deg,rgba(35,5,52,.97),rgba(180,0,115,.92) 48%,rgba(45,4,65,.97));
  border-bottom:2px solid rgba(0,255,204,.45);
  box-shadow:0 2px 0 #000,0 10px 32px rgba(0,0,0,.48),0 0 28px rgba(255,0,187,.2);
  backdrop-filter:blur(16px) saturate(1.4);
  overflow:visible;
}

/* pixel scanline on header */
.ghdr::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,rgba(0,0,0,.07) 0px,rgba(0,0,0,.07) 1px,
    transparent 1px,transparent 3px
  );
}

/* big neon logo centered over the header, floating above and below it */
.ghdr-brand{
  position:absolute;left:50%;top:calc(50% + 42px);
  transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;
  z-index:103;text-decoration:none;pointer-events:auto;
}
.ghdr-brand::after{
  content:'';position:absolute;inset:8% 14%;z-index:-1;
  background:radial-gradient(circle,rgba(255,0,187,.4),transparent 68%);
  filter:blur(20px);opacity:.75;
  transition:opacity .2s ease,transform .2s ease;
}
.ghdr-brand:hover::after{opacity:1;transform:scale(1.08);}
.ghdr-logo{
  height:clamp(104px,12vw,156px);width:auto;display:block;cursor:pointer;
  image-rendering:pixelated;
  animation:logoHeaderFloat 5s ease-in-out infinite,logoNeon 2.8s ease-in-out infinite;
}
@keyframes logoHeaderFloat{
  0%,100%{transform:translateY(0) rotate(-.6deg);}
  50%    {transform:translateY(-7px) rotate(.6deg);}
}
@keyframes logoNeon{
  0%,100%{filter:drop-shadow(0 8px 18px rgba(0,0,0,.85)) drop-shadow(0 0 12px rgba(191,0,255,.6)) drop-shadow(0 0 26px rgba(0,255,204,.22));}
  50%    {filter:drop-shadow(0 8px 18px rgba(0,0,0,.85)) drop-shadow(0 0 20px rgba(255,0,187,.85)) drop-shadow(0 0 42px rgba(0,255,204,.4));}
}
.ghdr-brand:focus-visible{outline:3px solid #FFD700;outline-offset:3px;}

/* ── RETRO PIXEL NAV BUTTONS ── */
.ghdr-btn{
  display:flex;align-items:center;gap:5px;
  padding:6px 10px;
  background:#0A0A1E;
  border:3px solid #2A1166;
  box-shadow:3px 3px 0 #000;
  color:rgba(255,255,255,.6);
  font-family:var(--fp);font-size:7px;
  cursor:pointer;text-decoration:none;
  text-transform:uppercase;letter-spacing:1px;
  transition:all .07s;
  white-space:nowrap;
  position:relative;z-index:102;
}
.ghdr-btn:hover{
  border-color:var(--primary);color:var(--primary);
  box-shadow:3px 3px 0 #000,0 0 8px rgba(0,255,204,.25);
  transform:translate(-1px,-1px);
}
.ghdr-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000;}
.ghdr-btn:disabled{
  opacity:.32;cursor:not-allowed;transform:none;
  border-color:#2A1166;color:rgba(255,255,255,.45);
  box-shadow:2px 2px 0 #000;
}
.ghdr-btn-redo{border-color:#075B59;}
.ghdr-btn-end{border-color:#550022;}
.ghdr-btn-end:hover{border-color:var(--danger);color:var(--danger);box-shadow:3px 3px 0 #000,0 0 8px rgba(255,68,68,.25);}

/* ═══════════════════════════════════════════
   SCOREBOARD  (teams split on both sides of the centered logo)
═══════════════════════════════════════════ */
.scorebar{
  display:flex;align-items:center;gap:clamp(6px,1vw,12px);flex:1;min-width:0;
  position:relative;z-index:102;
}
.scorebar-left,.scorebar-right{
  display:flex;align-items:center;gap:7px;flex:1;min-width:0;
  overflow-x:auto;overflow-y:visible;padding:4px 2px;
  scrollbar-width:none;
}
.scorebar-left{justify-content:flex-end;}
.scorebar-right{justify-content:flex-start;}
.scorebar-left::-webkit-scrollbar,.scorebar-right::-webkit-scrollbar{display:none;}
.logo-spacer{width:clamp(128px,16vw,196px);flex:none;}

/* ── SCORE CHIP: horizontal "NAME (SCORE)" pill ── */
.score-chip{
  display:flex;align-items:center;gap:0;
  background:#070718;
  border:2px solid rgba(255,255,255,.08);
  border-left:4px solid var(--tc,#00FFCC);
  box-shadow:3px 3px 0 #000;
  position:relative;overflow:visible;flex-shrink:0;
  transition:border-color .2s,box-shadow .2s;
}
/* top glow line */
.score-chip::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:var(--tc,#00FFCC);opacity:.55;
  box-shadow:0 0 6px var(--tc,#00FFCC);
}
.score-chip.active-team{animation:scoreFlash .4s steps(4);}
@keyframes scoreFlash{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.07);box-shadow:3px 3px 0 #000,0 0 14px var(--tc,#00FFCC);}
}
/* team name — Nunito for legibility */
.chip-name{
  font-family:var(--fb);font-weight:900;font-size:12px;
  text-transform:uppercase;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88px;
  color:var(--tc,#00FFCC);text-shadow:0 0 6px var(--tc,#00FFCC);
  padding:6px 4px 6px 9px;
}
/* (score) section */
.chip-score-wrap{
  display:flex;align-items:center;gap:1px;
  padding:6px 9px 6px 4px;
}
.chip-paren{
  font-family:var(--fp);font-size:8px;
  color:rgba(255,255,255,.3);line-height:1;
}
.chip-score{
  font-family:var(--fp);font-size:14px;line-height:1;
  color:#fff;text-shadow:2px 2px 0 #000;
  cursor:pointer;transition:color .12s,text-shadow .12s;
}
.chip-score:hover{color:var(--primary);text-shadow:0 0 10px var(--primary);}
.score-popup{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  font-family:var(--fp);font-size:9px;font-weight:900;
  animation:popUp 1.4s ease forwards;pointer-events:none;white-space:nowrap;
}
@keyframes popUp{0%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-28px)}}

/* ── SCORE IMPACT ANIMATIONS ── */
.score-burst{
  position:fixed;font-family:var(--fp);
  font-size:clamp(20px,4vw,36px);line-height:1.2;
  pointer-events:none;z-index:9100;white-space:nowrap;text-align:center;
}
.score-burst-gain{
  color:#00FFCC;text-shadow:0 0 16px #00FFCC,3px 3px 0 #000;
  animation:burstGain .85s cubic-bezier(.15,.9,.3,1) forwards;
}
.score-burst-lose{
  color:#FF4444;text-shadow:0 0 16px #FF4444,3px 3px 0 #000;
  animation:burstLose .85s cubic-bezier(.15,.9,.3,1) forwards;
}
@keyframes burstGain{
  0%  {opacity:1;transform:translate(-50%,-50%) scale(.15) rotate(-12deg);}
  45% {opacity:1;transform:translate(-50%,-70%) scale(1.2) rotate(6deg);}
  70% {opacity:.9;transform:translate(-50%,-80%) scale(1.1) rotate(-2deg);}
  100%{opacity:0;transform:translate(-50%,-110%) scale(1.3) rotate(0deg);}
}
@keyframes burstLose{
  0%  {opacity:0;transform:translate(-50%,-130%) scale(1.5);}
  28% {opacity:1;transform:translate(-50%,-50%) scale(.8);}
  55% {opacity:1;transform:translate(-50%,-50%) scale(1.05);}
  80% {opacity:.7;transform:translate(-50%,-50%) scale(.95);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.9);}
}
.score-chip.bounce-anim{animation:chipBounce .7s ease-out forwards !important;}
.score-chip.shake-anim {animation:chipShake  .6s ease-out forwards !important;}
@keyframes chipBounce{
  0%  {transform:translateY(0) scale(1);}
  18% {transform:translateY(-14px) scale(1.12);}
  38% {transform:translateY(3px) scale(.95);}
  55% {transform:translateY(-6px) scale(1.05);}
  72% {transform:translateY(1px) scale(.99);}
  100%{transform:translateY(0) scale(1);}
}
@keyframes chipShake{
  0%,100%{transform:translateX(0) scale(1);}
  8%  {transform:translateX(-9px) scale(.96);}
  18% {transform:translateX(9px)  scale(.96);}
  28% {transform:translateX(-7px);}
  38% {transform:translateX(7px);}
  48% {transform:translateX(-5px);}
  58% {transform:translateX(5px);}
  68% {transform:translateX(-3px);}
  80% {transform:translateX(3px);}
}

/* ═══════════════════════════════════════════
   BOTTOM BANNER  (nav + zoom controls)
═══════════════════════════════════════════ */
.gbottom{
  position:fixed;left:0;right:0;bottom:0;z-index:140;
  display:flex;align-items:center;justify-content:center;
  gap:clamp(6px,1.4vw,14px);flex-wrap:nowrap;
  padding:6px clamp(10px,2vw,22px) calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(58,14,102,.96),rgba(20,7,54,.99));
  border-top:2px solid #00FFCC;
  box-shadow:0 -2px 0 #000,0 -10px 34px rgba(0,0,0,.45),0 0 24px rgba(0,255,204,.4),0 0 54px rgba(255,0,187,.22);
  backdrop-filter:blur(14px) saturate(1.5);
  overflow-x:auto;scrollbar-width:none;
}
.gbottom::-webkit-scrollbar{display:none;}
.gbottom>*{flex:0 0 auto;}
.gbottom .ghdr-btn{
  min-height:37px;padding:5px 10px;
  background:linear-gradient(180deg,rgba(48,18,86,.96),rgba(22,9,52,.96));
  border-color:rgba(0,255,204,.55);
  color:rgba(255,255,255,.92);
  box-shadow:3px 3px 0 #000,0 0 10px rgba(0,255,204,.16);
}
.gbottom .ghdr-btn:hover{
  border-color:#00FFCC;color:#00FFCC;
  box-shadow:3px 3px 0 #000,0 0 14px rgba(0,255,204,.45);
}
.gbottom .ghdr-btn-end{border-color:rgba(255,0,187,.65);}
.gbottom .ghdr-btn-end:hover{border-color:#FF2D95;color:#FF2D95;box-shadow:3px 3px 0 #000,0 0 14px rgba(255,0,187,.5);}
.zoom-group{
  display:flex;align-items:center;gap:3px;
  padding:2px 5px;background:linear-gradient(180deg,rgba(20,34,64,.96),rgba(10,16,40,.96));
  border:2px solid rgba(0,255,204,.45);box-shadow:3px 3px 0 #000,0 0 10px rgba(0,255,204,.16);
}
.zoom-btn{
  width:30px;height:30px;
  background:rgba(16,26,54,.95);border:2px solid rgba(0,255,204,.35);
  border-radius:var(--radius);
  color:#dff;font-size:16px;font-weight:bold;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .12s,background .12s,transform .12s,color .12s;line-height:1;
}
.zoom-btn:hover{border-color:var(--primary);background:rgba(0,255,204,.14);color:#00FFCC;transform:translateY(-1px);}
.zoom-btn:active{transform:translateY(1px);}
.zoom-lbl{font-family:var(--fp);font-size:8px;color:rgba(255,255,255,.9);min-width:42px;text-align:center;letter-spacing:.5px;text-shadow:0 0 8px rgba(0,255,204,.4);}

/* ═══════════════════════════════════════════
   BOARD
═══════════════════════════════════════════ */
.board-wrap{padding:16px;overflow-x:auto;}
.board{display:grid;gap:8px;min-width:400px;}
.board-cell{
  border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:10px 8px;
  font-family:var(--fh);
  transition:all .15s;position:relative;overflow:hidden;
}
.cat-cell{
  background:var(--cat-bg);border:2px solid var(--border);
  color:var(--cat-color);
  font-size:calc(clamp(12px,1.8vw,16px) * var(--bz));
  min-height:calc(60px * var(--bz));
  letter-spacing:.3px;line-height:1.2;text-transform:uppercase;
}
.q-cell{
  background:var(--cell-bg);border:2px solid var(--border);
  cursor:pointer;min-height:calc(72px * var(--bz));flex-direction:column;gap:4px;
}
.q-cell:hover:not(.used){
  background:var(--cell-hover);border-color:var(--primary);
  transform:translateY(-2px);box-shadow:0 0 14px rgba(0,255,204,.25);
}
.q-cell.used{
  background:var(--cell-used);border-color:rgba(255,255,255,.06);
  cursor:default;transform:none;box-shadow:none;
}
.q-cell.missing{
  background:var(--cell-used);border-color:rgba(255,255,255,.04);
  cursor:not-allowed;opacity:.45;transform:none;box-shadow:none;
}
.q-cell.missing:hover{background:var(--cell-used);border-color:rgba(255,255,255,.04);transform:none;box-shadow:none;}
.cell-pts{font-size:calc(clamp(18px,3vw,28px) * var(--bz));color:var(--accent);line-height:1;}
.q-cell.used .cell-pts{color:var(--cell-used-text);}
.cell-check{font-size:calc(18px * var(--bz));opacity:.4;}

/* ═══════════════════════════════════════════
   MODAL
═══════════════════════════════════════════ */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.8);z-index:500;
  align-items:center;justify-content:center;padding:16px;
}
.modal-overlay.active{display:flex;}
.modal{
  background:var(--panel2);
  border:3px solid var(--border);
  border-radius:var(--radius);
  width:100%;max-width:640px;max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow);position:relative;
  animation:modalIn .2s ease;
}
@keyframes modalIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{
  background:var(--panel);border-bottom:2px solid var(--border);
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.modal-cat{font-family:var(--fh);font-size:13px;color:var(--primary);letter-spacing:1px;text-transform:uppercase;}
.modal-pts{font-family:var(--fh);font-size:24px;color:var(--accent);line-height:1;}
.modal-close{
  width:32px;height:32px;border-radius:50%;
  background:var(--gray);border:2px solid rgba(255,255,255,.15);
  color:var(--text2);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .12s;flex-shrink:0;
}
.modal-close:hover{border-color:var(--danger);color:var(--danger);}
.modal-body{padding:18px;}
.q-text{font-size:clamp(16px,2.5vw,22px);font-weight:800;line-height:1.45;margin-bottom:16px;text-align:center;}

/* Timer */
.modal-timer-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-bottom:14px;overflow:hidden;}
.modal-timer-fill{height:100%;background:var(--primary);transition:width 1s linear;width:100%;}
.modal-timer-fill.warning{background:var(--danger);}

/* MC */
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.mc-opt{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:var(--gray);border:2px solid rgba(255,255,255,.12);border-radius:var(--radius);
  color:var(--text);font-family:var(--fb);font-weight:800;font-size:13px;
  cursor:pointer;text-align:left;transition:all .12s;
}
.mc-opt:hover:not(:disabled){border-color:var(--primary);background:rgba(0,255,204,.06);}
.mc-letter{
  width:26px;height:26px;border-radius:50%;
  background:var(--border);color:var(--bg);
  font-family:var(--fh);font-size:14px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.mc-opt.correct{background:rgba(0,255,204,.15);border-color:var(--primary) !important;}
.mc-opt.correct .mc-letter{background:var(--primary);color:#000;}
.mc-opt.wrong{background:rgba(255,68,68,.15);border-color:var(--danger) !important;}
.mc-opt.wrong .mc-letter{background:var(--danger);color:#fff;}
.mc-opt:disabled{cursor:default;}

/* Drawing */
.drawing-section{margin-bottom:14px;}
.canvas-wrap{background:rgba(255,255,255,.97);border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:crosshair;}
.drawing-canvas{display:block;width:100%;touch-action:none;}
.draw-tools{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;align-items:center;}
.draw-btn{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:border-color .12s;flex-shrink:0;}
.draw-btn.active{border-color:var(--text);}
.draw-clear{
  padding:5px 12px;background:var(--gray);
  border:2px solid rgba(255,255,255,.15);border-radius:var(--radius);
  color:var(--text);font-family:var(--fb);font-weight:800;font-size:12px;
  cursor:pointer;margin-left:auto;
}

/* Answer box */
.answer-box{
  background:rgba(0,255,204,.07);border:2px solid var(--primary);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:12px;display:none;
}
.answer-box.shown{display:block;}
.answer-label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--primary);margin-bottom:4px;}
.answer-text{font-size:16px;font-weight:800;line-height:1.4;}

/* Award */
.award-section{display:none;}
.award-section.shown{display:block;}
.award-title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:6px;}
.award-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-bottom:8px;}
.award-btn{
  padding:8px 10px;border-radius:var(--radius);
  background:var(--gray);border:2px solid;
  font-family:var(--fb);font-weight:800;font-size:12px;
  cursor:pointer;transition:all .12s;text-align:center;
}
.award-btn:hover{filter:brightness(1.2);}

/* Action buttons */
.action-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn-reveal{
  flex:1;padding:12px;
  background:var(--primary);border:3px solid rgba(0,0,0,.2);border-radius:var(--radius);
  color:var(--bg);font-family:var(--fh);font-size:16px;
  cursor:pointer;transition:all .12s;box-shadow:0 0 14px rgba(0,255,204,.25);
}
.btn-reveal:hover{filter:brightness(1.1);}
.btn-done{
  padding:12px 20px;
  background:var(--gray);border:2px solid rgba(255,255,255,.15);border-radius:var(--radius);
  color:var(--text);font-family:var(--fh);font-size:15px;
  cursor:pointer;transition:all .12s;display:none;
}
.btn-done:hover{border-color:var(--text);}

/* ═══════════════════════════════════════════
   WINNER SCREEN
═══════════════════════════════════════════ */
#winner-screen{display:none;min-height:100vh;}
#winner-screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;}
.winner-title{font-family:var(--fp);font-size:clamp(14px,4vw,28px);color:var(--primary);text-align:center;margin-bottom:6px;text-shadow:0 0 20px rgba(0,255,204,.5),3px 3px 0 #000;}
.winner-subtitle{font-family:var(--fp);font-size:clamp(10px,2.5vw,18px);text-align:center;margin-bottom:8px;}
.winner-pts{font-size:18px;font-weight:800;color:var(--text2);text-align:center;margin-bottom:28px;}
.final-cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:32px;}
.final-card{
  background:var(--panel);
  border:3px solid;
  box-shadow:4px 4px 0 #000;
  padding:18px 22px;text-align:center;min-width:120px;
}
.final-rank{font-size:28px;margin-bottom:4px;}
.final-name{font-family:var(--fp);font-size:9px;margin-bottom:6px;}
.final-score{font-family:var(--fp);font-size:14px;}

/* 3 winner buttons */
.winner-actions{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  width:100%;max-width:360px;
}
.btn-winner{
  width:100%;padding:14px 24px;
  font-family:var(--fp);font-size:9px;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;
  transition:all .08s;text-align:center;
}
.btn-winner-primary{
  background:var(--primary);
  border:4px solid #00CCAA;border-bottom:4px solid #007755;
  box-shadow:4px 4px 0 #000,0 0 18px rgba(0,255,204,.3);
  color:#000;
}
.btn-winner-primary:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000,0 0 24px rgba(0,255,204,.5);}
.btn-winner-secondary{
  background:#1A0A3A;
  border:4px solid #5500BB;border-bottom:4px solid #220055;
  box-shadow:4px 4px 0 #000;
  color:var(--primary);
}
.btn-winner-secondary:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000,0 0 14px rgba(0,255,204,.2);}
.btn-winner-ghost{
  background:transparent;
  border:3px solid rgba(255,255,255,.2);
  box-shadow:3px 3px 0 #000;
  color:var(--text2);
}
.btn-winner-ghost:hover{border-color:rgba(255,255,255,.5);color:#fff;transform:translate(-1px,-1px);}
.btn-winner:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000 !important;}

/* ═══════════════════════════════════════════
   MYSTERY SCREEN
═══════════════════════════════════════════ */
#mystery-screen{
  display:none;position:fixed;inset:0;background:var(--bg);
  z-index:950;flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
#mystery-screen.active{display:flex;}
.myst-q{
  font-family:var(--fp);font-size:clamp(80px,20vw,140px);line-height:1;
  color:var(--accent);text-shadow:0 0 40px rgba(255,0,187,.7),4px 4px 0 #000;
  animation:mystQ .5s steps(2) infinite;
}
@keyframes mystQ{
  0%,100%{color:var(--accent);transform:scale(1);}
  50%{color:var(--primary);transform:scale(1.1);}
}
.myst-label{
  font-family:var(--fp);font-size:9px;letter-spacing:4px;color:var(--text2);
  animation:mystBlink .7s steps(1) infinite;
}
@keyframes mystBlink{0%,100%{opacity:1;}50%{opacity:0;}}
.myst-count{
  font-family:var(--fp);font-size:clamp(50px,12vw,90px);line-height:1;
  color:var(--primary);text-shadow:0 0 30px rgba(0,255,204,.6),3px 3px 0 #000;
}

/* Confetti */
.confetti-piece{
  position:fixed;border-radius:2px;pointer-events:none;z-index:9998;
  animation:fall linear forwards;
}
@keyframes fall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0;}
}

/* Verdict flash */
#verdict-flash{
  position:fixed;inset:0;z-index:8000;pointer-events:none;
  display:flex;align-items:center;justify-content:center;opacity:0;
}
#verdict-flash.show-correct{animation:vFlashC .9s ease forwards;}
#verdict-flash.show-wrong{animation:vFlashW .9s ease forwards;}
@keyframes vFlashC{0%{opacity:0;background:rgba(0,255,100,.0)}20%{opacity:1;background:rgba(0,255,100,.3)}100%{opacity:0;background:rgba(0,255,100,.0)}}
@keyframes vFlashW{0%{opacity:0;background:rgba(255,40,40,.0)}20%{opacity:1;background:rgba(255,40,40,.3)}100%{opacity:0;background:rgba(255,40,40,.0)}}
.verdict-icon{
  font-size:clamp(80px,18vw,160px);
  animation:vIconPop .9s cubic-bezier(.34,1.56,.64,1) forwards;
  filter:drop-shadow(0 0 30px currentColor);
}
.verdict-icon.v-correct{color:#00FF88;}
.verdict-icon.v-wrong{color:#FF3333;}
@keyframes vIconPop{0%{transform:scale(0) rotate(-20deg);opacity:0}50%{transform:scale(1.3) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}

/* Countdown overlay (inside modal) */
.countdown-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.88);
  z-index:50;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius);
}
.countdown-num{
  font-family:var(--fh);font-size:100px;color:var(--primary);
  text-shadow:0 0 40px var(--primary);
  animation:countPop .82s ease forwards;
}
@keyframes countPop{0%{transform:scale(1.8);opacity:0}25%{transform:scale(1);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(.5);opacity:0}}

/* MC option shake on wrong */
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.mc-opt.shake{animation:shake .4s ease;}

/* Award / team picker */
.outcome-toggle{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
.outcome-btn{
  flex:1;max-width:160px;padding:10px 0;
  border-radius:var(--radius);border:2px solid;background:transparent;
  font-family:var(--fb);font-weight:900;font-size:14px;cursor:pointer;
  transition:all .12s;
}
.outcome-btn.oc-correct{border-color:var(--primary);color:var(--primary);}
.outcome-btn.oc-correct:hover,.outcome-btn.oc-correct.sel{background:var(--primary);color:#000;}
.outcome-btn.oc-wrong{border-color:var(--danger);color:var(--danger);}
.outcome-btn.oc-wrong:hover,.outcome-btn.oc-wrong.sel{background:var(--danger);color:#fff;}
.team-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px;}
.team-pick-btn{
  padding:10px 18px;border-radius:var(--radius);
  border:3px solid;background:rgba(0,0,0,.3);
  font-family:var(--fb);font-weight:900;font-size:14px;
  cursor:pointer;transition:all .15s;color:#fff;
}
.team-pick-btn:hover:not(:disabled){transform:scale(1.07);filter:brightness(1.25);}
.team-pick-btn:disabled{opacity:.35;cursor:default;}
.team-pick-btn.applied{transform:scale(1.1);}

@media(max-width:480px){
  .loading-shell{width:calc(100vw - 20px);padding:16px 13px 14px;gap:12px;}
  #loading .load-logo{width:54px;}
  .loading-topic{font-size:6px;}
  #loading .loading-stage{height:148px;}
  .generation-console{padding:12px 11px 11px;}
  .generation-step-label{font-size:4.5px;letter-spacing:0;}
  .generation-detail{font-size:4.5px;}
  .mc-grid{grid-template-columns:1fr;}
  .award-grid{grid-template-columns:1fr 1fr;}
  .chip-name{font-size:10px;max-width:60px;padding:5px 3px 5px 7px;}
  .chip-score{font-size:11px;}
  .chip-score-wrap{padding:5px 7px 5px 3px;}
}

@media(max-height:760px){
  #loading{overflow-y:auto;padding:14px;}
  .loading-shell{gap:11px;}
  #loading .load-logo{width:64px;}
  #loading .loading-stage{height:132px;}
  #anim-relay{--scene-scale:.8;--scene-from-scale:.76;}
  #anim-cradle-stage{--scene-scale:.82;--scene-from-scale:.78;}
  #anim-orbit{--scene-scale:.7;--scene-from-scale:.66;}
  .generation-console{padding-top:10px;padding-bottom:9px;}
  .generation-steps{margin-top:10px;}
  .generation-detail{margin-top:9px;}
}

/* ═══════════════════════════════════════════
   SCORE EDIT
═══════════════════════════════════════════ */
.score-edit-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.78);z-index:700;
  align-items:center;justify-content:center;
}
.score-edit-overlay.active{display:flex;}
.score-edit-box{
  background:var(--panel2);
  border:3px solid var(--border);
  box-shadow:6px 6px 0 #000,0 0 28px rgba(191,0,255,.25);
  padding:22px 28px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  min-width:210px;
  animation:modalIn .18s ease;
}
.score-edit-lbl{
  font-family:var(--fp);font-size:7px;color:var(--text2);
  letter-spacing:2px;text-transform:uppercase;
}
.score-edit-name{
  font-family:var(--fp);font-size:9px;text-transform:uppercase;letter-spacing:1px;
}
.score-edit-input{
  background:#0A0A1F;border:3px solid var(--border);
  color:#fff;font-family:var(--fp);font-size:26px;
  width:130px;text-align:center;padding:8px 4px;outline:none;
}
.score-edit-input::-webkit-inner-spin-button,.score-edit-input::-webkit-outer-spin-button{display:none;}
.score-edit-input[type=number]{-moz-appearance:textfield;}
.score-edit-btns{display:flex;gap:10px;}
.score-edit-btn{
  padding:9px 18px;font-family:var(--fp);font-size:8px;

}
.score-edit-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000;}
.score-edit-btn-ok{background:var(--primary);border-color:#00CCAA;color:#000;}
.score-edit-btn-ok:hover{filter:brightness(1.1);}
.score-edit-btn-cancel{background:transparent;border-color:rgba(255,255,255,.25);color:var(--text2);}
.score-edit-btn-cancel:hover{border-color:rgba(255,255,255,.5);color:#fff;}

/* ================================================================
   RESPONSIVE INTERFACE REFINEMENT
   ================================================================ */
html{scroll-behavior:smooth;color-scheme:dark;overflow-x:hidden;}
body{
  min-height:100dvh;
  background:
    radial-gradient(circle at 12% 8%,rgba(0,255,204,.08),transparent 28rem),
    radial-gradient(circle at 88% 12%,rgba(255,0,187,.1),transparent 34rem),
    linear-gradient(180deg,#09091f,#050513 65%,#0b051d);
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,255,204,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(191,0,255,.025) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 85%);
}
body::after{
  content:'';position:fixed;inset:-40%;z-index:-1;pointer-events:none;
  background:conic-gradient(from 0deg,transparent,rgba(0,255,204,.035),transparent 30%,rgba(191,0,255,.045),transparent 65%);
  animation:gameAmbient 30s linear infinite;
}
@keyframes gameAmbient{to{transform:rotate(1turn);}}
#game-wrap{min-height:100dvh;padding-bottom:calc(72px + env(safe-area-inset-bottom));}
.ghdr{min-height:88px;padding:8px clamp(10px,2vw,24px);}
.ghdr::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.06),transparent 54%);animation:headerSignal 8s ease-in-out infinite;}
@keyframes headerSignal{0%,55%{transform:translateX(-100%)}85%,100%{transform:translateX(100%)}}
.ghdr-logo{height:clamp(104px,12vw,156px);}
.ghdr-btn{min-height:40px;padding:8px 11px;transition:transform .14s ease,border-color .16s,box-shadow .16s,color .16s;}
.ghdr-btn:focus-visible,.zoom-btn:focus-visible,.modal button:focus-visible,.score-chip [role="button"]:focus-visible{outline:3px solid #FFD700;outline-offset:3px;}
.score-chip{min-height:38px;background:linear-gradient(180deg,rgba(8,8,27,.97),rgba(4,4,16,.95));transition:transform .16s ease,border-color .16s,box-shadow .16s;}
.score-chip:hover{transform:translateY(-1px);border-color:var(--tc,#00FFCC);box-shadow:3px 4px 0 #000,0 0 14px rgba(0,255,204,.16);}
.chip-score{padding:3px;border-radius:2px;}
.gbottom{max-width:1600px;margin:0 auto;left:0;right:0;}
.gbottom .ghdr-btn{min-width:44px;justify-content:center;}
.board-wrap{
  max-width:1600px;margin:0 auto;padding:clamp(52px,6vw,84px) clamp(10px,2vw,22px) clamp(10px,2vw,22px);
  overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:thin;
  scrollbar-color:rgba(0,255,204,.55) rgba(255,255,255,.06);
}
.board{
  min-width:max(100%,calc(var(--board-cols,4) * 112px));
  gap:clamp(6px,1vw,11px);padding:clamp(7px,1vw,12px);
  border:1px solid rgba(191,0,255,.18);
  background:linear-gradient(145deg,rgba(13,13,34,.72),rgba(5,5,18,.48));
  box-shadow:0 18px 50px rgba(0,0,0,.28),inset 0 0 32px rgba(0,0,0,.2);
}
.board-cell{
  border-radius:5px;transform:translateY(8px);opacity:0;
  animation:cellReveal .36s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay:calc(var(--cell-i,0) * 22ms);
}
@keyframes cellReveal{to{transform:translateY(0);opacity:1}}
.cat-cell{
  min-height:calc(66px * var(--bz));padding:12px 9px;
  background:linear-gradient(145deg,rgba(22,10,48,.96),rgba(7,16,34,.96));
  border-color:rgba(191,0,255,.72);box-shadow:inset 0 1px rgba(255,255,255,.04),0 5px 16px rgba(0,0,0,.22);
}
.q-cell{
  min-height:calc(82px * var(--bz));isolation:isolate;
  background:linear-gradient(145deg,rgba(20,20,48,.98),rgba(11,11,31,.98));
  box-shadow:inset 0 1px rgba(255,255,255,.035),0 7px 18px rgba(0,0,0,.2);
}
.q-cell::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 25%,rgba(0,255,204,.07),transparent 70%);transform:translateX(-110%);transition:transform .5s ease;}
.q-cell:hover:not(.used){transform:translateY(-3px) scale(1.012);box-shadow:0 9px 24px rgba(0,0,0,.26),0 0 18px rgba(0,255,204,.18);}
.q-cell:hover:not(.used)::before{transform:translateX(110%);}
.q-cell:focus-visible{outline:3px solid #FFD700;outline-offset:3px;border-color:var(--primary);}
.cell-pts{text-shadow:0 0 16px rgba(255,0,187,.46),2px 2px 0 #000;}
.modal-overlay{padding:clamp(10px,2vw,22px);background:rgba(2,2,12,.82);backdrop-filter:blur(10px) saturate(.8);}
.modal{
  width:min(100%,760px);max-height:min(92dvh,900px);
  border-color:rgba(191,0,255,.9);
  background:linear-gradient(150deg,rgba(17,17,43,.99),rgba(8,8,28,.99));
  box-shadow:0 24px 80px rgba(0,0,0,.58),0 0 34px rgba(191,0,255,.18);
  animation:modalRefined .24s cubic-bezier(.2,.85,.25,1);
}
@keyframes modalRefined{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:16px clamp(16px,3vw,24px);background:rgba(8,8,28,.74);}
.modal-body{padding:clamp(16px,3vw,26px);}
.modal-close{width:42px;height:42px;}
.q-text{font-size:clamp(18px,2.3vw,25px);line-height:1.42;margin:4px auto 22px;max-width:680px;text-wrap:balance;}
.mc-grid{gap:11px;margin-bottom:18px;}
.mc-opt{min-height:62px;padding:13px 15px;font-size:clamp(13px,1.6vw,16px);line-height:1.35;box-shadow:inset 0 1px rgba(255,255,255,.025);transition:transform .14s,border-color .14s,background .14s;}
.mc-opt:hover:not(:disabled){transform:translateY(-2px);}
.mc-letter{width:30px;height:30px;}
.answer-box{padding:15px 17px;margin-bottom:15px;background:linear-gradient(90deg,rgba(0,255,204,.1),rgba(0,255,204,.035));}
.answer-text{font-size:clamp(15px,2vw,19px);}
.btn-reveal,.btn-done{min-height:52px;transition:transform .14s,filter .14s,box-shadow .14s;}
.btn-reveal:hover,.btn-done:hover{transform:translateY(-2px);}
.outcome-btn,.team-pick-btn{min-height:46px;}
.drawing-canvas{min-height:220px;}
.loading-shell{
  width:min(94vw,560px);padding:clamp(18px,3vw,28px);gap:clamp(14px,2vw,20px);
  align-items:stretch;
  border:1px solid rgba(0,255,204,.22);
  background:
    linear-gradient(145deg,rgba(13,13,40,.9),rgba(4,4,18,.95)),
    radial-gradient(circle at 50% 0,rgba(255,0,187,.12),transparent 55%);
  box-shadow:8px 10px 0 rgba(0,0,0,.42),0 28px 90px rgba(0,0,0,.42),0 0 48px rgba(0,255,204,.055);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.loading-shell::before{
  content:'';display:block;position:absolute;left:24px;top:-1px;width:88px;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--primary));box-shadow:0 0 14px rgba(0,255,204,.5);
}
.loading-shell::after{
  content:'';display:block;position:absolute;right:24px;bottom:-1px;width:88px;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--accent));box-shadow:0 0 14px rgba(255,0,187,.45);
}
.loading-top{display:flex;align-items:center;gap:clamp(12px,2.4vw,20px);min-width:0;}
.load-logo{width:clamp(62px,15vw,94px);max-width:none;height:auto;flex:none;}
.loading-intro{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
.loading-topic{
  min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:#fff;font-family:var(--fp);font-size:clamp(7px,.9vw,9px);letter-spacing:1.1px;text-transform:uppercase;
  text-shadow:0 0 9px rgba(255,0,187,.3);
}
.loading-spec{
  align-self:flex-start;padding:5px 8px;border:1px solid rgba(0,255,204,.25);background:rgba(0,255,204,.055);
  color:var(--primary);font-family:var(--fp);font-size:5px;letter-spacing:.7px;white-space:nowrap;
}
.loading-stage{width:100%;height:clamp(150px,26vw,196px);border:1px solid rgba(255,255,255,.07);overflow:hidden;}
#anim-relay{--scene-scale:.9;--scene-from-scale:.86;}
#anim-cradle-stage{--scene-scale:.92;--scene-from-scale:.88;}
#anim-orbit{--scene-scale:.82;--scene-from-scale:.78;}
.loading-stage .loading-scene{transform:translateY(10px) scale(var(--scene-from-scale,.96));}
.loading-stage .loading-scene.is-active{transform:translateY(0) scale(var(--scene-scale,1));}
.loading-progress{width:100%;display:grid;gap:8px;}
.loading-progress-meta{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.loading-progress .load-text{margin:0;text-align:left;}
.generation-percent{
  color:var(--primary);font-family:var(--fp);font-size:7px;font-variant-numeric:tabular-nums;
  text-shadow:0 0 10px rgba(0,255,204,.45);
}
.loading-progress .load-bar-wrap{width:100%;height:10px;}
.generation-console{width:100%;padding:16px 17px 14px;border-color:rgba(0,255,204,.32);}
.generation-console-head{font-size:7px;}
.generation-step-label{font-size:5.5px;}
.generation-detail{font-size:5.5px;}
.loading-error-back{min-height:46px;display:inline-flex;align-items:center;justify-content:center;transition:transform .14s,filter .14s,border-color .14s;}
.loading-error-back:hover{transform:translateY(-2px);}
.loading-error-back:focus-visible{outline:3px solid #FFD700;outline-offset:3px;}
#loading.has-error .loading-shell{border-color:rgba(255,68,110,.46);box-shadow:8px 10px 0 rgba(0,0,0,.42),0 28px 90px rgba(0,0,0,.42),0 0 42px rgba(255,68,110,.1);}
#loading.has-error .loading-progress-meta{justify-content:center;}
#loading.has-error .generation-percent{display:none;}
#winner-screen{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 25%,rgba(191,0,255,.18),transparent 35rem);}
.final-card{transition:transform .18s,box-shadow .18s;}.final-card:hover{transform:translateY(-4px);box-shadow:7px 9px 0 #000,0 0 22px currentColor;}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}

function cleanText(value){
  return String(value ?? '').trim();
}

function normalizeAnswerKey(value){
  return cleanText(value)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/["'`]/g,'')
    .replace(/[.,;:!?]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}

function findCorrectOptionIndex(options, answer, correctIndex){
  const strictAnswerKey=cleanText(answer)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/\s+/g,' ')
    .trim();
  const strictMatch=options.findIndex(opt=>cleanText(opt)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/\s+/g,' ')
    .trim()===strictAnswerKey);
  if(strictMatch>=0) return strictMatch;

  const answerKey=normalizeAnswerKey(answer);
  const normalizedOptions=options.map(normalizeAnswerKey);
  const normalizedMatches=normalizedOptions
    .map((optionKey,index)=>optionKey===answerKey ? index : -1)
    .filter(index=>index>=0);
  if(normalizedMatches.length===1) return normalizedMatches[0];
  if(Number.isInteger(correctIndex) && correctIndex>=0 && correctIndex<options.length) return correctIndex;

  const fuzzyMatches=normalizedOptions
    .map((optionKey,index)=>optionKey.includes(answerKey) || answerKey.includes(optionKey) ? index : -1)
    .filter(index=>index>=0);
  if(fuzzyMatches.length===1) return fuzzyMatches[0];
  return -1;
}

function sanitizeQuestion(rawQuestion, colIndex, rowIndex){
  if(!rawQuestion || typeof rawQuestion!=='object'){
    throw new Error(`Invalid question object at ${colIndex}:${rowIndex}`);
  }

  const question=cleanText(rawQuestion.q ?? rawQuestion.question);
  let answer=cleanText(rawQuestion.a ?? rawQuestion.answer);
  if(!question){
    throw new Error(`Missing question text at ${colIndex}:${rowIndex}`);
  }

  const isDrawing=rawQuestion.d===1 || rawQuestion.d===true || !!rawQuestion.isDrawing;
  const sourceOptions=rawQuestion.o ?? rawQuestion.options;
  const rawOptions=Array.isArray(sourceOptions)
    ? sourceOptions.map(cleanText).filter(Boolean).slice(0,4)
    : [];
  const sourceCorrectIndex=rawQuestion.i ?? rawQuestion.correctIndex;
  const parsedCorrectIndex=Number.isInteger(sourceCorrectIndex)
    ? sourceCorrectIndex
    : Number.parseInt(sourceCorrectIndex,10);

  // Compact multiple-choice responses do not repeat the correct option as a
  // separate answer string. Expand it here into the UI's existing shape.
  if(!answer && rawOptions.length===4 && parsedCorrectIndex>=0 && parsedCorrectIndex<4){
    answer=rawOptions[parsedCorrectIndex];
  }
  if(!answer){
    throw new Error(`Missing answer text at ${colIndex}:${rowIndex}`);
  }

  if(isDrawing){
    return {question,answer,type:'drawing',options:[],correctIndex:0,isDrawing:true};
  }

  if(rawOptions.length===4){
    const correctIndex=findCorrectOptionIndex(rawOptions,answer,parsedCorrectIndex);
    if(correctIndex>=0){
      return {question,answer:rawOptions[correctIndex],type:'multiple',options:rawOptions,correctIndex,isDrawing:false};
    }
  }

  return {question,answer,type:'open',options:[],correctIndex:0,isDrawing:false};
}

function rebalanceMultipleChoiceAnswers(game){
  const multipleQuestions=[];
  game.questions.forEach(col=>{
    col.forEach(question=>{
      if(question && Array.isArray(question.options) && question.options.length===4){
        multipleQuestions.push(question);
      }
    });
  });

  if(!multipleQuestions.length) return game;

  const offset=multipleQuestions.length===1 ? 1+Math.floor(Math.random()*3) : Math.floor(Math.random()*4);
  multipleQuestions.forEach((question,index)=>{
    const targetIndex=(index+offset)%4;
    if(question.correctIndex===targetIndex) return;
    const correctOption=question.options[question.correctIndex];
    const otherOptions=question.options.filter((_,optionIndex)=>optionIndex!==question.correctIndex);
    question.options=[
      ...otherOptions.slice(0,targetIndex),
      correctOption,
      ...otherOptions.slice(targetIndex)
    ];
    question.correctIndex=targetIndex;
  });

  return game;
}

function extractJsonObject(text){
  const source=cleanText(String(text ?? '').replace(/```json|```/gi,''));
  const start=source.indexOf('{');
  if(start<0) throw new Error('No JSON object found in response');

  let depth=0;
  let inString=false;
  let isEscaped=false;

  for(let i=start;i<source.length;i++){
    const char=source[i];

    if(inString){
      if(isEscaped){
        isEscaped=false;
      }else if(char==='\\'){
        isEscaped=true;
      }else if(char==='"'){
        inString=false;
      }
      continue;
    }

    if(char==='"'){
      inString=true;
      continue;
    }
    if(char==='{'){
      depth++;
      continue;
    }
    if(char==='}'){
      depth--;
      if(depth===0) return source.slice(start,i+1);
    }
  }

  throw new Error('Incomplete JSON object in response');
}

function transposeQuestionGrid(grid){
  return Array.from({length:grid[0].length},(_,colIndex)=>{
    return grid.map(row=>row[colIndex]);
  });
}

function normalizeQuestionColumns(rawQuestions, expectedCols, expectedRows){
  if(!Array.isArray(rawQuestions)){
    throw new Error('Invalid game schema');
  }

  const hasColumnShape=rawQuestions.length>=expectedCols
    && rawQuestions.slice(0,expectedCols).every(column=>Array.isArray(column) && column.length>=expectedRows);
  if(hasColumnShape){
    return rawQuestions.slice(0,expectedCols).map(column=>column.slice(0,expectedRows));
  }

  const hasRowShape=rawQuestions.length>=expectedRows
    && rawQuestions.slice(0,expectedRows).every(row=>Array.isArray(row) && row.length>=expectedCols);
  if(hasRowShape){
    const trimmedRows=rawQuestions.slice(0,expectedRows).map(row=>row.slice(0,expectedCols));
    return transposeQuestionGrid(trimmedRows);
  }

  const hasFlatShape=rawQuestions.length>=expectedCols*expectedRows
    && rawQuestions.slice(0,expectedCols*expectedRows).every(item=>item && typeof item==='object' && !Array.isArray(item));
  if(hasFlatShape){
    return Array.from({length:expectedCols},(_,colIndex)=>{
      const start=colIndex*expectedRows;
      return rawQuestions.slice(start,start+expectedRows);
    });
  }

  throw new Error('Unexpected game dimensions');
}

function formatGenerationStatus(template,values){
  return Object.entries(values).reduce((text,[key,value])=>{
    return text.replaceAll(`{${key}}`,String(value));
  },template);
}

function parseExplicitCategories(topic,expectedCount){
  const categories=cleanText(topic)
    .split(/[,;|\n]+/)
    .map(value=>value.replace(/^\s*(?:[-*]+|\d+[.)])\s*/, '').trim())
    .filter(Boolean);
  if(categories.length!==expectedCount || categories.some(category=>category.length>50)) return null;
  const normalized=categories.map(normalizeAnswerKey);
  return new Set(normalized).size===categories.length ? categories : null;
}

async function requestQuizAction(body,signal){
  let res;
  try{
    res=await fetch(GENERATION_API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),
      signal
    });
  }catch(error){
    throw new Error('AI server unavailable',{cause:error});
  }
  if(!res.ok){
    let apiError=`API ${res.status}`;
    try{
      const errorData=await res.json();
      const message=errorData?.error?.message || errorData?.error || errorData?.message;
      if(message) apiError=`${message} (API ${res.status})`;
    }catch(_){
      // Keep the status-only error when the API did not return JSON.
    }
    throw new Error(apiError);
  }

  let data;
  try{
    data=await res.json();
  }catch(_){
    throw new Error('AI route returned invalid JSON');
  }
  if(!data?.answer) throw new Error('AI route returned an empty response');
  return JSON.parse(extractJsonObject(data.answer));
}

function createGenerationToken(){
  if(globalThis.crypto?.randomUUID) return crypto.randomUUID();
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;

function buildQuizSpec(seed,generationId){
  const isYear6Coding=cfg.preset==='year6-coding'
    || /^Year 6 Computational Thinking\b/i.test(cfg.prompt||'');
  return {
    topic:cfg.prompt,
    columns:cfg.numCols,
    rows:cfg.numRows,
    difficulty:cfg.difficulty,
    questionType:cfg.qType,
    language:cfg.qLang,
    seed,
    generationId,
    audience:isYear6Coding ? 'year6-pre-coding' : undefined
  };
}

async function planQuiz(spec,signal){
  const explicit=parseExplicitCategories(cfg.prompt,cfg.numCols);
  const plan=await requestQuizAction({
    action:'quiz-plan',
    quiz:{...spec,explicitCategories:explicit||undefined}
  },signal);
  const categories=Array.isArray(plan?.categories) ? plan.categories.map(cleanText) : [];
  const slots=Array.isArray(plan?.slots) ? plan.slots : [];
  const expectedSlotIds=[];
  for(let columnIndex=0;columnIndex<cfg.numCols;columnIndex++){
    for(let rowIndex=0;rowIndex<cfg.numRows;rowIndex++) expectedSlotIds.push(`${columnIndex}-${rowIndex}`);
  }
  if(
    categories.length!==cfg.numCols ||
    categories.some(category=>!category) ||
    new Set(categories.map(normalizeAnswerKey)).size!==categories.length ||
    slots.length!==expectedSlotIds.length ||
    slots.some((slot,index)=>slot?.slotId!==expectedSlotIds[index]) ||
    !Number.isInteger(plan?.batchSize) || plan.batchSize<1 || plan.batchSize>8
  ){
    throw new Error('AI returned an invalid board plan');
  }
  const kind=typeof plan.kind==='string' && plan.kind ? plan.kind : undefined;
  return {categories,slots,batchSize:plan.batchSize,kind};
}

async function generateQuestionBatch(spec,categories,slotIds,excludedQuestions,signal,attempt){
  const response=await requestQuizAction({
    action:'quiz-batch',
    quiz:{
      ...spec,
      categories,
      slotIds,
      excludedQuestions,
      attempt
    }
  },signal);
  const questions=Array.isArray(response?.questions)?response.questions:[];
  const failedSlots=Array.isArray(response?.failedSlots)
    ? response.failedSlots.map(cleanText).filter(Boolean)
    : [];
  if(questions.length+failedSlots.length!==slotIds.length){
    throw new Error('AI returned an incomplete question batch');
  }
  return {questions,repaired:Number(response.repaired)||0,failedSlots};
}

function validateCompletedGame(game){
  if(game.categories.length!==cfg.numCols || game.questions.length!==cfg.numCols){
    throw new Error('Generated game dimensions are invalid');
  }
  const prompts=[];
  let availableCount=0;
  game.questions.forEach((column,colIndex)=>{
    if(column.length!==cfg.numRows) throw new Error(`Invalid category size at ${colIndex}`);
    column.forEach(question=>{
      if(!question) return;
      availableCount+=1;
      const promptKey=normalizeAnswerKey(question.question);
      if(prompts.includes(promptKey)) throw new Error('Generated quiz contains a repeated question');
      prompts.push(promptKey);
      if(question.options.length){
        const optionKeys=question.options.map(normalizeAnswerKey);
        if(new Set(optionKeys).size!==4) throw new Error('Generated quiz contains duplicate choices');
        if(question.correctIndex<0 || question.correctIndex>3){
          throw new Error('Generated quiz contains an invalid correct answer');
        }
      }
    });
  });
  if(!availableCount) throw new Error('Generated quiz has no usable questions');
  return game;
}

function sanitizeGameData(rawGame,{rebalance=true}={}){
  const expectedCols=cfg.numCols;
  const expectedRows=cfg.numRows;
  const rawCategories=rawGame?.c ?? rawGame?.categories;
  const rawQuestions=rawGame?.qs ?? rawGame?.questions;

  if(!rawGame || !Array.isArray(rawCategories) || !Array.isArray(rawQuestions)){
    throw new Error('Invalid game schema');
  }

  const categories=rawCategories.slice(0,expectedCols).map((category,index)=>{
    const label=cleanText(category);
    return label || `Category ${index+1}`;
  });
  while(categories.length<expectedCols){
    categories.push(`Category ${categories.length+1}`);
  }

  const normalizedColumns=normalizeQuestionColumns(rawQuestions,expectedCols,expectedRows);
  const questions=normalizedColumns.map((column,colIndex)=>{
    if(!Array.isArray(column) || column.length<expectedRows){
      throw new Error(`Unexpected question column size at ${colIndex}`);
    }
    return column.slice(0,expectedRows).map((question,rowIndex)=>
      question ? sanitizeQuestion(question,colIndex,rowIndex) : null
    );
  });

  const game={categories,questions};
  return rebalance ? rebalanceMultipleChoiceAnswers(game) : game;
}

function gameCacheFingerprint(){
  return JSON.stringify([
    GENERATION_PROVIDER,
    cfg.prompt,cfg.numCols,cfg.numRows,cfg.difficulty,cfg.qType,cfg.qLang
  ]);
}

function readCachedGame(){
  try{
    const cached=JSON.parse(sessionStorage.getItem(GAME_CACHE_KEY)||'null');
    if(!cached || cached.fingerprint!==gameCacheFingerprint()) return null;
    return sanitizeGameData(cached.game,{rebalance:false});
  }catch(error){
    console.warn('Ignoring invalid cached game',error);
    sessionStorage.removeItem(GAME_CACHE_KEY);
    return null;
  }
}

function cacheGame(game){
  try{
    sessionStorage.setItem(GAME_CACHE_KEY,JSON.stringify({
      fingerprint:gameCacheFingerprint(),
      game
    }));
  }catch(error){
    // Storage may be unavailable in private browsing; gameplay still works.
    console.warn('Unable to cache generated game',error);
  }
}

async function generateGame(){
  const controller=new AbortController();
  const seed=createGenerationToken();
  const generationId=createGenerationToken();
  const spec=buildQuizSpec(seed,generationId);
  try{
    const {categories,slots,batchSize,kind}=await planQuiz(spec,controller.signal);
    if(kind) spec.kind=kind;
    const slotById=new Map(slots.map(slot=>[slot.slotId,slot]));
    const generated=new Map();
    const generatedPrompts=new Set();
    const excludedQuestions=[];
    let firstError=null;
    let pendingSlots=slots;

    // Generate in batches, a few at a time. Failed or duplicate slots are
    // retried in a later round and only the remaining gaps are reported as
    // missing, so one bad question never discards the whole board.
    for(let round=1;round<=MAX_QUESTION_ROUNDS && pendingSlots.length;round++){
      const failedSlotIds=[];
      const batches=[];
      for(let offset=0;offset<pendingSlots.length;offset+=batchSize){
        batches.push(pendingSlots.slice(offset,offset+batchSize));
      }
      let nextBatchIndex=0;
      const worker=async()=>{
        while(nextBatchIndex<batches.length){
          const batchSlots=batches[nextBatchIndex++];
          try{
            const batch=await generateQuestionBatch(
              spec,
              categories,
              batchSlots.map(slot=>slot.slotId),
              excludedQuestions,
              controller.signal,
              round
            );
            batch.questions.forEach(question=>{
              const promptKey=normalizeAnswerKey(question.q ?? question.question);
              if(!promptKey || generatedPrompts.has(promptKey)){
                failedSlotIds.push(question.slotId);
                return;
              }
              generatedPrompts.add(promptKey);
              generated.set(question.slotId,question);
              excludedQuestions.push(cleanText(question.q ?? question.question));
            });
            failedSlotIds.push(...batch.failedSlots);
          }catch(error){
            firstError=firstError||error;
            console.warn('Question batch failed',error);
            failedSlotIds.push(...batchSlots.map(slot=>slot.slotId));
          }
        }
      };
      await Promise.all(Array.from({length:Math.min(BATCH_CONCURRENCY,batches.length)},worker));
      pendingSlots=failedSlotIds.map(slotId=>slotById.get(slotId)).filter(Boolean);
    }

    if(!generated.size){
      throw firstError || new Error('No questions could be generated');
    }

    const draftQuestions=[...generated.values()];
    const missingSlotIds=slots
      .map(slot=>slot.slotId)
      .filter(slotId=>!generated.has(slotId));
    const finalized=await requestQuizAction({
      action:'quiz-validate',
      quiz:{...spec,categories,questions:draftQuestions,missingSlotIds}
    },controller.signal);
    if(finalized?.ready!==true || !Array.isArray(finalized.questions)){
      throw new Error('Quiz did not pass final validation');
    }
    const questions=Array.from({length:cfg.numCols},()=>Array(cfg.numRows).fill(null));
    finalized.questions.forEach(question=>{
      const slot=slotById.get(question.slotId)||slots.find(candidate=>candidate.slotId===question.slotId);
      if(!slot) throw new Error(`Unexpected final slot ${question.slotId}`);
      questions[slot.categoryIndex][slot.rowIndex]=sanitizeQuestion(
        question,
        slot.categoryIndex,
        slot.rowIndex
      );
    });
    const game=validateCompletedGame({categories,questions});
    return rebalanceMultipleChoiceAnswers(game);
  }catch(error){
    controller.abort();
    throw error;
  }
}

function requestGeneratedGame(){
  if(generationRequest) return generationRequest;
  generationRequest=generateGame().finally(()=>{generationRequest=null;});
  return generationRequest;
}

function renderGenerationSteps(){
  const G=GT[lang]||GT.en;
  const title=document.getElementById('generation-console-title');
  const stepsContainer=document.getElementById('generation-steps');
  if(title) title.textContent=G.creationPipeline;
  if(!stepsContainer) return;

  stepsContainer.replaceChildren();
  G.generationSteps.forEach((label,index)=>{
    const step=document.createElement('div');
    step.className='generation-step';
    step.dataset.step=String(index);

    const node=document.createElement('span');
    node.className='generation-node';
    const number=document.createElement('span');
    number.textContent=String(index+1).padStart(2,'0');
    node.appendChild(number);

    const text=document.createElement('span');
    text.className='generation-step-label';
    text.textContent=label;
    step.append(node,text);
    stepsContainer.appendChild(step);
  });
}

function setGenerationStep(index){
  const G=GT[lang]||GT.en;
  const lastIndex=G.generationSteps.length-1;
  const nextStep=Math.min(lastIndex,Math.max(0,index));
  generationProgressStep=nextStep;
  document.querySelectorAll('.generation-step').forEach((step,stepIndex)=>{
    step.classList.toggle('is-complete',stepIndex<generationProgressStep);
    step.classList.toggle('is-active',stepIndex===generationProgressStep);
  });

  const detail=document.getElementById('generation-detail');
  const nextDetail=G.generationDetails[generationProgressStep];
  if(detail && detail.textContent!==nextDetail) detail.textContent=nextDetail;
}

function renderGenerationProgress(percent){
  const progress=Math.min(100,Math.max(0,percent));
  document.querySelector('.loading-shell')?.style.setProperty(
    '--load-progress',
    `${progress.toFixed(1)}%`
  );
  const roundedProgress=Math.round(progress);
  const progressLabel=document.getElementById('generation-percent');
  const progressBar=document.getElementById('generation-progress');
  if(progressLabel) progressLabel.textContent=`${roundedProgress}%`;
  if(progressBar) progressBar.setAttribute('aria-valuenow',String(roundedProgress));
}

function updateGenerationProgress(){
  if(!generationStartedAt) return;
  const elapsed=Date.now()-generationStartedAt;
  const elapsedSeconds=Math.floor(elapsed/1000);
  const elapsedLabel=document.getElementById('generation-elapsed');
  if(elapsedLabel){
    const minutes=String(Math.floor(elapsedSeconds/60)).padStart(2,'0');
    const seconds=String(elapsedSeconds%60).padStart(2,'0');
    elapsedLabel.textContent=`${minutes}:${seconds}`;
  }
  const simulatedProgress=Math.min(100,(elapsed/GENERATION_SIMULATION_MS)*100);
  const stepCount=(GT[lang]||GT.en).generationSteps.length;
  setGenerationStep(Math.min(stepCount-1,Math.floor((simulatedProgress/100)*stepCount)));
  renderGenerationProgress(simulatedProgress);
}

function startGenerationProgress(){
  stopGenerationProgress();
  generationProgressStep=0;
  generationStartedAt=Date.now();
  renderGenerationSteps();
  setGenerationStep(0);
  renderGenerationProgress(0);
  updateGenerationProgress();
  generationProgressTimer=setInterval(updateGenerationProgress,250);
}

function stopGenerationProgress(){
  if(generationProgressTimer){
    clearInterval(generationProgressTimer);
    generationProgressTimer=null;
  }
}

function completeGenerationProgress(){
  stopGenerationProgress();
  setGenerationStep((GT[lang]||GT.en).generationSteps.length-1);
  renderGenerationProgress(100);
}

function setActiveLoadingScene(index) {
  const scenes=['anim-relay','anim-cradle-stage','anim-orbit'];
  activeLoadingSceneIndex=((index%scenes.length)+scenes.length)%scenes.length;
  scenes.forEach((id,sceneIndex)=>{
    const el=document.getElementById(id);
    if(el) el.classList.toggle('is-active',sceneIndex===activeLoadingSceneIndex);
  });
}

function startLoadingSceneCycle() {
  stopLoadingSceneCycle();
  setActiveLoadingScene(Math.floor(Math.random()*3));
  loadingSceneTimer=setInterval(()=>{
    setActiveLoadingScene(activeLoadingSceneIndex+1);
  },4200);
}

function stopLoadingSceneCycle() {
  if(loadingSceneTimer){
    clearInterval(loadingSceneTimer);
    loadingSceneTimer=null;
  }
}

function retryGeneration(){
  window.location.reload();
}

async function boot() {
  startLoadingSceneCycle();

  const raw=localStorage.getItem('jamboo_config');
  if(!raw){
    stopLoadingSceneCycle();
    alert(GT.en.noConfig);
    window.location.href='index.html';
    return;
  }
  cfg=JSON.parse(raw);
  lang=cfg.lang||'en';
  teams=cfg.teams.map(t=>({...t,score:0}));
  applyLabels();
  const loadingTopic=document.getElementById('loading-topic');
  const loadingSpec=document.getElementById('loading-spec');
  if(loadingTopic){
    loadingTopic.textContent=cleanText(cfg.prompt)||'Custom quiz';
    loadingTopic.title=loadingTopic.textContent;
  }
  if(loadingSpec){
    const questionCount=cfg.numCols*cfg.numRows;
    loadingSpec.textContent=`${cfg.numCols} × ${cfg.numRows} · ${questionCount}`;
  }
  document.getElementById('load-text').textContent=GT[lang].generating;

  gameData=readCachedGame();
  if(!gameData){
    startGenerationProgress();
    try {
      gameData=await requestGeneratedGame();
      cacheGame(gameData);
    } catch(e) {
      console.error(e);
      stopLoadingSceneCycle();
      stopGenerationProgress();
      const offline=String(e?.message||'').includes('AI server unavailable');
      document.getElementById('load-text').textContent=offline ? GT[lang].aiOffline : GT[lang].errorGen;
      document.getElementById('loading-error-actions').hidden=false;
      document.getElementById('loading').classList.add('has-error');
      return;
    }
  }

  buildBoard();
  renderScorebar();
  if(generationStartedAt){
    completeGenerationProgress();
    await new Promise(resolve=>setTimeout(resolve,450));
  }
  stopLoadingSceneCycle();
  stopGenerationProgress();
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('game-wrap').classList.add('ready');
}
